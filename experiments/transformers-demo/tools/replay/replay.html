<!doctype html><html><head><meta charset="utf-8"></head><body><button id="go">go</button><pre id="log"></pre>
<script>
const log = (m) => { document.getElementById('log').textContent += m + '\n'; console.log('[replay] ' + m); };
window.__out = { phase: 'idle' };
window.__run = async (cfg) => {
  const o = window.__out; o.phase = 'running'; o.rows = []; o.cfg = { variant: cfg.variant, n: cfg.turns.length };
  const sessions = new Map(); let created = 0;
  const tenantPrompt = (org) => cfg.systemPrompt + `\nThe association is "${org}". Anything about ${org} itself — its policies, standards, programs, processes, people, documents, events, training, or what Betty knows or has content about — is needs_research / betty_research, even if phrased casually ("tell me about ${org}", "introduce me", "what topics do you know").`;
  const getSession = async (key, prompt) => {
    let s = sessions.get(key);
    if (s && s.contextUsage > s.contextWindow * 0.8) { s.destroy(); sessions.delete(key); s = null; }
    if (!s) { s = await LanguageModel.create({ initialPrompts: [{ role: 'system', content: prompt }] }); sessions.set(key, s); created++; }
    return s;
  };
  const parse = (raw) => { try { return JSON.parse(raw); } catch { const m = raw.match(/\{[\s\S]*?\}/); if (m) { try { return JSON.parse(m[0]); } catch {} } return null; } };
  let i = 0;
  for (const t of cfg.turns) {
    let prompt = t.Message;
    if (cfg.variant === 'context' && t.PrevUser) {
      prompt = `Conversation so far:\nMember: ${t.PrevUser}\nBetty: ${t.PrevAi || '(no reply recorded)'}\n\nNew member message: ${t.Message}`;
    }
    const key = cfg.variant === 'tenant' ? (t.Org || 'generic') : 'default';
    const sys = cfg.variant === 'tenant' ? tenantPrompt(t.Org || 'the association') : cfg.systemPrompt;
    const s = await getSession(key, sys);
    const t0 = performance.now(); let raw = '', err = null;
    try { raw = await s.prompt(prompt, { responseConstraint: cfg.schema }); } catch (e) { err = String(e); s.destroy(); sessions.delete(key); }
    const ms = Math.round(performance.now() - t0);
    const d = parse(raw);
    o.rows.push({ i, Researched: t.Researched, Intent: d?.Intent ?? null, Agent: d?.TargetAgent ?? null, Conf: d?.Confidence ?? null, ms, err, raw: d ? undefined : raw.slice(0, 120) });
    if (++i % 50 === 0) log(`${cfg.variant}: ${i}/${cfg.turns.length} sessions=${created}`);
  }
  sessions.forEach((s) => s.destroy());
  o.sessionsCreated = created; o.phase = 'done';
};
</script></body></html>
