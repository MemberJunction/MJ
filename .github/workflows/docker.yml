name: Build and publish docker images

# Docker `:latest` must mean the same thing npm's `latest` dist-tag means:
# the newest CERTIFIED build (LTS process doc §4.3). It never follows the fast
# channel.
#
# Since the 6.x era opened, everything published through `next -> main` is an
# Edge prerelease (`6.1.0-edge.N`), so an unguarded run here would drag Docker
# `:latest` onto uncertified bits while npm `latest` correctly stayed put. The
# `channel` job below therefore skips any prerelease version.
#
# Consequence, stated plainly: during the Edge era this workflow auto-publishes
# nothing. Certified and line builds ship from `lts/*` via publish-lts.yml,
# which does not trigger this workflow — so a certified image is produced by
# dispatching this workflow manually against the certified tag. Wiring line
# publishes to Docker, and deciding whether an `:edge` tag is wanted at all,
# are open items (process doc §15 item 4). Until then: no Docker image for
# Edge builds, by decision, not by omission.

on:
  workflow_run:
    workflows: [Build and publish new package versions]
    branches: [main]
    types:
      - completed

  workflow_dispatch:

jobs:
  channel:
    name: Decide whether this version gets an image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      publish: ${{ steps.decide.outputs.PUBLISH }}
    steps:
      - name: Error out if the trigger did not succeed
        run: |
          if [ "${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'success' }}" != "success" ]; then
            echo "::error::The triggering workflow did not succeed"
            exit 1
          fi

      # A workflow_run checkout without a ref resolves to the DEFAULT branch tip —
      # which is `next` here, not the released `main` commit the tag will claim. Pin
      # to the triggering run's head SHA so the version (and everything else) is read
      # from the commit that was actually published. Manual dispatch falls back to
      # the dispatched ref's SHA.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get version
        id: version
        run: |
          # Use MJServer package since core and global are pinned at 2.100.3
          VERSION=$(jq -r .version packages/MJServer/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # A prerelease suffix (`-edge.N`, `-rc.N`, …) means uncertified bits.
      # The guard keys off the version grammar rather than the trigger, so it
      # also protects a manual dispatch accidentally aimed at `next`.
      - name: Decide on the channel
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          case "$VERSION" in
            *-*)
              echo "PUBLISH=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a prerelease — skipping the Docker build. Docker :latest tracks certified builds only (LTS process doc §4.3)."
              ;;
            *)
              echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is an unsuffixed release — building and tagging :latest."
              ;;
          esac

  api:
    needs: channel
    if: needs.channel.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # Same head-SHA pin as the channel job: the image content (MJAPI source,
      # migrations, Dockerfile) must come from the released commit, not next's tip.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.CRAIG_BC_DOCKER_USERNAME }}
          password: ${{ secrets.CRAIG_BC_DOCKER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Boot verification: never push an image that has never been started. ----
      # The container's real boot sequence (mj migrate → mj codegen → pm2-runtime,
      # docker/MJAPI/entrypoint.sh) used to execute for the first time on a customer
      # machine. Build the amd64 image locally first, boot it against a throwaway SQL
      # Server, and require MJServer's unauthenticated /healthcheck to answer before
      # any registry push. (arm64 is still built via QEMU and not booted — running a
      # full migrate+codegen under emulation is prohibitively slow; accepted gap.)
      - name: Build amd64 image for boot verification
        uses: docker/build-push-action@v6
        with:
          load: true
          push: false
          tags: memberjunction/api:ci-boot-check
          platforms: linux/amd64
          file: docker/MJAPI/Dockerfile
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot image against a fresh SQL Server and verify /healthcheck
        run: |
          set -u
          docker network create boot-net
          docker run --rm -d --network boot-net --name sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD='VeryStr0ngP@ssw0rd' \
            mcr.microsoft.com/mssql/server:2022-latest

          echo "Waiting for SQL Server..."
          SQL_READY=0
          for i in $(seq 1 60); do
            if docker run --rm --network boot-net mcr.microsoft.com/mssql-tools \
                 /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "SELECT 1" >/dev/null 2>&1; then
              SQL_READY=1; break
            fi
            sleep 2
          done
          if [ "$SQL_READY" != "1" ]; then echo "::error::SQL Server never became ready"; exit 1; fi
          docker run --rm --network boot-net mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "CREATE DATABASE [mj];"

          docker run -d --network boot-net --name mjapi -p 4000:4000 \
            -e DB_HOST=sql -e DB_PORT=1433 -e DB_DATABASE=mj \
            -e DB_USERNAME=sa -e DB_PASSWORD='VeryStr0ngP@ssw0rd' \
            -e CODEGEN_DB_USERNAME=sa -e CODEGEN_DB_PASSWORD='VeryStr0ngP@ssw0rd' \
            -e DB_TRUST_SERVER_CERTIFICATE=true \
            memberjunction/api:ci-boot-check

          # Entrypoint runs mj migrate + mj codegen on the fresh DB before the API
          # starts — allow up to 15 minutes, but fail fast if the container dies.
          OK=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:4000/healthcheck >/dev/null 2>&1; then
              OK=1; break
            fi
            if [ -z "$(docker ps -q -f name=mjapi)" ]; then
              echo "::error::MJAPI container exited during boot"
              break
            fi
            sleep 10
          done
          echo "---- MJAPI logs (tail) ----"
          docker logs --tail 300 mjapi || true
          docker rm -f mjapi >/dev/null 2>&1 || true
          docker rm -f sql >/dev/null 2>&1 || true
          docker network rm boot-net >/dev/null 2>&1 || true
          if [ "$OK" != "1" ]; then
            echo "::error::MJAPI /healthcheck never answered — refusing to push the image"
            exit 1
          fi
          echo "MJAPI booted and answered /healthcheck — proceeding to push."

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            memberjunction/api:latest
            memberjunction/api:v${{ needs.channel.outputs.version }}
          platforms: |
            linux/amd64
            linux/arm64
          file: docker/MJAPI/Dockerfile
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to the AskSkip Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: askskip.azurecr.io
          username: ${{ secrets.ASKSKIP_AZ_SP_CLIENT_ID }}
          password: ${{ secrets.ASKSKIP_AZ_SP_CLIENT_SECRET }}

      - name: Push image to AskSkip Azure Container Registry
        run: |
          docker buildx imagetools create \
            --tag askskip.azurecr.io/memberjunction/api:latest \
            --tag askskip.azurecr.io/memberjunction/api:v${{ needs.channel.outputs.version }} \
            memberjunction/api:latest
