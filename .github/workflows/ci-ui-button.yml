name: UI buttons — .mj-btn override prevention

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/Angular/**/*.css'
      - 'packages/Angular/**/*.scss'
      - '.github/scripts/check-mj-btn-override.sh'
      - '.github/workflows/ci-ui-button.yml'

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: ci-ui-button-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  check-mj-btn-override:
    name: Check for component-scoped .mj-btn overrides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine merge base
        run: |
          echo "BASE_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"

      - name: Check changed CSS/SCSS for .mj-btn overrides
        run: |
          ./.github/scripts/check-mj-btn-override.sh --base "$BASE_REF"
