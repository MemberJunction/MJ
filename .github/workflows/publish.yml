name: Build and publish new package versions

# This one file carries BOTH publish paths, and the reason is npm, not taste:
# every ~300 MJ package's npm trusted-publishing (OIDC) config is scoped to the
# workflow FILENAME `publish.yml`. A second publishing workflow file means a
# second trusted publisher entered by hand on every package, so the LTS line
# release lives here as a separate job rather than in its own file.
#
#   Edge line   — a push to `main` (unchanged), or a dispatch FROM main with
#                 confirm_branch: main and no line_branch.
#                 Jobs: test-migrations + release-validation -> build-and-publish.
#   LTS line    — dispatch from `next` with line_branch + confirm_branch.
#                 Job: publish-lts, which checks out the line branch itself.
#                 Ported from publish-lts.yml (since retired): guards, era
#                 detection, registry verification. Its dist-tag is decided per
#                 run — `latest` when this line already owns it, else lts-<line>.
#
# EXACTLY THREE INVOCATIONS PUBLISH ANYTHING. Every other combination of event,
# ref and inputs runs nothing at all, and dispatch-guard turns the run red:
#
#   1. push to main                                        -> Edge
#   2. dispatch, ref main, confirm_branch=main, no line    -> Edge
#   3. dispatch, line_branch=lts/N, confirm_branch=lts/N   -> that line
#
# Invocation 2 exists because a bare dispatch with empty inputs used to run the
# real Edge publish: `changeset version` consumes whatever changesets are sitting
# on the ref (93 of them on main right now) and publishes. A release is never
# something you should be able to start by clicking Run workflow and pressing
# enter, so the Edge path now demands the same double-entry the line path does.
# The `if:` on every job below encodes this table; the dispatch-guard job asserts
# the same table so a mismatch between the two shows up as a failed run rather
# than as a publish nobody asked for.

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      targetVersion:
        description: 'Edge path only: the version to target for this publish'
        required: false
      # An LTS line release is dispatched with the ref left at `next` (the
      # default) so the MAINTAINED copy of this workflow always runs; the line
      # is a parameter, never the ref. That kills the whole class of bug where a
      # release runs stale workflow code that was never backported to the line.
      # Selecting an lts/* ref in the dialog instead cannot silently do the
      # wrong thing: that ref's publish.yml has no line_branch input, so GitHub
      # rejects the dispatch outright.
      line_branch:
        description: 'LTS path: line branch to release (e.g. lts/5). Leave EMPTY for an Edge publish.'
        required: false
        default: ''
      confirm_branch:
        description: 'Double-entry confirmation, required for every dispatch: type the line branch again for a line release, or "main" for a manual Edge publish (which must be dispatched from main).'
        required: false
        default: ''


permissions:
  contents: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  # A dispatch that matches none of the three invocations above selects no path,
  # so nothing publishes — but a green "nothing happened" run is a lie about
  # intent, and the most dangerous input mistake (typing the line into
  # confirm_branch alone) used to select the EDGE path. This job re-derives the
  # table and fails the run, naming the three valid invocations. It deliberately
  # gates nothing and has no dependents: it cannot block or delay a push.
  dispatch-guard:
    name: Validate dispatch inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      LINE: ${{ github.event.inputs.line_branch }}
      CONFIRM: ${{ github.event.inputs.confirm_branch }}
      REF: ${{ github.ref_name }}
    steps:
      - name: A dispatch must be a confirmed Edge publish or a confirmed line release
        run: |
          set -euo pipefail

          # Invocation 2 — manual Edge publish. Only from main: every step of
          # that path is main-gated, and the changesets it consumes are main's.
          if [ -z "$LINE" ] && [ "$CONFIRM" = 'main' ]; then
            if [ "$REF" != 'main' ]; then
              echo "::error::A manual Edge publish must be dispatched from main, but this run's ref is '$REF'. Nothing was published."
              exit 1
            fi
            echo "::notice::Confirmed manual Edge publish from main — the LTS job is skipped."
            exit 0
          fi

          # Invocation 3 — line release. Shape is re-checked inside publish-lts,
          # which is where a mismatch must fail loudly rather than skip.
          if [ -n "$LINE" ] && [ "$CONFIRM" = "$LINE" ]; then
            if ! [[ "$LINE" =~ ^lts/[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::line_branch='$LINE' is not a line branch. Expected lts/<major> or lts/<major>.<minor> (e.g. lts/5, lts/6.1). Nothing was published."
              exit 1
            fi
            echo "::notice::Confirmed LTS line release for $LINE — the Edge jobs are skipped."
            exit 0
          fi

          echo "::error::This dispatch matches no valid invocation (line_branch='$LINE', confirm_branch='$CONFIRM', ref='$REF') and NOTHING was published. The three ways to publish are: (1) push to main -> Edge release; (2) dispatch from main with confirm_branch=main and line_branch empty -> manual Edge release; (3) dispatch with line_branch=lts/N and confirm_branch=lts/N -> that line's release. An empty dispatch is refused on purpose: it would publish whatever changesets happen to be sitting on the ref."
          exit 1

  # Edge path. Unconditional on `push` — that trigger is the Edge release and its
  # behavior is untouched. On a dispatch it additionally requires the invocation-2
  # confirmation, which is repeated verbatim on all three Edge jobs; GitHub
  # Actions has no YAML anchors, and duplicating the condition is preferable to
  # making the release path depend on another job's output.
  test-migrations:
    # The LTS job validates migration filenames on the line branch's own tree;
    # this job would test `next`, which says nothing about it.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.line_branch == '' && github.event.inputs.confirm_branch == 'main' && github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Create docker network
        run: docker network create -d bridge local-net

      - name: Create SQL Server container
        run: docker run --rm -d --network local-net --name sql -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=VeryStr0ngP@ssw0rd" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server to be ready
        run: sleep 20  # Give SQL Server time to initialize

      - name: Create SQL database
        run: docker run --rm --network local-net mcr.microsoft.com/mssql-tools /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "CREATE DATABASE [test];"

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MJ CLI globally
        run: npm install --global @memberjunction/cli

      - name: Run mj migrate locally
        run: mj migrate
        env:
          DB_HOST: localhost
          DB_DATABASE: test
          DB_USERNAME: sa
          DB_PASSWORD: VeryStr0ngP@ssw0rd
          CODEGEN_DB_USERNAME: sa
          CODEGEN_DB_PASSWORD: VeryStr0ngP@ssw0rd
          DB_TRUST_SERVER_CERTIFICATE: 'true'

  # Release PRs land on main without ever running test.yml (which is gated to `next`),
  # so before this gate existed NOTHING between "green on next" and `npm publish` ran a
  # single test. Validate the exact commit being published with the full unit suite.
  release-validation:
    name: Validate release commit (full unit suite)
    # Edge path only — it tests THIS ref (main). A line release's content is
    # validated by the line branch's own CI on the backport PRs.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.line_branch == '' && github.event.inputs.confirm_branch == 'main' && github.ref_name == 'main') }}
    uses: ./.github/workflows/release-test.yml

  build-and-publish:
    name: Build and publish new versions of NPM packages
    # Edge path only. Redundant with `needs` (both gates carry the same `if`),
    # and deliberately so: this is the job that reaches npm, and it must never
    # depend on a skip cascade for that.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.line_branch == '' && github.event.inputs.confirm_branch == 'main' && github.ref_name == 'main') }}
    # Hard preconditions: without `needs`, publish raced its own quality gates —
    # packages published to npm even when the fresh-DB migration apply failed, and
    # no test of any kind ran against the release commit. Publish requires both green.
    needs: [test-migrations, release-validation]
    # 30 minutes was not enough and the failure mode is DESTRUCTIVE, not a clean retry.
    # v6.1.0-edge.1 ran 30m16s and GitHub killed it mid-`changeset publish`, leaving the
    # fixed-version group split across two versions on npm (~100 packages at the new version,
    # ~200 at the old) with no version-bump commit, no tag, and no back-merge. A job timeout
    # reports as "The operation was canceled", which is indistinguishable at a glance from
    # someone clicking Cancel — the v5.49.0 split was attributed to an accidental click and
    # may well have been this same ceiling.
    #
    # The budget is structurally tight: the build alone takes ~25 minutes, leaving ~5 for a
    # publish loop that uploads ~300 packages serially. Every package added shrinks the margin.
    # 120 leaves real headroom. This only bounds a hung job; it cannot make one publish more.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # pnpm must be on PATH before setup-node, so setup-node can resolve the
      # pnpm store path for its cache. Version comes from the `packageManager`
      # field in package.json — do not pin it a second time here.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all packages exist on npm
        if: ${{ env.BRANCH == 'main' }}
        run: ./.github/scripts/validate-npm-packages.sh

      - name: Validate package repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Set up git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin "https://$REPO_PAT@github.com/MemberJunction/MJ"
        env:
          REPO_PAT: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}

      # In Edge pre-mode the string-math version guard below is not
      # prerelease-aware (and migration=>minor holds at tuple level by
      # construction in the Edge grammar), so it yields to a grammar assertion.
      - name: Detect changesets prerelease mode
        id: premode
        run: |
          MODE=none
          if [ -f .changeset/pre.json ]; then MODE=$(jq -r .mode .changeset/pre.json); fi
          echo "MODE=$MODE" >> "$GITHUB_OUTPUT"
          echo "::notice::Changesets mode: $MODE"

      - name: Check for version override in commit message
        id: commit_override
        run: |
          COMMIT_MSG=$(git log -1 --format=%B)
          if [[ "$COMMIT_MSG" =~ \[version:([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            echo "VERSION_OVERRIDE=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Found version override in commit message: ${BASH_REMATCH[1]}"
          fi

      - name: Determine next expected version
        if: ${{ env.BRANCH == 'main' && !github.event.inputs.targetVersion && !steps.commit_override.outputs.VERSION_OVERRIDE && steps.premode.outputs.MODE != 'pre' }}
        id: version_check
        run: |
          git fetch --tags
          # Use MJServer package as version reference since core and global are pinned at 2.100.3
          CURRENT_VERSION=$(jq -r .version packages/MJServer/package.json)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          NEXT_MINOR_VERSION="${VERSION_PARTS[0]}.$(( VERSION_PARTS[1] + 1 )).0"
          NEXT_PATCH_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$(( VERSION_PARTS[2] + 1 ))"
          NEW_MIGRATION_FILES=$(git --no-pager diff --name-only "v${CURRENT_VERSION}" "${{ github.sha }}" -- migrations/)
          if [ -n "$NEW_MIGRATION_FILES" ]; then
            echo "EXPECTED_NEXT_VERSION=$NEXT_MINOR_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "EXPECTED_NEXT_VERSION=$NEXT_PATCH_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version and check against expected
        if: ${{ env.BRANCH == 'main' }}
        run: |
          pnpm run version

          NEXT_VERSION=$(jq -r .version packages/MJServer/package.json)
          echo "::notice::Version to be published: $NEXT_VERSION"
          if [ "${{ steps.premode.outputs.MODE }}" = "pre" ]; then
            if [[ "$NEXT_VERSION" != *-edge.* ]]; then
              echo "::error::Repo is in Edge prerelease mode but changeset version produced unsuffixed $NEXT_VERSION"
              exit 1
            fi
          else
            EXPECTED_NEXT_VERSION="${{ github.event.inputs.targetVersion || steps.commit_override.outputs.VERSION_OVERRIDE || steps.version_check.outputs.EXPECTED_NEXT_VERSION }}"
            if [ "$NEXT_VERSION" != "$EXPECTED_NEXT_VERSION" ]; then
              echo "::error::The version to be published ($NEXT_VERSION) does not match the expected version ($EXPECTED_NEXT_VERSION)"
              exit 1
            fi
          fi

      # `pnpm run version` above rewrote ~300 manifests and nothing regenerated
      # pnpm-lock.yaml, so every edge release since the pnpm cutover pushed a main
      # whose lockfile still named the PREVIOUS version. Measured on v6.1.0-edge.2:
      # 2287 stale specifiers across 291 of 307 importers, one homogeneous class
      # (edge.1 -> edge.2). The `pnpm install --frozen-lockfile` at the top of this
      # job cannot help — it runs before the bump. `ci/merge_main_and_update_lock.mjs`
      # does refresh, but only after `git checkout next`, so next got reconciled and
      # main never did. It stayed invisible until docs began building /v6 from main
      # and the frozen install there failed with ERR_PNPM_OUTDATED_LOCKFILE.
      #
      # Mirrors the publish-lts job's "Version (normal mode) and refresh lockfile":
      # refresh, then commit the lockfile as its own [skip ci] commit so it travels
      # with the release commit ci/commit_push.mjs pushes, instead of depending on
      # that script's `git add ./*` sweep to catch it.
      #
      # --no-frozen-lockfile is load-bearing, not decoration: pnpm treats
      # frozen-lockfile as true whenever CI is set, so a BARE `pnpm install` here
      # exits 1 with ERR_PNPM_OUTDATED_LOCKFILE (verified directly against pnpm,
      # alongside --frozen-lockfile which fails the same way). It is also a REAL
      # install, never --lockfile-only: that flag writes a lockfile without proving
      # it installs, and this repo has already been burned by it — an 827-package
      # drift during the npm->pnpm cutover.
      #
      # Internal deps do not need the registry for this: pnpm-workspace.yaml sets
      # linkWorkspacePackages: true, so the freshly bumped @memberjunction/*
      # specifiers resolve to `link:` entries locally. That is what makes a refresh
      # possible here at all, before anything is published.
      - name: Refresh pnpm-lock.yaml for the version bump
        if: ${{ env.BRANCH == 'main' }}
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::notice::pnpm-lock.yaml already matched the bumped manifests — nothing to commit."
          else
            git --no-pager diff --stat -- pnpm-lock.yaml
            git add pnpm-lock.yaml
            git commit -m "chore: lockfile for release [skip ci]"
            echo "::notice::Committed the refreshed pnpm-lock.yaml — ci/commit_push.mjs pushes it with the release commit."
          fi
          # A frozen install is the only proof the lockfile is actually in sync —
          # the same posture as verifying a publish against the registry rather
          # than against a log line. This runs BEFORE the npm publish, so a missed
          # refresh fails the release instead of shipping another broken main.
          pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # BUSL is parameterized: "BUSL-1.1" in package.json tells a consumer
      # nothing about the Change Date or the Additional Use Grant. Every
      # package sets files:["/dist"], and npm only auto-includes a LICENSE
      # sitting at the package root — so without this step the tarballs ship
      # no license text at all. Copies are generated here, never committed.
      - name: Stage per-package LICENSE files
        run: node .github/scripts/stage-package-licenses.mjs

      # LTS process (plans/lts-process.md §4.2): no publish ever completes without its
      # channel tag asserted — derived here, cross-checked against pre.json before the
      # publish, verified against the registry after it (pre mode forbids an explicit
      # --tag). The channel comes from the version grammar itself — an -edge.N
      # prerelease goes to the `edge` dist-tag. Unsuffixed versions are era-gated:
      # era-5 (classic grammar, the bootstrap) publishes to `latest` — today's
      # behavior, unchanged. From era 6 on, an unsuffixed version is a candidate or
      # certified build and this routine path REFUSES it: `latest` moves only at
      # certification (ci/dist-tag-all.mjs), and candidates publish via the
      # candidate-cut flow / this workflow's publish-lts job (§15 items 4 and 6).
      # Without this gate a cycle-2 candidate cut transiting here would seize
      # `latest` uncertified.
      - name: Determine release channel from version grammar
        id: channel
        run: |
          VERSION=$(jq -r .version packages/MJServer/package.json)
          MAJOR=${VERSION%%.*}
          if [[ "$VERSION" == *-edge.* ]]; then
            NPM_TAG=edge
            PRERELEASE=true
          elif [[ "$MAJOR" -le 5 ]]; then
            NPM_TAG=latest
            PRERELEASE=false
          else
            echo "::error::Unsuffixed version $VERSION on the routine publish path. Post-era-open, normal versions are candidate/certified builds: publish via the candidate-cut flow (this workflow, dispatched with line_branch=lts/<N>); 'latest' moves only at certification via ci/dist-tag-all.mjs."
            exit 1
          fi
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $VERSION to npm dist-tag $NPM_TAG (prerelease: $PRERELEASE)"

      - name: Publish to npm
        # 🚨 Invoke changesets directly, NOT via `pnpm run change publish -- --tag <x>`.
        # `"change": "changeset"`, and pnpm 10 forwards the `--` separator LITERALLY, so that
        # form reaches changesets as `publish -- --tag edge` and dies with "Too many arguments
        # passed to changesets". changesets exits 0 on its own CLI errors, so the step
        # concluded `success` while v6.1.0-edge.0 was version-bumped, tagged and back-merged
        # with ZERO packages reaching npm — a release the repo believes shipped and the
        # registry has never heard of.
        #
        # 🚨 And in pre mode, pass NO --tag at all: changesets refuses a custom tag in pre
        # mode ("Releasing under custom tag is not allowed in pre mode") — that refusal at
        # least exits 1, so the corrected-args form still published nothing, but visibly.
        # In pre mode the
        # dist-tag comes from .changeset/pre.json's "tag" field; assert it matches the
        # channel step's derivation instead of passing it.
        #
        # `set -o pipefail` + the publish-happened assertion make silence loud, and the
        # registry verification step below is the gate that cannot be lied to.
        run: |
          set -euo pipefail
          if [ "${{ steps.premode.outputs.MODE }}" = "pre" ]; then
            PRE_TAG=$(jq -r .tag .changeset/pre.json)
            if [ "$PRE_TAG" != "${{ steps.channel.outputs.NPM_TAG }}" ]; then
              echo "::error::Channel step derived dist-tag '${{ steps.channel.outputs.NPM_TAG }}' but pre mode publishes under pre.json's '$PRE_TAG' — refusing to publish under the wrong tag."
              exit 1
            fi
            pnpm exec changeset publish 2>&1 | tee /tmp/publish.log
          else
            pnpm exec changeset publish --tag ${{ steps.channel.outputs.NPM_TAG }} 2>&1 | tee /tmp/publish.log
          fi
          if ! grep -qE 'New tag:|Packages published|already published' /tmp/publish.log; then
            echo "::error::changeset publish produced no evidence of a publish — refusing to report success."
            exit 1
          fi
        env:
          NPM_TOKEN: ''

      # The registry is the only signal that cannot be lied to (changesets exits 0 on
      # its own errors, and log-grep assertions only prove what was printed). Assert
      # the dist-tag actually reached the new version, and that a prerelease publish
      # did not move `latest` (in pre mode changesets sends packages with no prior
      # normal release to `latest`).
      - name: Verify the publish reached npm
        run: |
          VERSION=$(jq -r .version packages/MJServer/package.json)
          NPM_TAG='${{ steps.channel.outputs.NPM_TAG }}'
          AT_TAG=''
          for i in 1 2 3 4 5; do
            AT_TAG=$(npm view "@memberjunction/core@$NPM_TAG" version 2>/dev/null || true)
            [ "$AT_TAG" = "$VERSION" ] && break
            echo "dist-tag '$NPM_TAG' is at '${AT_TAG:-<unset>}', want $VERSION — retry $i/5 in 15s"
            sleep 15
          done
          if [ "$AT_TAG" != "$VERSION" ]; then
            echo "::error::npm dist-tag '$NPM_TAG' never reached $VERSION — the publish did not happen (or failed before tagging). Do not trust this run's green steps."
            exit 1
          fi
          if [ "${{ steps.channel.outputs.PRERELEASE }}" = "true" ]; then
            LATEST=$(npm view @memberjunction/core dist-tags.latest)
            if [ "$LATEST" = "$VERSION" ]; then
              echo "::error::A prerelease publish moved 'latest' to $VERSION — investigate before anything consumes it"
              exit 1
            fi
          fi
          echo "::notice::Verified: @memberjunction/core@$VERSION is live under dist-tag '$NPM_TAG'"

      - name: Get version string
        if: ${{ env.BRANCH == 'main' }}
        id: version
        run: |
          git pull
          git log -n1
          VERSION="v"$(jq -r .version packages/MJServer/package.json)
          echo "Release for verison $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: ${{ env.BRANCH == 'main' }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: pnpm run commitpush

      # LTS process §4.3: routine releases never claim the repo's "latest release"
      # flag — certification marks the certified build as latest afterward
      # (gh release edit vX.Y.Z --latest), so "newest GH release" surfaces always
      # point at certified bits. Edge prereleases are additionally flagged as such.
      - name: Create GitHub Release (never latest; certification promotes)
        if: ${{ env.BRANCH == 'main' }}
        env:
          GH_TOKEN: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping creation (re-run of a partially completed publish)"
            exit 0
          fi
          EXTRA_FLAGS=""
          if [ "${{ steps.channel.outputs.PRERELEASE }}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes --latest=false $EXTRA_FLAGS --repo "${{ github.repository }}"

      - name: Merge main into next and update package-lock
        if: ${{ env.BRANCH == 'main' }}
        run: |
          git checkout next
          git log -n1
          pnpm run mergemain:update-lock

  # ---------------------------------------------------------------------------
  # LTS line release (guides/RELEASE_ENGINEERING_RUNBOOK.md operation 3;
  # plans/lts-process.md §5.2 rule 3 / §14.1). Ported verbatim in behavior from
  # publish-lts.yml, which this PR retires — the only substantive changes are
  # that the line comes from an INPUT instead of the running ref, and the job
  # timeout matches the edge path's (see below).
  #
  # Actions -> "Build and publish new package versions" -> Run workflow ->
  # leave the ref at `next` -> line_branch: lts/5 -> confirm_branch: lts/5.
  #
  # Sequence: guards -> checkout the line -> era-detect the package manager ->
  # changeset version (normal, non-pre mode) -> lockfile refresh as its own
  # [skip ci] commit -> decide the dist-tag -> build -> changeset publish under
  # that tag -> verify against the registry -> push the release commit + tag to
  # the line branch -> GitHub Release -> file a tracking issue if the line tag was
  # left behind -> dispatch the docs deploy (the one step publish-lts.yml never
  # had; docs.yml cannot watch for this run, see that step's comment).
  #
  # WHICH TAG: `latest` if this line already owns `latest` (or no `latest` exists
  # yet), otherwise `lts-<line>`. Craig's ruling — 5.51.1 superseding 5.51.0 is the
  # legitimate latest, so it should say so — applied at PUBLISH time, because that
  # is the only moment an OIDC credential exists. A line release can still never
  # drag `latest` backwards off a newer line, and moving `latest` ACROSS lines
  # stays certification's job via ci/dist-tag-all.mjs. The cost of npm's one-tag-
  # per-publish limit is that the line tag then lags by one patch; the tracking
  # issue carries the one-liner that fixes it.
  #
  # The runbook's prohibition on `workflow_dispatch`ing the routine publish path
  # from a line branch still stands and is not what this is: the line branch is
  # never the ref this workflow runs from — it is checked out by this job, and
  # every main-gated edge step is skipped wholesale by the job `if`s above.
  # ---------------------------------------------------------------------------
  publish-lts:
    name: Publish LTS line release ${{ github.event.inputs.line_branch }}
    # Gated on line_branch ALONE, deliberately: the confirmation and the branch
    # shape are checked in the job's first step, so a mismatched attempt at a
    # line release fails red instead of silently skipping. Nothing can publish
    # from here without that step passing.
    if: ${{ github.event.inputs.line_branch != '' }}
    # 120, not publish-lts.yml's 45, for the reason spelled out on the edge job:
    # a timeout mid-`changeset publish` is DESTRUCTIVE, not a clean retry — it
    # splits the fixed-version group across two versions on npm. A line publish
    # pushes the same ~300 packages serially after a full build, so it carries
    # the same exposure; 45 minutes was never measured against it.
    timeout-minutes: 120
    # Job-level permissions REPLACE the workflow-level block rather than merging
    # with it, so the two the job already relies on are restated: contents for
    # checkout, id-token for npm trusted publishing. The delta is one scope —
    # actions: write, for the docs dispatch in the last step — and it is scoped
    # to this job so the edge path never gains the ability to start workflows.
    permissions:
      contents: write
      id-token: write
      actions: write
      issues: write
    runs-on: ubuntu-latest
    env:
      LINE: ${{ github.event.inputs.line_branch }}
      CONFIRM: ${{ github.event.inputs.confirm_branch }}
    steps:
      # Runs BEFORE checkout, so nothing reaches actions/checkout (nor any later
      # shell) until the input is known to be a well-formed line branch name.
      - name: Guard - line_branch must name an lts/* line, confirmed twice
        run: |
          set -euo pipefail
          if ! [[ "$LINE" =~ ^lts/[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::line_branch='$LINE' is not a line branch. Expected lts/<major> or lts/<major>.<minor> (e.g. lts/5, lts/6.1)."
            exit 1
          fi
          if [ "$CONFIRM" != "$LINE" ]; then
            echo "::error::Confirmation mismatch: line_branch='$LINE' but confirm_branch='$CONFIRM'. Re-dispatch with both fields identical."
            exit 1
          fi
          echo "::notice::Releasing line $LINE (workflow file from ${{ github.ref_name }})"

      # A line branch that does not exist fails here, loudly, before anything
      # else runs: "couldn't find remote ref refs/heads/<line>".
      - name: Checkout the line branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.line_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Guard - line branch must NOT be in prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json exists on $LINE - pre-mode state leaked from next. Fix the branch before publishing."
            exit 1
          fi

      - name: Guard - there must be changesets to release
        run: |
          # Equivalent to publish-lts.yml's `ls .changeset/*.md | grep -cv README.md`,
          # written as a glob so shellcheck (SC2010) is satisfied.
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No changesets on $LINE - nothing to release. Backported fixes carry their changeset files; did the backport PR merge?"
            exit 1
          fi

      # lts/5 is the last npm line; 6.x and every later LTS line use pnpm. The
      # lockfile committed on the checked-out ref is the signal, so this needs
      # no edit when a new line is cut.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            PM=pnpm
          elif [ -f package-lock.json ]; then
            PM=npm
          else
            echo "::error::No lockfile found on $LINE"
            exit 1
          fi
          echo "PM=$PM" >> "$GITHUB_OUTPUT"
          echo "::notice::Package manager for this ref: $PM"

      - name: Set up pnpm
        if: steps.pm.outputs.PM == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.PM }}

      - name: Pin npm to 11.6.4
        if: steps.pm.outputs.PM == 'npm'
        run: npm install -g npm@11.6.4

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Validate package-lock.json case-sensitivity
        if: steps.pm.outputs.PM == 'npm'
        run: ./.github/scripts/validate-package-lock-case.sh

      - name: Install dependencies
        run: ${{ steps.pm.outputs.PM == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Validate package repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Set up git credentials
        env:
          REPO_PAT: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin "https://$REPO_PAT@github.com/${GITHUB_REPOSITORY}"

      # `.changeset/config.json` sets "commit": true, so `changeset version`
      # commits the bump itself; the lockfile it leaves behind does not, hence
      # the explicit second commit.
      #
      # The pnpm refresh is a REAL install (`--no-frozen-lockfile`), matching the
      # edge path above. It was `--lockfile-only`, which does work here — that flag
      # implies non-frozen, so it is not blocked by pnpm's CI frozen default — but
      # it writes a lockfile without proving the lockfile installs, and it leaves
      # node_modules describing the pre-bump manifests for the build that follows.
      # Project rule from the npm->pnpm cutover: never --lockfile-only (it drifted
      # 827 packages). npm-era lines keep `npm install`, which has no frozen default.
      - name: Version (normal mode) and refresh lockfile
        id: version
        run: |
          ${{ steps.pm.outputs.PM }} run version
          ${{ steps.pm.outputs.PM == 'pnpm' && 'pnpm install --no-frozen-lockfile' || 'npm install' }}
          LOCK=${{ steps.pm.outputs.PM == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
          if ! git diff --quiet -- "$LOCK"; then
            git add "$LOCK"
            git commit -m "chore: lockfile for line release [skip ci]"
          fi
          VERSION=$(jq -r .version packages/MJServer/package.json)
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::Line release produced a prerelease version ($VERSION) - refusing."
            exit 1
          fi
          NPM_TAG="lts-${LINE#lts/}"
          echo "VERSION=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $VERSION from $LINE to npm dist-tag $NPM_TAG"

      # Decide which dist-tag this publish applies — the decision has to happen HERE,
      # before the publish, because npm applies exactly ONE tag at publish time and
      # that is the only moment this workflow holds a credential. Trusted publishing
      # (OIDC) authorizes "npm publish" and nothing else: in the npm CLI,
      # lib/utils/oidc.js is required by lib/commands/publish.js alone, and
      # lib/commands/dist-tag.js has no OIDC path at all. A post-publish
      # "npm dist-tag add" therefore needs a write token, and npm expires write
      # tokens every 90 days — line patches are rarer than that rotation, so a
      # token-based step would be broken more often than it works. Craig's ruling:
      # the latest tag has to be applied at OIDC publish time.
      #
      # Ownership rule: a bare-major line (lts/5) owns every 5.x, because major 5 has
      # no dotted lines; a dotted line (lts/6.1) owns 6.1.x only. Both reduce to a
      # "<line id>." prefix test, and the trailing dot is load-bearing — it is what
      # keeps 6.10.0 out of line 6.1. The equivalence breaks only if a dotted line is
      # ever cut inside a major that also carries a bare-major line, so that shape is
      # checked against the remote rather than assumed away.
      #
      # Every path that is not "this line already owns latest" publishes under the
      # line tag and leaves latest alone, so a line release can never drag latest
      # backwards off a newer line. Moving latest ACROSS lines stays certification's
      # job, via ci/dist-tag-all.mjs.
      - name: Decide the publish dist-tag
        id: channel
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          LINE_TAG: ${{ steps.version.outputs.NPM_TAG }}
        run: |
          set -euo pipefail
          NEW="${VERSION#v}"
          LINE_ID="${LINE#lts/}"

          TAGS=$(npm view @memberjunction/core dist-tags --json)
          PREV_LATEST=$(jq -r '.latest // empty' <<<"$TAGS")
          PREV_LINE=$(jq -r --arg t "$LINE_TAG" '.[$t] // empty' <<<"$TAGS")
          echo "::notice::Before publish: latest=${PREV_LATEST:-<unset>}, $LINE_TAG=${PREV_LINE:-<unset>}"

          AMBIGUOUS=false
          case "$LINE_ID" in
            *.*) ;;
            *) if git ls-remote --heads origin | grep -qE "refs/heads/lts/${LINE_ID}\.[0-9]+$"; then AMBIGUOUS=true; fi ;;
          esac

          OWNS=false
          if [ -z "$PREV_LATEST" ]; then
            OWNS=true
            echo "::notice::No 'latest' exists on the registry yet, so this publish takes it — npm's default tag IS latest, and publishing only under a line tag would leave packages uninstallable by bare name."
          elif [ "$AMBIGUOUS" = true ]; then
            echo "::warning::$LINE is a bare-major line but dotted lines exist inside major $LINE_ID, so ownership of ${LINE_ID}.x versions is ambiguous. Publishing under $LINE_TAG and leaving 'latest' at $PREV_LATEST. If that is wrong, move it deliberately with ci/dist-tag-all.mjs."
          else
            case "$PREV_LATEST" in
              "$LINE_ID".*)
                if [ "$(printf '%s\n%s\n' "$PREV_LATEST" "$NEW" | sort -V | tail -1)" = "$NEW" ]; then
                  OWNS=true
                else
                  echo "::warning::'latest' is $PREV_LATEST — on this line, but NEWER than $NEW. Publishing under $LINE_TAG so 'latest' is not dragged backwards."
                fi
                ;;
              *)
                echo "::notice::'latest' is $PREV_LATEST, which is not on line $LINE — publishing under $LINE_TAG and leaving 'latest' where it is."
                ;;
            esac
          fi

          if [ "$OWNS" = true ]; then PUBLISH_TAG=latest; else PUBLISH_TAG="$LINE_TAG"; fi
          {
            echo "PUBLISH_TAG=$PUBLISH_TAG"
            echo "OWNS_LATEST=$OWNS"
            echo "PREV_LATEST=$PREV_LATEST"
            echo "PREV_LINE=$PREV_LINE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $NEW under dist-tag '$PUBLISH_TAG'"

      - name: Build packages
        run: ${{ steps.pm.outputs.PM }} run build

      - name: Publish to npm under the decided dist-tag
        # 🚨 Invoke changesets directly, NOT via `<pm> run change publish -- --tag <x>`.
        # pnpm 10 forwards the `--` separator LITERALLY, so changesets receives
        # `publish -- --tag lts-x`, dies with "Too many arguments" — and exits 0.
        # That is the exact silent no-op that version-bumped and tagged 6.1.0-edge.0
        # while publishing ZERO packages (see the edge job above). npm strips the `--`,
        # which is why the npm-era lts/5 path would have worked; every pnpm-era line
        # (lts/6.1 onward) would have hit it. Direct invocation works under both.
        run: |
          set -euo pipefail
          npx changeset publish --tag ${{ steps.channel.outputs.PUBLISH_TAG }} 2>&1 | tee /tmp/publish.log
          if ! grep -qE 'New tag:|Packages published|already published' /tmp/publish.log; then
            echo "::error::changeset publish produced no evidence of a publish - refusing to report success."
            exit 1
          fi
        env:
          NPM_TOKEN: ''

      # The registry is the only signal that cannot be lied to (changesets exits 0
      # on its own errors; log-grep assertions only prove what was printed). Assert
      # that the tag this publish actually used reached the new version, then check
      # the other tag according to which one that was:
      #   published under latest  -> the line tag is EXPECTED to lag (one tag per
      #                              publish), reported here and healed by the
      #                              tracking issue a later step files
      #   published under lts-N   -> `latest` must not have budged; a publish that
      #                              moves latest as a side effect is a real defect
      - name: Verify the publish reached npm under the right tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          LINE_TAG: ${{ steps.version.outputs.NPM_TAG }}
          PUBLISH_TAG: ${{ steps.channel.outputs.PUBLISH_TAG }}
          OWNS_LATEST: ${{ steps.channel.outputs.OWNS_LATEST }}
          PREV_LATEST: ${{ steps.channel.outputs.PREV_LATEST }}
        run: |
          set -euo pipefail
          NEW="${VERSION#v}"
          AT_TAG=''
          for i in 1 2 3 4 5; do
            AT_TAG=$(npm view "@memberjunction/core@$PUBLISH_TAG" version 2>/dev/null || true)
            [ "$AT_TAG" = "$NEW" ] && break
            echo "dist-tag '$PUBLISH_TAG' is at '${AT_TAG:-<unset>}', want $NEW - retry $i/5 in 15s"
            sleep 15
          done
          if [ "$AT_TAG" != "$NEW" ]; then
            echo "::error::npm dist-tag '$PUBLISH_TAG' never reached $NEW - the publish did not happen (or failed before tagging). Do not trust this run's green steps."
            exit 1
          fi

          TAGS=$(npm view @memberjunction/core dist-tags --json)
          if [ "$OWNS_LATEST" = "true" ]; then
            LINE_NOW=$(jq -r --arg t "$LINE_TAG" '.[$t] // empty' <<<"$TAGS")
            echo "::notice::Verified: @memberjunction/core@$NEW is live under 'latest' (this line already owned it)."
            echo "::warning::$LINE_TAG still points at ${LINE_NOW:-<unset>}, not $NEW — npm applies one dist-tag per publish, and this publish spent it on 'latest'. The next step files a tracking issue with the one-liner that fixes it."
          else
            NOW=$(jq -r '.latest // empty' <<<"$TAGS")
            if [ "$NOW" != "$PREV_LATEST" ]; then
              echo "::error::npm 'latest' moved during a line publish that should not have touched it ($PREV_LATEST -> $NOW). Investigate immediately; restore with ci/dist-tag-all.mjs from the certified tag."
              exit 1
            fi
            echo "::notice::Verified: @memberjunction/core@$NEW is live under '$PUBLISH_TAG'; latest unmoved at ${PREV_LATEST:-<unset>}"
          fi

      # Tag and release steps tolerate a re-run of a partially completed publish
      # (publish succeeded, a later step failed): the publish step's "already
      # published" evidence passes, and these skip instead of dying on collisions.
      - name: Push release commit and tag to the line branch
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$LINE"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::notice::Tag $VERSION already exists on origin - skipping (re-run of a partially completed publish)"
          else
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      # The GitHub "Latest" badge follows the same ownership rule as the npm tag, so
      # the two surfaces cannot disagree about which build to install. This extends
      # Craig's npm ruling to the badge by symmetry — he ruled on npm, not on this —
      # so it is the one judgement in this PR a reviewer may want to strike. Striking
      # it means deleting the LATEST_FLAG lines and going back to --latest=false.
      - name: Create GitHub Release (Latest badge follows the npm tag)
        env:
          GH_TOKEN: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          OWNS_LATEST: ${{ steps.channel.outputs.OWNS_LATEST }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - skipping creation (re-run of a partially completed publish)"
            exit 0
          fi
          LATEST_FLAG=--latest=false
          if [ "$OWNS_LATEST" = "true" ]; then LATEST_FLAG=--latest; fi
          echo "::notice::Creating release $VERSION with $LATEST_FLAG"
          gh release create "$VERSION" --title "$VERSION" --generate-notes "$LATEST_FLAG" \
            --target "$LINE" --repo "${{ github.repository }}"

      # The cost of applying `latest` at publish time: npm applies ONE dist-tag per
      # publish, so a release that spends it on `latest` leaves lts-<N> pointing at
      # the previous patch — and lts-<N> is the channel tag line consumers install
      # from. Nothing in this run can fix that (the fix needs a write credential this
      # job deliberately does not have), so it is handed to a human as a tracked task
      # with the exact command, rather than left as a surprise in the registry.
      #
      # Dedupe follows .github/scripts/backstop-alarm.mjs: key on a LABEL and list
      # issues by label rather than through the search API, which is eventually
      # consistent — two line releases minutes apart could each search, see nothing,
      # and file duplicates. The label is created first (--force is idempotent)
      # because listing by a label that does not exist yet is not reliable either.
      #
      # continue-on-error: bookkeeping must never retroactively fail a release that
      # is published, verified, tagged and released. A failure here is loud in the
      # log and leaves the run green, because the release itself IS good.
      - name: File a tracking issue for the lagging line dist-tag
        if: ${{ steps.channel.outputs.OWNS_LATEST == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          LINE_TAG: ${{ steps.version.outputs.NPM_TAG }}
          PREV_LINE: ${{ steps.channel.outputs.PREV_LINE }}
          LABEL: lts-dist-tag-lag
        run: |
          set -euo pipefail
          NEW="${VERSION#v}"
          TITLE_PREFIX="$LINE_TAG dist-tag lags"
          TITLE="$TITLE_PREFIX after $NEW (published as latest)"
          BODY="$RUNNER_TEMP/dist-tag-lag.md"
          cat > "$BODY" <<EOF
          \`$LINE_TAG\` still points at \`${PREV_LINE:-<unset>}\`, but the newest release on $LINE is \`$NEW\`, which was published under \`latest\`.

          **Why this happens.** npm applies exactly one dist-tag at publish time, and publish time is the only moment the release workflow holds a credential: trusted publishing (OIDC) authorizes \`npm publish\` alone — in the npm CLI, \`lib/utils/oidc.js\` is required by \`lib/commands/publish.js\` and nothing else, and \`lib/commands/dist-tag.js\` has no OIDC path. A post-publish \`npm dist-tag add\` needs a write token, and npm expires those every 90 days, which is more often than this line ships. So the publish spends its one tag on \`latest\` when the line already owns \`latest\`, and \`$LINE_TAG\` is set by hand afterwards.

          **Fix it** (needs npm write access to the \`@memberjunction\` scope), from a checkout of the release so the package set matches:

          \`\`\`
          git checkout $VERSION
          node ci/dist-tag-all.mjs --version $NEW --tag $LINE_TAG
          \`\`\`

          Then confirm both tags:

          \`\`\`
          npm view @memberjunction/core dist-tags
          \`\`\`

          Filed by [this run](https://github.com/$REPO/actions/runs/${GITHUB_RUN_ID}).
          EOF

          gh label create "$LABEL" --force --color FBCA04 \
            --description "A line's lts-N dist-tag is behind its newest release" --repo "$REPO"

          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 100 \
            --json number,title | jq -r --arg p "$TITLE_PREFIX" 'map(select(.title | startswith($p))) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY"
            echo "::warning::$LINE_TAG is stale at ${PREV_LINE:-<unset>} — commented on existing issue #$EXISTING with the fix command."
          else
            URL=$(gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body-file "$BODY")
            echo "::warning::$LINE_TAG is stale at ${PREV_LINE:-<unset>} — filed $URL with the fix command."
          fi

      # Docs follow releases, and a line release reaches docs.yml ONLY through
      # this dispatch: docs.yml listens for workflow_run on `main` alone, by
      # ruling — no docs deploy is ever triggered by an event on `next`, and this
      # run reports branch `next` because the line is a parameter.
      #
      # Two things make this the last step rather than an earlier one. Steps only
      # run when every previous step succeeded, so a failed publish, a failed
      # registry verification, a failed push or a failed release cannot deploy
      # docs. And docs.yml builds each line's content from the LINE BRANCH, so
      # dispatching before the release commit was pushed would publish the
      # previous state of the line.
      #
      # github.token can start this run: workflow_dispatch is one of the two
      # documented exceptions to GitHub's "events triggered by GITHUB_TOKEN do
      # not create a workflow run" recursion suppression. Same pattern, same
      # command as lts/5's thin docs dispatcher.
      - name: Deploy docs for the new line release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref next


