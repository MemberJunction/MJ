name: UI Sass trap — no .scss in ngc-only Angular packages

# Most packages under packages/Angular/** build with bare `ngc` (no Sass step),
# so styleUrls content is embedded RAW. Native CSS nesting makes `&:hover` work
# by accident, but `&__elem` / `&--mod` concatenation is SILENTLY DROPPED — the
# rules are dead in production. See MemberJunction/MJ#3105.
#
# This gate is a full-tree scan (fast — it only inspects styleUrls references),
# so it does not need a base ref.

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/Angular/**/*.scss'
      - 'packages/Angular/**/*.css'
      - 'packages/Angular/**/*.ts'
      - 'packages/Angular/**/package.json'
      - '.github/scripts/check-ngc-scss.sh'
      - '.github/scripts/ci/ngc-scss-allowlist.txt'
      - '.github/workflows/ci-ngc-scss.yml'

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: ci-ngc-scss-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  check-ngc-scss:
    name: Check ngc-only packages for Sass in styleUrls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Check for Sass constructs / .scss styleUrls in ngc-only packages
        run: |
          ./.github/scripts/check-ngc-scss.sh --all
