name: MJInstaller Cross-Platform Tests

on:
  push:
    branches: [feature/mj-install-v2]
    paths:
      - 'packages/MJInstaller/**'
      - '.github/workflows/installer-platform-test.yml'
  pull_request:
    branches: [next]
    paths:
      - 'packages/MJInstaller/**'
      - '.github/workflows/installer-platform-test.yml'
  workflow_dispatch:

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
# EXCEPTION: push (merge to next) gets a per-commit group and is NEVER cancelled.
# `github.ref` is the same string for every merge, so a shared, cancellable group would let
# a later merge kill an earlier one's run. Mirrors test.yml.
concurrency:
  group: installer-platform-test-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: MJInstaller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MJInstaller
        run: pnpm --filter @memberjunction/installer run build

      - name: Run unit tests
        run: pnpm --filter @memberjunction/installer run test

      - name: Run cross-platform integration smoke
        run: npx tsx packages/MJInstaller/src/__tests__/integration/cross-platform-smoke.ts
