name: Test migrations

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - 'migrations/**'
      - 'migrations-pg/**'

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Create docker network
        run: docker network create -d bridge local-net

      - name: Create SQL Server container
        run: docker run --rm -d --network local-net --name sql -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=VeryStr0ngP@ssw0rd" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server to be ready
        run: sleep 20  # Give SQL Server time to initialize

      - name: Create SQL database
        run: docker run --rm --network local-net mcr.microsoft.com/mssql-tools /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "CREATE DATABASE [test];"

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MJ CLI globally
        run: npm install --global @memberjunction/cli

      - name: Run mj migrate locally
        run: mj migrate
        env:
          DB_HOST: localhost
          DB_DATABASE: test
          DB_USERNAME: sa
          DB_PASSWORD: VeryStr0ngP@ssw0rd
          CODEGEN_DB_USERNAME: sa
          CODEGEN_DB_PASSWORD: VeryStr0ngP@ssw0rd
          DB_TRUST_SERVER_CERTIFICATE: 'true'

  # Backstop alarm: this workflow's push run on `next` gates nothing, so a red one used to be
  # visible only to whoever opened the Actions tab. Red opens (or comments on) one rolling issue
  # for THIS workflow; green closes it. Logic and tests: .github/scripts/backstop-alarm.mjs.
  # Push to `next` only: line branches (lts/**) and the scheduled lanes are not what the alarm's
  # title describes. `cancelled` counts as red, as in test.yml: a push run here is never cancelled
  # by concurrency, so a cancel means a timeout or a manual stop.
  backstop-alarm:
    name: Backstop alarm
    needs: [test-migrations]
    if: always() && github.event_name == 'push' && github.ref_name == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Alert on backstop failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs red --workflow "Test migrations"

      # A cleanup failure must never turn a green run red (that would file an alarm about the
      # alarm), so this step alone is continue-on-error; the script still logs ::error::.
      - name: Resolve backstop alarm on green
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs green --workflow "Test migrations"
