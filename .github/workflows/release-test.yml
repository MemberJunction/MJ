name: Release Validation Suite

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        default: 'next'
        type: string

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'next' }}
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run unit tests
        run: npm test

  # Middle tier (D5.2): heavier than the Vitest PR gate, lighter than the full browser
  # stack. Defined ONCE in the reusable integration-run.yml (Docker db-setup provisioning +
  # the in-process deterministic aggregator) and shared with the PR gate in integration.yml,
  # so the release and PR runs are byte-for-byte identical. RUN_AGENT_TESTS stays unset
  # (deterministic tier only; no token cost / flakiness, D5).
  integration-suite:
    name: Integration Tier (deterministic)
    needs: unit-tests
    uses: ./.github/workflows/integration-run.yml
    with:
      ref: ${{ inputs.branch || 'next' }}
