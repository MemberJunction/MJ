name: UI design tokens — hardcoded colors + focus-ring misuse

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/Angular/**/*.css'
      - 'packages/Angular/**/*.scss'
      - 'packages/Angular/**/*.ts'
      - '.github/scripts/check-css-hex-tokens.sh'
      - '.github/scripts/check-focus-ring.sh'
      - '.github/scripts/ci/hex-allowlist.txt'
      - '.github/workflows/ci-ui-tokens.yml'

jobs:
  check-hex-tokens:
    name: Check changed CSS/SCSS/TS for token misuse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine merge base
        run: |
          # The PR's diff target is origin/${{ github.base_ref }}.
          # fetch-depth: 0 ensures we have full history for the diff.
          echo "BASE_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"

      - name: Check changed files for hardcoded colors
        run: |
          ./.github/scripts/check-css-hex-tokens.sh --base "$BASE_REF"

      # --mj-focus-ring is a box-shadow value; used as an outline it renders NOTHING,
      # silently removing the focus indicator. Cheap to write, invisible in review.
      - name: Check changed files for --mj-focus-ring outline misuse
        run: |
          ./.github/scripts/check-focus-ring.sh --base "$BASE_REF"
