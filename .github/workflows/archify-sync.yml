name: Sync vendored archify

# Keeps @memberjunction/ai-diagrams' vendored copy of archify (github.com/tt-a1i/archify) on
# upstream's stable release — plans/archify-diagram-skill.md, Phase 3. All logic lives in
# .github/scripts/archify-sync.mjs; its header explains the decisions.
#
# Monthly is enough: we pin to release tags and review every bump, so a faster cadence would only
# queue up more PRs to review. A month with no upstream release produces nothing — no PR, no
# issue, no comment. To pull a `security` release in early, run this by hand (workflow_dispatch).
#
# Never merges. It opens (or force-updates) one PR from chore/archify-sync into next.
#
# TWO JOBS, ON PURPOSE: `prepare` builds and runs freshly downloaded, not-yet-reviewed upstream
# code (the example regression tests), so it holds no write token and no secret, and saves no
# cache: a pnpm store saved from here would be restored, possibly tampered with, into later runs.
# `publish` never runs upstream code and trusts nothing prepare hands it: it applies prepare's
# patch, commits and pushes.
#
# NO PAT, AND SO NO CI ON THE SYNC PR UNTIL A MAINTAINER STARTS IT. publish uses GITHUB_TOKEN, and a
# push or PR made with GITHUB_TOKEN starts no workflows. That is deliberate: test.yml would run the
# vendored, unreviewed upstream code (upstream-examples.test.ts imports the vendored renderers) with
# the turbo remote-cache token and signing key in its env. The PR body says CI has not run; a
# maintainer reviews the vendored diff, then closes and reopens the PR to start it.

on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: archify-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Check upstream and prepare the sync
    if: github.repository_owner == 'MemberJunction'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.check.outputs.action }}
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          ref: next
          persist-credentials: false

      # Not ./.github/actions/mj-setup: its setup-node has `cache: 'pnpm'`, whose post step would
      # save this job's pnpm store (which the upstream code below can write to) into next's cache
      # scope. Nothing in this job may save a cache, so both are spelled out as off.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4, pinned like the other workflows that handle untrusted code
        with:
          cache: 'false'

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # noop | create | update; exits non-zero (blocked) when the open sync PR has someone else's
      # commits. Cheap and install-free, so a month with no release costs seconds.
      - name: Compare stable.json with UPSTREAM.json
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/archify-sync.mjs check

      - name: Install dependencies
        if: steps.check.outputs.action != 'noop'
        run: pnpm install --frozen-lockfile

      # Deliberately no token in env: this step executes the new upstream code.
      - name: Vendor the release, re-apply shims, run the upstream example tests
        if: steps.check.outputs.action != 'noop'
        run: node .github/scripts/archify-sync.mjs prepare --out "$RUNNER_TEMP/archify-sync"

      - name: Upload the prepared sync
        if: steps.check.outputs.action != 'noop'
        uses: actions/upload-artifact@v4
        with:
          name: archify-sync
          path: ${{ runner.temp }}/archify-sync
          retention-days: 7

  publish:
    name: Open or update the sync PR
    needs: prepare
    if: needs.prepare.outputs.action == 'create' || needs.prepare.outputs.action == 'update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN with exactly the two writes it makes: push chore/archify-sync, open or edit the
    # PR. Not a PAT, so the push starts no CI on unreviewed upstream code (see the header).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          ref: next
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the prepared sync
        uses: actions/download-artifact@v4
        with:
          name: archify-sync
          path: ${{ runner.temp }}/archify-sync

      # Fails the run AFTER opening a draft PR when the shims or tests failed; see the script header.
      - name: Commit, push, and open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/archify-sync.mjs publish --in "$RUNNER_TEMP/archify-sync"
