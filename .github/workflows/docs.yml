name: Update package documentation

# Versioned docs deploy: one Starlight build per release line, assembled into a
# single GitHub Pages site.
#
#   /v5/…  ← content at lts/5 (one set per lts/* branch — the branch IS the
#            line's certification artifact, so no ref is hardcoded here)
#   /v6/…  ← content at MAIN (the Edge line's released state; the major itself
#            comes from the newest v*-edge tag)
#   /      ← redirect to the newest LTS set
#   404    ← forwards legacy pre-versioning URLs into the newest LTS set
#
# EVERY docs set's CONTENT is built from a RELEASED ref — never from next: main
# for the Edge line, the lts/N branch for each line. main is caught up by the act
# of releasing, so the Edge set documents what users can actually install, and a
# docs deploy no longer depends on next compiling at all. (That dependency was
# not theoretical: the first chained line-release deploy, run 32208676764, failed
# in "Build v6 (next)" on an unrelated next-only type break, and the whole site's
# deploy was skipped because `deploy` needs `build`.)
#
# What comes from where — the ONE seam in this design:
#   content ref (main, lts/N)  everything ingest reads out of the repo: guides/,
#                              root docs, packages/**/README.md, releases/,
#                              .claude/skills/, the built packages, the TypeDoc
#                              API reference, and the commit its GitHub links pin
#   docs-site/ from next       the Astro app, Starlight component overrides,
#                              src/lib/* rendering logic, the hand-authored pages
#                              under docs-site/src/content/docs/, and ingest
#                              itself — overlaid onto every content checkout so
#                              site fixes never need cherry-picking to a line
# Because this file lives on the default branch (next), the workflow_run
# trigger fires from here regardless of what main or lts/* carry.

on:
  # Release-following only: a docs deploy is the last step of shipping, never a
  # side effect of merging. Between releases both `main` and the npm registry
  # lag `next`, so a merge-triggered deploy publishes authoritative-looking
  # documentation — canonical links into `main` included — for bits nobody can
  # install yet. The content refs above enforce the same thing from the other
  # direction: even a deploy triggered off-cycle can only publish released
  # content. The resolve job below hard-fails a trigger that did not conclude
  # `success`.
  #
  # `main` ONLY, and `next` is deliberately absent: no docs deploy is ever
  # triggered by an event on next (the trigger removed in #3911 does not come
  # back through a branch filter). The Edge line publishes on a push to main and
  # is covered here.
  #
  # An LTS line release does NOT arrive here as a workflow_run. It is dispatched
  # from next's ref (publish.yml's publish-lts job, the line being a parameter),
  # so matching it would mean listening to `next`. Instead that job CHAINS into
  # the workflow_dispatch below as its own final step, after the release commit
  # and tag are on the line branch — which is also the only ordering that builds
  # the released content rather than the previous line state.
  workflow_run:
    workflows:
      - Build and publish new package versions  # publish.yml — the Edge line, on main
    branches: [main]
    types:
      - completed

  # Two callers: an operator re-deploying a docs-only fix without waiting for a
  # release (also the only way to exercise the full pipeline from a branch), and
  # publish.yml's publish-lts job chaining a deploy after a line release. lts/5's
  # thin docs dispatcher forwards its docs-content pushes here the same way.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release lines to build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lines.outputs.MATRIX }}
      versions: ${{ steps.lines.outputs.VERSIONS }}
      default: ${{ steps.lines.outputs.DEFAULT }}
    steps:
      - name: Error out if the trigger did not succeed
        run: |
          if [ "${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'success' }}" != "success" ]; then
            echo "::error::The triggering workflow did not succeed"
            exit 1
          fi

      # github.sha is the commit this run was triggered for: the default-branch
      # head for workflow_run, or the chosen ref's head for a manual dispatch
      # (which is what lets a feature branch test the full pipeline before
      # merging). Note for workflow_run this is next's head, NOT the released
      # commit — the ref each version's CONTENT comes from is the matrix below.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Enumerate release lines
        id: lines
        run: |
          set -euo pipefail
          # LTS sets: one per lts/N branch. The branch is created by the LTS
          # process at line cut, so its existence is the source of truth for
          # "this line has public docs".
          #
          # 🚨 KNOWN GAP — dotted line branches (lts/6.1) get NO docs set: the
          # filter below takes bare majors only. Do NOT "fix" this by widening
          # the grep alone. docs-site/src/lib/documented-line.mjs THROWS on a
          # dotted DOCS_VERSION ("Documented line must look like v6"), and
          # because `deploy` needs `build`, one failing matrix entry takes the
          # WHOLE site's deploy down — every line, not just the dotted one.
          # Today's silent omission would become a total docs outage the day
          # lts/6.1 is cut.
          #
          # The real fix spans docs-site, not this file: split documented-line's
          # single value into a line-id string (v6.1) and an integer major (6),
          # because license-line.mjs derives BOTH the BUSL cutoff comparison and
          # `blob/lts/${documentedMajor}` from it — and Number('6.10') is 6.1,
          # so a dotted line would link at the wrong branch. This file's own
          # remaining work is small by comparison: this filter, `sort -V` instead
          # of `sort -n` (sort -n orders 6.10 before 6.9), and the 404
          # forwarder's `^(\/v\d+)\/` deep-link regex.
          mapfile -t LTS < <(git ls-remote --heads origin 'lts/*' | sed -E 's#.*refs/heads/lts/##' | grep -E '^[0-9]+$' | sort -n)
          # Edge set: the major comes from the newest edge TAG (tags are pushed by
          # the publish workflow, so this is released state too), and its content
          # is built from main — see the ref below.
          EDGE_MAJOR=$(git ls-remote --tags origin 'v*-edge.*' | sed -E 's#.*refs/tags/v##; s#\^\{\}$##' | sort -uV | tail -1 | cut -d. -f1)

          MATRIX='[]'
          VERSIONS='[]'
          for major in ${LTS[@]+"${LTS[@]}"}; do
            MATRIX=$(jq -c --arg id "v$major" --arg ref "lts/$major" '. + [{id: $id, ref: $ref}]' <<<"$MATRIX")
            VERSIONS=$(jq -c --arg id "v$major" --arg label "v$major (LTS)" '. + [{id: $id, label: $label}]' <<<"$VERSIONS")
          done
          if [ -n "$EDGE_MAJOR" ] && ! printf '%s\n' ${LTS[@]+"${LTS[@]}"} | grep -qx "$EDGE_MAJOR"; then
            # main, NOT next: the Edge line's docs describe the newest RELEASED
            # Edge build, which is exactly what main carries after publish.yml
            # pushes the release commit there.
            MATRIX=$(jq -c --arg id "v$EDGE_MAJOR" '. + [{id: $id, ref: "main"}]' <<<"$MATRIX")
            VERSIONS=$(jq -c --arg id "v$EDGE_MAJOR" --arg label "v$EDGE_MAJOR (Edge)" '. + [{id: $id, label: $label}]' <<<"$VERSIONS")
          else
            echo "::warning::No distinct Edge line to publish (edge major: '$EDGE_MAJOR', LTS lines: ${LTS[*]:-none}) — an lts/N branch supersedes the Edge set for the same major."
          fi

          if [ "$(jq length <<<"$MATRIX")" -eq 0 ]; then
            echo "::error::No release lines found (no lts/* branches and no v*-edge.* tags)"
            exit 1
          fi
          # The site default (root redirect target) is the newest LTS line —
          # the certified public face. Before any line exists, fall back to Edge.
          if [ "${#LTS[@]}" -gt 0 ]; then DEFAULT="v${LTS[-1]}"; else DEFAULT="v$EDGE_MAJOR"; fi

          {
            echo "MATRIX=$MATRIX"
            echo "VERSIONS=$VERSIONS"
            echo "DEFAULT=$DEFAULT"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building versions: $VERSIONS (default: $DEFAULT)"

  build:
    name: Build ${{ matrix.id }} (${{ matrix.ref }})
    needs: resolve
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      # fetch-depth 0 serves two needs: Starlight's lastUpdated reads per-file
      # git history, and the full fetch brings the triggering commit (next's head
      # in normal operation) into this checkout so the tooling overlay below can
      # reach it. Now that no content ref is ever `next`, that second need is the
      # only reason next appears in this job at all — do not narrow the fetch.
      - name: Checkout content ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.ref }}

      # The site tooling (ingest, Astro config, src/lib rendering logic, and the
      # hand-authored pages under docs-site/src/content/docs/) always comes from
      # the commit that triggered this run — next in normal operation — whatever
      # ref the content is at. This is what makes tooling fixes (e.g. the
      # internal-page exclusions) apply to every version without cherry-picking
      # to lts/* branches.
      #
      # It is also the one place where the released-content rule does not reach,
      # and the asymmetry is worth knowing before you write docs: a change to
      # guides/ or a package README publishes only once it reaches a released ref,
      # while a change to a page inside docs-site/ publishes on the next docs
      # deploy. Nothing here reads product code, so the overlay cannot resurrect
      # the next-must-compile dependency this design removes.
      #
      # RETIRING THIS STEP (the goal — page-affecting source should come from a
      # released ref too). It is really a compatibility shim for lts/5, which was
      # cut before versioned docs existed: that branch's docs-site is 16 files
      # behind, with no DOCS_VERSIONS support and no ThemeSelect override, so
      # without the overlay /v5 would lose its version switcher outright. Lines
      # cut from next after this point carry a current docs-site by construction,
      # so the shim ages out with lts/5.
      #
      # For the Edge set the overlay is redundant with the release flow — main
      # receives next's docs-site at every release — but it CANNOT be dropped
      # yet: main's docs-site has no src/lib/license-line.mjs (so /v6 would lose
      # the ISC-vs-BUSL distinction entirely) and no mjcertified.mdx, which the
      # BUSL Additional Use Grant names by URL and the deploy job's /mjcertified
      # redirect points at. Dropping it today would 404 that front door.
      #
      # So the gate is mechanical: once main's docs-site carries mjcertified.mdx,
      # src/lib/license-line.mjs, src/lib/documented-line.mjs and the ThemeSelect
      # override — which the next Edge release delivers on its own — this step can
      # take `if: matrix.ref != 'main'` and /v6 renders entirely from released
      # code. Check with:
      #   git ls-tree -r origin/main docs-site/ | grep -E 'mjcertified|license-line|documented-line|ThemeSelect'
      - name: Overlay docs-site tooling from the triggering commit
        run: |
          set -euo pipefail
          rm -rf docs-site
          git checkout ${{ github.sha }} -- docs-site

      # lts/5 is the last npm line; 6.x and every later line use pnpm. The
      # lockfile committed on the checked-out ref is the signal, so this needs
      # no edit when a new line is cut.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            PM=pnpm
          elif [ -f package-lock.json ]; then
            PM=npm
          else
            echo "::error::No lockfile found on ${{ matrix.ref }}"
            exit 1
          fi
          echo "PM=$PM" >> "$GITHUB_OUTPUT"
          echo "::notice::Package manager for ${{ matrix.ref }}: $PM"

      - name: Set up pnpm
        if: steps.pm.outputs.PM == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          # Root-install caching would need era-aware lockfile paths; only the
          # docs-site install (always npm, tooling from next) is cached.
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: ${{ steps.pm.outputs.PM == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Build packages
        run: ${{ steps.pm.outputs.PM }} run build

      - name: Generate API reference (TypeDoc)
        run: ${{ steps.pm.outputs.PM == 'pnpm' && 'pnpm exec typedoc' || 'npx typedoc' }}

      - name: Install docs site dependencies
        run: npm ci
        working-directory: docs-site

      - name: Run docs site unit tests
        run: npm test
        working-directory: docs-site

      - name: Build docs site (ingest + Astro)
        run: npm run build
        working-directory: docs-site
        env:
          # Each version is served under its /vN prefix on the custom domain
          # (docs.memberjunction.org — no /MJ/ project prefix, github.io 301s).
          DOCS_BASE: /${{ matrix.id }}
          DOCS_SITE: https://docs.memberjunction.org
          DOCS_VERSION: ${{ matrix.id }}
          DOCS_VERSIONS: ${{ needs.resolve.outputs.versions }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach API reference under /api
        run: |
          mkdir -p docs-site/dist/api
          cp -R docs/. docs-site/dist/api/

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.id }}
          path: docs-site/dist
          retention-days: 3

  deploy:
    name: Assemble and deploy
    needs: [resolve, build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: dist

      - name: Assemble versioned site
        env:
          VERSIONS: ${{ needs.resolve.outputs.versions }}
          DEFAULT: ${{ needs.resolve.outputs.default }}
        run: |
          set -euo pipefail
          # dist/site-v5 -> dist/v5, matching each build's /vN base path.
          for d in dist/site-*; do
            mv "$d" "dist/${d#dist/site-}"
          done
          ls dist

          IDS_JS=$(jq -c '[.[].id]' <<<"$VERSIONS")
          LINKS_MD=$(jq -r 'map("<li><a href=\"/\(.id)/\">\(.label)</a></li>") | join("")' <<<"$VERSIONS")

          # Root redirect: the site's front door is the newest LTS set.
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/$DEFAULT/">
          <link rel="canonical" href="https://docs.memberjunction.org/$DEFAULT/">
          <title>MemberJunction Documentation</title>
          </head>
          <body><a href="/$DEFAULT/">MemberJunction documentation</a></body>
          </html>
          EOF

          # /mjcertified is a stable front-door URL: the BUSL's Additional Use
          # Grant points at the MemberJunction Certified Program by name, so the
          # program page needs a version-independent address that answers 200.
          # The 404 forwarder below would also land it, but only after serving a
          # 404 status — wrong for a page the license refers to.
          #
          # It targets the newest BUSL line, NOT $DEFAULT. $DEFAULT is the newest
          # certified LTS set, which today is v5 — an ISC line that predates the
          # program entirely, so sending the canonical program URL there would
          # answer the question on the one set where it does not apply. Falls
          # back to $DEFAULT before any BUSL line is published.
          CERT_SET=$(jq -r '[.[] | select((.id | ltrimstr("v") | tonumber) >= 6)] | max_by(.id | ltrimstr("v") | tonumber) | .id // empty' <<<"$VERSIONS")
          [ -n "$CERT_SET" ] || CERT_SET="$DEFAULT"
          echo "::notice::/mjcertified -> /$CERT_SET/mjcertified/"

          mkdir -p dist/mjcertified
          cat > dist/mjcertified/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/$CERT_SET/mjcertified/">
          <link rel="canonical" href="https://docs.memberjunction.org/$CERT_SET/mjcertified/">
          <title>MemberJunction Certified Program</title>
          </head>
          <body><a href="/$CERT_SET/mjcertified/">MemberJunction Certified Program</a></body>
          </html>
          EOF

          # Sitewide 404 (GitHub Pages serves only the root one). Forwards
          # legacy pre-versioning URLs (/guides/x/, /api/…, old root TypeDoc
          # deep links) into the default set; a path already carrying a /vN
          # prefix is never re-forwarded, so every request redirects at most
          # twice (legacy -> /vN -> /vN/api for old TypeDoc paths).
          cat > dist/404.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Page not found — MemberJunction Documentation</title>
          <script>
          (function () {
            var versions = $IDS_JS;
            var fallback = '/$DEFAULT';
            var path = location.pathname;
            var prefixed = versions.some(function (v) {
              return path === '/' + v || path.indexOf('/' + v + '/') === 0;
            });
            if (!prefixed) {
              location.replace(fallback + path + location.search + location.hash);
              return;
            }
            var deep = path.match(/^(\/v\d+)\/(classes|interfaces|enums|functions|modules|variables|types|documents|media|hierarchy)\/(.+)\$/);
            if (deep) {
              location.replace(deep[1] + '/api/' + deep[2] + '/' + deep[3] + location.search + location.hash);
            }
          })();
          </script>
          </head>
          <body>
          <h1>Page not found</h1>
          <p>That page doesn't exist in this version of the documentation. Try one of the documentation sets:</p>
          <ul>$LINKS_MD</ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
