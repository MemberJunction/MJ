name: Changeset bump levels

on:
  pull_request:
    branches:
      - next
    paths:
      - '.changeset/**'
      - 'migrations/**'
      - 'metadata/**'
      - '.github/scripts/check-changeset-bump.mjs'
      - '.github/workflows/ci-changeset-bump.yml'

jobs:
  check-changeset-bump:
    name: minor is reserved for migration / metadata branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # The gate diffs against the merge-base with the target branch, so the full history
          # has to be present — a shallow clone has no merge-base to compute.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check changeset bump levels
        # BASE_REF rides an env var rather than being interpolated into the run line: a ref name
        # is workflow-supplied text, and interpolating any of those directly into a shell command
        # is the standard Actions injection hole.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/check-changeset-bump.mjs --base "origin/$BASE_REF"
