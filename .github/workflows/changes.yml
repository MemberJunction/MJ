name: Ensure migrations are valid

on:
  pull_request:
    branches:
      - next
      - main

# Keyed by ref, like every other PR-scoped workflow here (test.yml, integration.yml,
# docs-site-ci.yml). A constant group makes the group REPO-WIDE: with cancel-in-progress,
# one PR's run cancels every other open PR's run, so `Check migrations` can only be green
# on whichever PR pushed last — and a re-run just moves the cancellation elsewhere.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: write` lets the migration-ID-determinism step post a sticky PR
# comment when it finds a violation. NOTE: for PRs from forks, GitHub hands the job a
# read-only GITHUB_TOKEN regardless of this block, so the comment step is best-effort
# (continue-on-error) — those PRs still get the ::warning + step summary.
permissions:
  contents: read
  pull-requests: write

jobs:
  changes_and_migrations:
    name: Check migrations
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Self-test migration ID determinism detector
        # Runs on EVERY PR (even those with no migrations, like the one that introduced
        # this check) so a regression in the load-bearing detectors (the NEWID() regex
        # and the spCreate-without-@ID structural scan) surfaces here rather than the
        # next time someone happens to add a migration.
        run: .github/scripts/check-migration-id-determinism.sh --self-test

      - name: Resolve current base branch tip
        id: base
        # Two subtleties:
        # 1. The default checkout is a depth-1 shallow clone of the merge commit,
        #    so the base branch's objects aren't present and `git diff <base>`
        #    fails with "bad object". Fetch the base at depth 1 — `git diff A B`
        #    compares trees, no history walk needed, so the incremental transfer
        #    is ~the PR diff size.
        # 2. We deliberately do NOT use `github.event.pull_request.base.sha`: it
        #    is a snapshot from when the PR was opened and never advances with
        #    the base branch. A long-lived PR that merges the base branch in
        #    (this repo's standard flow — no rebases) would be diffed against a
        #    months-old base and blamed for every migration merged since.
        #    `github.sha` is the test merge of the PR head into the CURRENT base
        #    tip, so diffing from that tip yields exactly what this PR adds.
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          echo "sha=$(git rev-parse FETCH_HEAD)" >> $GITHUB_OUTPUT

      - name: Check for migration file changes
        id: check_migrations
        run: |
          # Resolve the diff first so a real git failure (e.g. an unfetched base
          # commit) hard-fails the job under `set -e` instead of being swallowed
          # by `|| true` and reported as "no migrations".
          CHANGED_FILES=$(git diff --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }})
          MIGRATION_FILES=$(echo "$CHANGED_FILES" | grep -E '^migrations/.*\.sql$' || true)
          if [ -n "$MIGRATION_FILES" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "Migration files found:"
            echo "$MIGRATION_FILES"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No migration files in this PR - skipping validation"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up node
        # Unconditional, unlike the migration-specific steps below: the CodeGen-tail check
        # runs on every PR (see that step for why) and it needs node.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # No dependency cache here on purpose: this job never runs `pnpm install`
          # (the gate is shell + jq over filenames), so there is no pnpm store to save.
          # With `cache: 'pnpm'` the post-job cache-save step fails the whole check with
          # "Path Validation Error: Path(s) specified in the action for caching do(es) not
          # exist" — after every real validation step has already passed.

      - name: Check CodeGen tail matches committed migrations (#3737)
        # Lives in THIS job rather than a workflow of its own, and is NOT gated on
        # has_migrations. Both are deliberate:
        #
        # 1. `next-protect` requires exactly one context — `Check migrations`, i.e. this job.
        #    This workflow carries no `paths:` filter precisely so that context always
        #    reports. A separate paths-filtered workflow could never BE a required check: on
        #    every PR it skipped, the required context would never arrive and the PR would sit
        #    pending forever. Living in this job is what makes the guard a gate rather than a
        #    decoration nobody is blocked by.
        #
        # 2. Ungated because this drift is not introduced only by migration PRs. A PR that
        #    edits only a generated artifact, or only CodeGenLib — whose emitted shape the
        #    guard's extractors are pinned to — can introduce or expose it. The guard needs no
        #    database and no `pnpm install` and takes ~2s over 660+ migrations, so running it
        #    always is cheaper than reasoning about when not to.
        #
        # `--compare-to` scopes FAILURE to what this branch introduces. Both of the guard's
        # checks are whole-repo, so without it one bad merge onto the base branch would red
        # every subsequent PR — and because this context is required, "red" there means
        # "nobody can merge". Pre-existing drift is still surfaced, as a ::warning. The base
        # worktree is built from the base tip resolved above — the same base the migration
        # steps use, and deliberately not `pull_request.base.sha` (see that step's comment).
        run: |
          git worktree add --detach "$RUNNER_TEMP/codegen-tail-base" ${{ steps.base.outputs.sha }}
          node .github/scripts/check-codegen-tail.mjs --compare-to="$RUNNER_TEMP/codegen-tail-base"

      - name: Get current version
        if: steps.check_migrations.outputs.has_migrations == 'true'
        id: get_version
        run: |
          # Use MJServer package since core and global are pinned at 2.100.3
          CURRENT_VERSION=$(jq -r .version packages/MJServer/package.json)
          echo "Current version: $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Check migration filenames
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.CURRENT_VERSION }}"
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"

          # Which line are migrations building toward?
          #
          # Outside pre-mode the version is the LAST release (e.g. 5.50.0), so the next one bumps
          # the minor and migrations carry v5.51.x.
          #
          # In pre-mode the version is 6.1.0-edge.N and the stream is still building toward line
          # 6.1 — every subsequent edge release stays on 6.1 — so migrations keep v6.1.x. This
          # matches DEPLOYMENT.md: "use the tuple the Edge stream is building toward — while
          # `next` streams 6.1.0-edge.N, name it v6.1.x".
          #
          # The old unconditional minor+1 only happened to work for the FIRST edge release of a
          # line (6.0.x -> v6.1.x). On the second (6.1.0-edge.0 -> 6.1.0-edge.1) it demanded
          # v6.2.x and rejected every correctly-named migration in the release.
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            TARGET_LINE="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}"
            echo "Pre-release version $CURRENT_VERSION — migrations target the line being built toward: v$TARGET_LINE"
          else
            TARGET_LINE="${VERSION_PARTS[0]}.$(( ${VERSION_PARTS[1]} + 1 ))"
            echo "Released version $CURRENT_VERSION — migrations target the next minor: v$TARGET_LINE"
          fi
          EXPECTED_STRING="__v$TARGET_LINE"

          git diff --name-only --diff-filter=A ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^migrations/.*\.sql$' | while read file; do
            if [[ ! "$file" =~ $EXPECTED_STRING ]]; then
              echo "::error file=$file::Migration filename doesn't match the target line (v$TARGET_LINE)"
              exit 1
            fi
            if [[ ! "$file" =~ "V" ]]; then
              echo "::error file=$file::Migration filename doesn't begin with a  capital \`V\` character"
              exit 1
            fi
          done

      - name: Check migration timestamps are newer than existing
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          # Get new migration files being added in this PR
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^migrations/.*\.sql$' || true)

          # Drop anything already released. A migration present on `main` is not "new" — it is
          # released history arriving late through the post-release back-merge of main into next,
          # and it CANNOT be brought into order: renaming a migration that production databases
          # have already applied strands it as an unresolved applied version, which is strictly
          # worse than the out-of-order execution this check guards against.
          #
          # This only surfaces when a back-merge travels through a PR. publish.yml normally pushes
          # it straight to next, so this gate never sees one; it did for v6.1.0-edge.1 because the
          # automated merge hit conflicts and the merge was routed through review instead. The
          # check stays fully strict for genuinely new migrations, which is every feature PR.
          git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || true
          RELEASED_MIGRATIONS=$(git ls-tree -r --name-only FETCH_HEAD -- migrations/ 2>/dev/null | grep -E '\.sql$' || true)
          if [ -n "$RELEASED_MIGRATIONS" ]; then
            FILTERED=""
            while read -r file; do
              [ -z "$file" ] && continue
              if echo "$RELEASED_MIGRATIONS" | grep -qxF "$file"; then
                echo "↷ $(basename "$file") is already released on main — not a new migration, skipping"
              else
                FILTERED="${FILTERED}${file}"$'\n'
              fi
            done <<< "$NEW_MIGRATIONS"
            NEW_MIGRATIONS=$(printf '%s' "$FILTERED")
          fi

          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migration files to check"
            exit 0
          fi

          # Find the maximum timestamp from all existing migrations on the base branch
          # This ensures new migrations always come after all prior version migrations
          MAX_EXISTING_TIMESTAMP=0

          # Get all existing migration files from the base branch
          for file in $(git ls-tree -r --name-only ${{ steps.base.outputs.sha }} -- migrations/ | grep -E '\.sql$'); do
            filename=$(basename "$file")
            # Extract timestamp from filename (VYYYYMMDDHHMM format)
            if [[ "$filename" =~ ^V([0-9]{12})__ ]]; then
              timestamp="${BASH_REMATCH[1]}"
              if [ "$timestamp" -gt "$MAX_EXISTING_TIMESTAMP" ]; then
                MAX_EXISTING_TIMESTAMP=$timestamp
                MAX_EXISTING_FILE="$filename"
              fi
            fi
          done

          echo "Maximum existing migration timestamp: $MAX_EXISTING_TIMESTAMP (from $MAX_EXISTING_FILE)"

          # Check each new migration has a timestamp greater than the max existing
          echo "$NEW_MIGRATIONS" | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ ^V([0-9]{12})__ ]]; then
              new_timestamp="${BASH_REMATCH[1]}"
              if [ "$new_timestamp" -le "$MAX_EXISTING_TIMESTAMP" ]; then
                echo "::error file=$file::Migration timestamp ($new_timestamp) must be greater than the latest existing migration timestamp ($MAX_EXISTING_TIMESTAMP from $MAX_EXISTING_FILE). This prevents out-of-order execution when upgrading between versions."
                exit 1
              else
                echo "✓ $filename timestamp ($new_timestamp) is valid (> $MAX_EXISTING_TIMESTAMP)"
              fi
            fi
          done

      - name: Check for duplicate migration versions
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          # Two migrations sharing a version both get applied — the history
          # table is keyed by installed_rank, not version — writing duplicate
          # rows. Scan the whole migrations/ tree of the checked-out PR state so
          # this catches collisions with already-merged files and renames, not
          # just newly added files.
          DUPES=$(find migrations -type f -name 'V*.sql' \
            | sed -E 's@.*/V([0-9]{12})__.*@\1@' \
            | grep -E '^[0-9]{12}$' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            for v in $DUPES; do
              echo "::error::Duplicate migration version $v is used by more than one file:"
              find migrations -type f -name "V${v}__*.sql" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "No duplicate migration versions found"

      - name: Check migration content
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          git diff --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^migrations/.*\.sql$' | while read file; do
            # Strip single-quoted SQL string literals before the hard-coded-schema check so that
            # seeded data (e.g. prompt/template content that legitimately shows __mj.* SQL examples)
            # doesn't trip the guard. T-SQL escapes a quote by doubling it (''); slurp mode handles
            # multi-line literals. Genuine schema refs in executable DDL/DML live outside strings.
            stripped=$(perl -0777 -pe "s/'(?:''|[^'])*'//gs" "$file")
            if printf '%s' "$stripped" | grep -qP "__mj[^_]"; then
              echo "::error file=$file::Migration script contains a reference to a hard-coded \`__mj\` schema"
              exit 1
            fi
            if grep -qP "\\$\{flyway:defaultSchema\}_([A-Z][a-z]+At)" "$file"; then
              echo "::error file=$file::Migration script is using the Flyway schema placeholder in a timestamp column"
              exit 1
            fi
          done

      - name: Check migration ID determinism (hard-coded UUIDs, not NEWID())
        id: id_determinism
        if: steps.check_migrations.outputs.has_migrations == 'true'
        # Deterministic replacement for the former Opus-powered "Claude Code Review"
        # migration check (removed .github/workflows/claude.yml). The detectors — the
        # load-bearing NEWID() regex + allow-list, the structural spCreate-without-@ID
        # scan, the Flyway-only glob, and the full rationale — live in the committed,
        # self-testable script below (run on every PR via the "Self-test" step above),
        # NOT inline here, so future edits can be re-validated instead of trusted. It
        # scans only the lines this PR ADDS to changed migration files and is ADVISORY
        # (never fails the job); hits are surfaced as a sticky PR comment + ::warning +
        # step summary. Both detectors were retro-validated against all 617 committed
        # migrations (see the script header).
        #
        # IN SCOPE (both mint a non-deterministic ID, both mechanically checkable):
        #   1. a literal NEWID() that generates an ID, and
        #   2. an `EXEC spCreate<Entity>` invocation missing `@ID` (the proc's
        #      ISNULL(@ID, NEWID()) fallback then fires).
        #
        # OUT OF SCOPE (deliberately — a judgment call, not a grep): a raw INSERT that
        # omits the ID column (table default NEWSEQUENTIALID() mints a fresh ID). It is
        # syntactically detectable, but omitting ID is NOT a violation in general —
        # CodeGen/metadata-sync omit ID on bulk-metadata inserts by design (6,186 such
        # inserts across the committed migrations, virtually all legitimate). Flagging
        # them needs semantics — which tables' rows are FK-referenced by stable IDs —
        # not something a structural scan can settle without a maintained allow-list.
        env:
          COMMENT_BODY_FILE: ${{ runner.temp }}/id-determinism-comment.md
        run: |
          .github/scripts/check-migration-id-determinism.sh \
            '${{ steps.base.outputs.sha }}' \
            '${{ github.sha }}'

      - name: Comment on non-deterministic migration IDs
        # Best-effort: fork PRs get a read-only token and this fails — the ::warning +
        # step summary from the step above still fire, so the signal isn't lost.
        if: steps.check_migrations.outputs.has_migrations == 'true' && steps.id_determinism.outputs.found == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: migration-id-determinism
          path: ${{ runner.temp }}/id-determinism-comment.md

      - name: Clear stale non-deterministic ID comment
        # Remove the sticky comment whenever this push has NO current violation — which
        # includes the case where a later push removed all migration changes entirely
        # (has_migrations=false skips the determinism step, so `found` is empty ≠ 'true').
        # `!cancelled()` lets it also clear a stale comment when an unrelated migration
        # check failed. Best-effort (continue-on-error) — a no-op if there's no comment.
        if: ${{ !cancelled() && steps.id_determinism.outputs.found != 'true' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: migration-id-determinism
          delete: true

      - name: Check for minor version change
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          MIGRATION_FILES=$(git diff --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^migrations/.*\.sql$' || true)
          if [ -n "$MIGRATION_FILES" ]; then
            MINOR_CHANGE=$(grep 'minor' .changeset/*.md || true)
            if [ -z "$MINOR_CHANGE" ]; then
              echo "::error::Migration files were added, but no minor version changeset was found"
              exit 1
            fi
          fi
