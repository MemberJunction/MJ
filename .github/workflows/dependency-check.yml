name: Check Dependencies

on:
  pull_request:
    branches:
      - next
    # No `paths:` filter, on purpose: `Detect missing and unused dependencies` is a required check
    # in next-protect, and a workflow skipped by a paths filter never reports its checks, so the PR
    # would wait forever. The `changes` job applies the same filter; a job skipped by its `if`
    # reports as passing.

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: dependency-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect dependency-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check changed paths
        id: filter
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF"
          CHANGED="$(git diff --name-only "origin/$PR_BASE_REF...HEAD")"
          # The old paths filter: packages/**/*.ts, packages/**/*.tsx, packages/**/package.json,
          # package.json, pnpm-lock.yaml.
          if echo "$CHANGED" | grep -qE '^packages/(.*/)?[^/]*\.tsx?$|^packages/(.*/)?package\.json$|^(package\.json|pnpm-lock\.yaml)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  check-dependencies:
    name: Detect missing and unused dependencies
    needs: changes
    # Fail closed: a skipped required check counts as passing, so if change detection itself
    # failed, run the real check rather than skip it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip dependency check
        id: knip
        run: |
          echo "Running Knip to check for missing dependencies..."
          # Capture stdout and stderr separately so a knip crash doesn't masquerade
          # as "no issues found" (which is what happened for months — see 5.25.0 postmortem).
          set +e
          NO_COLOR=1 npx knip --include unlisted --reporter compact > knip-report.txt 2> knip-stderr.txt
          KNIP_EXIT=$?
          set -e

          # Display the raw report
          cat knip-report.txt

          # Detect knip infrastructure failures (exit code 2 = crash, not "issues found")
          if [ $KNIP_EXIT -eq 2 ]; then
            echo ""
            echo "::error::Knip crashed during analysis (exit code 2). Stderr:"
            cat knip-stderr.txt
            echo "knip_crashed=true" >> $GITHUB_OUTPUT
          else
            echo "knip_crashed=false" >> $GITHUB_OUTPUT
            # Show stderr warnings if any (non-fatal)
            if [ -s knip-stderr.txt ]; then
              echo ""
              echo "Knip warnings:"
              cat knip-stderr.txt
            fi
          fi

      - name: Fail fast if Knip crashed
        if: steps.knip.outputs.knip_crashed == 'true'
        run: |
          echo "❌ Knip failed to run. The dependency check is broken and must be fixed."
          echo "   This prevents silent accumulation of missing dependencies."
          echo ""
          echo "   See the knip-stderr.txt artifact for details."
          exit 1

      - name: Format report
        if: steps.knip.outputs.knip_crashed != 'true'
        run: node scripts/format-knip-report.mjs knip-report.txt > formatted-report.md

      - name: Check for actual issues
        id: check_issues
        if: steps.knip.outputs.knip_crashed != 'true'
        run: |
          # Check the formatted report to see if there are actual missing dependencies
          # after filtering out false positives
          if grep -q "Found \*\*[1-9][0-9]* missing dependencies\*\*" formatted-report.md; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
            echo "⚠️ Missing dependencies detected after filtering"
          elif grep -q "Found \*\*0 missing dependencies\*\*" formatted-report.md; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "✅ No real missing dependencies (false positives filtered out)"
          elif grep -q "All dependencies are properly declared" formatted-report.md; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "✅ No missing dependencies found"
          else
            # Unknown output format — fail safe rather than silently passing
            echo "has_issues=true" >> $GITHUB_OUTPUT
            echo "⚠️ Could not determine dependency status — treating as failure"
          fi

      - name: Comment PR with results
        if: steps.knip.outputs.knip_crashed != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('formatted-report.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- dependency-check-report -->')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload Knip report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: knip-report
          path: |
            knip-report.txt
            knip-stderr.txt
          retention-days: 30

      - name: Fail if missing dependencies found
        if: steps.check_issues.outputs.has_issues == 'true'
        run: |
          echo "❌ Missing dependencies detected! Please run 'npm run deps:fix-missing' locally to fix."
          echo ""
          echo "See the PR comment above for details on which dependencies are missing."
          exit 1
