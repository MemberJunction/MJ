name: Work Queue Azure

# Checks the Azure Terraform module and the destructive-plan gate. The unit tests of the packages run in test.yml like
# every package; the real-namespace conformance run is manual because it needs a sandbox Service Bus namespace.

on:
  pull_request:
    branches: [next]
    paths:
      - 'infrastructure/terraform/work-queue/azure/**'
      - 'packages/WorkQueue/core/**'
      - 'packages/WorkQueue/azure/**'
      - '.github/workflows/work-queue-azure.yml'
  workflow_dispatch:

concurrency:
  group: work-queue-azure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  terraform-module:
    name: Terraform module checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform/work-queue/azure
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: terraform test
      - name: Validate example
        working-directory: infrastructure/terraform/work-queue/azure/examples/basic
        run: terraform init -backend=false -input=false && terraform validate

  plan-gate:
    name: Destructive-plan gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infrastructure/terraform/work-queue/azure/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Safe plan passes
        run: node check-destructive-plan.mjs fixtures/plan-safe.json
      - name: Destructive plan is blocked
        run: |
          if node check-destructive-plan.mjs fixtures/plan-destructive.json; then
            echo "The gate let a destructive plan through"; exit 1
          fi
      - name: Destructive plan passes with the approval flag
        run: node check-destructive-plan.mjs fixtures/plan-destructive.json --allow-destructive

  servicebus-conformance:
    name: Service Bus conformance (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Repository variables: AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID for a federated identity holding
    # Azure Service Bus Data Owner on the sandbox namespace named by AZURE_SERVICEBUS_NAMESPACE.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/mj-setup
      - run: cd packages/WorkQueue/core && pnpm run build
      - run: cd packages/WorkQueue/azure && pnpm run build
      - run: cd packages/WorkQueue/azure && pnpm run test:servicebus
        env:
          AZURE_SERVICEBUS_NAMESPACE: ${{ vars.AZURE_SERVICEBUS_NAMESPACE }}
