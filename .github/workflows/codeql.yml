# .github/workflows/codeql.yml
#
# Advanced CodeQL setup for MemberJunction/MJ. Enabling this workflow retired GitHub's
# default setup; the two must not coexist.
#
# WHY THE JAVASCRIPT/TYPESCRIPT ANALYSIS IS SPLIT IN TWO
#
# Default setup analysed all 8,183 JavaScript/TypeScript files in one job and hit the
# six-hour Actions ceiling on two taint-tracking queries (SqlInjection, CodeInjection),
# driven by generated code — the generated GraphQL resolvers alone hold hundreds of
# template-string SQL statements feeding ExecuteSQL. TypeScript therefore produced no
# findings at all. The fix, with the full analysis in PR #4242: exclude generated code
# everywhere, and split the language by risk so the security-critical packages get the
# deeper suite more often than the rest.
#
# MEASURED ON HOSTED RUNNERS — ubuntu-latest, CodeQL 2.26.4, full scan of next,
# 5 September 2026, run 33972646378:
#
#   id        language               files  suite              duration  results
#   actions   actions                  n/a  security-extended    1m23s       66
#   python    python                   n/a  security-extended    1m27s        3
#   js-core   javascript-typescript  1,572  security-extended    7m31s      133
#   js-rest   javascript-typescript  3,680  security-extended   10m38s      226
#
# The js-rest figure is from a dispatch run of this configuration on its PR branch the same
# day (run 33974166719); on the default suite the same set measured 15m33s with 172
# results. The 60-minute timeout is a ceiling with margin, not a forecast: a run
# approaching it is a regression to investigate, not a reason to raise the number.
#
# PULL-REQUEST RUNS ARE DIFF-INFORMED. On pull_request events the CodeQL action computes
# the changed line ranges and restricts path-problem queries to them. A PR run is
# therefore faster than a full scan (js-core: about 3 minutes) and reports only findings
# on changed lines. A PR run showing zero results says nothing about the rest of the
# package; full-scan figures come only from push and scheduled runs on next.
#
# WHAT RUNS WHEN
#
# js-core is MJServer, AuthProviders, AI, Actions, MJGlobal and React/runtime — the API
# surface, identity, the prompt and agent pipeline, the code execution sandbox, SQL
# expression validation and model-authored component execution. It runs on every pull
# request and on every merge to next. The merge run keeps the default-branch baseline
# current: without it, a finding merged on Tuesday shows as "new" on every other open PR
# until the weekly run, and a finding fixed on Tuesday stays open until then.
#
# js-rest is the remainder, predominantly Angular Explorer. It runs weekly and on demand.
#
# The weekly schedule also re-scans unchanged code with GitHub's newest query packs.
# Keep it even if every analysis is someday moved to push.
#
# WHY A "plan" JOB
#
# Which analyses run depends on the event, and a job-level `if` cannot read the matrix
# context, so a short first job filters the analysis list for the current event and
# hands the survivors to the matrix. Analyses that do not apply never start.
#
# RUN ON DEMAND — before a significant release, or to refresh the baseline. Use the
# filename: the retired default setup left a second workflow record named "CodeQL", so
# the by-name form prompts for disambiguation.
#   gh workflow run codeql.yml --repo MemberJunction/MJ --ref next

name: CodeQL

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  schedule:
    - cron: '0 10 * * 1'      # Monday 10:00 UTC
  workflow_dispatch:

jobs:
  plan:
    name: Select analyses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select analyses for ${{ github.event_name }}
        id: select
        env:
          EVENT: ${{ github.event_name }}
        # run_on controls which events each analysis answers to:
        #   always    pull requests, merges to next, the weekly schedule and manual runs
        #   schedule  the weekly schedule and manual runs only
        run: |
          selected=$(jq -c --arg event "$EVENT" '
            { include: map(select(
                .run_on == "always"
                or (.run_on == "schedule" and ($event == "schedule" or $event == "workflow_dispatch"))
              )) }' <<'JSON'
          [
            { "id": "actions",
              "language": "actions",
              "queries": "security-extended",
              "config": "./.github/codeql/codeql-config.yml",
              "category": "/language:actions",
              "run_on": "always" },

            { "id": "python",
              "language": "python",
              "queries": "security-extended",
              "config": "./.github/codeql/codeql-config.yml",
              "category": "/language:python",
              "run_on": "always" },

            { "id": "js-core",
              "language": "javascript-typescript",
              "queries": "security-extended",
              "config": "./.github/codeql/codeql-config-core.yml",
              "category": "/language:javascript-typescript/core",
              "run_on": "always" },

            { "id": "js-rest",
              "language": "javascript-typescript",
              "queries": "security-extended",
              "config": "./.github/codeql/codeql-config-rest.yml",
              "category": "/language:javascript-typescript/rest",
              "run_on": "schedule" }
          ]
          JSON
          )
          echo "Event: $EVENT"
          echo "Selected: $(jq -r '.include[].id' <<<"$selected" | paste -sd, -)"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.id }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60         # longest measured full scan is under 16 minutes

    # Per-analysis concurrency. A superseded run is cancelled for everything except
    # js-rest, the long one: a manual run landing on top of the weekly run must not kill it.
    concurrency:
      group: codeql-${{ matrix.id }}-${{ github.ref }}
      cancel-in-progress: ${{ matrix.id != 'js-rest' }}

    permissions:
      security-events: write    # required to upload results
      contents: read
      actions: read

    strategy:
      fail-fast: false          # one language failing must not hide the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}
          config-file: ${{ matrix.config }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # Distinct categories keep the two JavaScript/TypeScript analyses as separate
          # result sets. Without this the second upload overwrites the first and half the
          # codebase silently disappears from the Security tab.
          category: ${{ matrix.category }}
