name: UI layering gate

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/package.json'
      - '.github/scripts/check-ui-layers.mjs'
      - '.github/scripts/__tests__/check-ui-layers.test.mjs'
      - '.github/workflows/ci-ui-layers.yml'

jobs:
  check-ui-layers:
    name: widgets must not import Explorer or Router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # packages/Angular is CLEAN and therefore LOCKED: --require-declared makes a package with no
      # "mjUILayer" field a failure rather than a skip. Without it the way drift returns is not an
      # edit to an existing package — it is a NEW package that never opts in, and from the outside
      # "undeclared" is indistinguishable from "compliant".
      - name: Check UI layer boundaries (packages/Angular — locked)
        run: node .github/scripts/check-ui-layers.mjs packages/Angular --require-declared

      # The rest of packages/ is still adopting, so undeclared packages are skipped here. Declared
      # ones are still checked — that is what makes incremental adoption safe.
      - name: Check UI layer boundaries (rest of packages — adopting)
        run: node .github/scripts/check-ui-layers.mjs packages

      # The gate's own parser, comment-stripper and escape-hatch behaviour. A gate with a broken
      # parser passes everything, so this is not optional.
      - name: Install vitest for the guard's own tests
        run: npm install --no-save --no-audit --no-fund vitest@^4

      - name: Test the gate itself
        run: npx vitest run --config .github/scripts/vitest.config.mts __tests__/check-ui-layers.test.mjs
