name: No internal peerDependencies

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/**/package.json'
      - '.github/scripts/check-internal-peer-deps.mjs'
      - '.github/workflows/ci-internal-peer-deps.yml'

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: ci-internal-peer-deps-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  check-internal-peer-deps:
    name: packages/** must not peer-depend on @memberjunction/*
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check for internal peerDependencies
        run: node .github/scripts/check-internal-peer-deps.mjs packages
