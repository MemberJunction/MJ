name: JiT catch spike (temporary)
# Runs the phase 0 probes that must execute on a GitHub-hosted runner. Deleted at the end of phase 0.
on:
  workflow_dispatch:
    inputs:
      base: { description: 'base SHA', required: true }
      head: { description: 'head SHA', required: true }
      package: { description: 'package to build, e.g. @memberjunction/core', required: true, default: '@memberjunction/core' }
  # Fallback: a dispatch needs the file on the default branch, so a draft PR runs the 5 samples below.
  pull_request:
    paths: ['plans/catching-jittests-spike/**']
permissions:
  contents: read
jobs:
  q3-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4            # probe 10 runs pnpm on the host
      - run: docker build -q -f plans/catching-jittests-spike/Dockerfile.sandbox -t jit-sandbox:spike plans/catching-jittests-spike
      - name: Attack the sandbox from inside
        shell: bash                            # pipefail: a leak (exit 1) fails the job
        run: bash plans/catching-jittests-spike/q3-sandbox-attack.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show what the runner user can do (context for the design, never inside the sandbox)
        if: always()
        shell: bash
        run: |
          echo "runner uid: $(id -u); sudo: $(sudo -n true 2>&1 && echo yes || echo no); docker: $(docker --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ACTIONS_RUNTIME_TOKEN set on host: $([ -n "${ACTIONS_RUNTIME_TOKEN:-}" ] && echo yes || echo no)" | tee -a "$GITHUB_STEP_SUMMARY"
  q1-q8-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # base = merge commit's first parent, head = merge commit. A dispatch runs only its inputs.
        sample: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"pr":"dispatch","base":"{0}","head":"{1}","package":"{2}"}}]', inputs.base, inputs.head, inputs.package) || '[
          {"pr":"6368 (1 pkg)","base":"ea207aec3a44ded6d2eb2fed3943afc5c34c2372","head":"a163aeafec119efa70bf1f03740627a64e5c3b61","package":"@memberjunction/sql-converter"},
          {"pr":"6362 (2 pkg)","base":"ef864e3d090d928d572ac5bfffb8c7a57241cf71","head":"958b8818b05daf7c775511feeb9edade47be3ff5","package":"@memberjunction/react-test-harness"},
          {"pr":"6122 (2 pkg)","base":"22050a32d89a30513ec0972617ac90dcf2c754be","head":"314640c9d6b4a378fc2ded49d5e544f17d8f1ee7","package":"@memberjunction/metadata-sync"},
          {"pr":"6357 (MJCore)","base":"c1f0dc218330adfce126b30edc950b088bc9c4f5","head":"eee025bc6d673cc17828928a67ad4849feeec25b","package":"@memberjunction/core"},
          {"pr":"6280 (Angular)","base":"68b80a13f2100b57a73a63c493f1ac81f6426864","head":"8c5bf84db5e62edeb880ef3328118df567acccef","package":"@memberjunction/ng-conversations"}
          ]') }}
    name: q1-q8-build ${{ matrix.sample.pr }}
    env:
      # Job 1 half only. The job 2 half runs in the sandbox, which has no environment at all.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none', persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 24 }            # no `cache: pnpm` — this job must not save a cache (D29)
      - name: Restore pnpm store (restore only)
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/pnpm/store
          key: jit-spike-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: jit-spike-pnpm-
      - run: df -m . | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - shell: bash                            # pipefail: a failing script fails the job
        run: bash plans/catching-jittests-spike/q1-q8-build-timing.sh "${{ matrix.sample.base }}" "${{ matrix.sample.head }}" "${{ matrix.sample.package }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
