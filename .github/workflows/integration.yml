name: Integration Tier

# Deterministic integration tier — the check bundles in the private
# @memberjunction/integration-test-suite package, dispatched by `mj test suite`
# ("Integration Tests — Deterministic") against a fresh SQL Server, on every PR that
# touches server code or the integration metadata. Single entry path: the per-bundle tsx
# dispatchers and run-all.ts were removed in the July-2026 restructure.
#
# HOST-BASED lane (no Docker regression images). This PR gate provisions the DB directly on
# the runner: a throwaway SQL Server container, THIS branch's locally-built `mj` CLI applies
# the committed migrations, then `mj sync push` reconciles the committed metadata, and the
# aggregator runs in-process against it. No AssociationDB, no live CodeGen, no MJAPI/Explorer:
#
#   * The DETERMINISTIC suites touch only core __mj entities. `mj migrate` applies the
#     committed CodeGen_Run_*.sql migrations AND the repeatable R__RefreshMetadata, which
#     together provision every core view / proc / EntityField row — so no live `mj codegen`
#     pass is needed. (Running one here would also mask the exact metadata-vs-migration drift
#     that the separate "Test metadata sync push" gate exists to catch.)
#   * AssociationDB is only required by the Predictive Studio tier, which is gated OFF here.
#   * `mj sync push --dir=metadata` pushes the default metadata dir — which includes the inert
#     "Integration Test" TestType (metadata/test-types/). A SECOND push then applies the sibling
#     `metadata-optional/integration-test/` root, which holds the actual test-only records — the
#     IT01–IT68 Tests (69 records), the integration suite hierarchy, the RLS security principals
#     (users + scoped role + grant), AND the synthetic AI stack the live tier drives (14 `IT: *`
#     agents, 14 prompts, 42 model bindings, a skill, a search scope) — 246 records in total.
#     It is kept out of `metadata/` so those synthetic accounts never reach a production DB
#     (R2). Order matters: this root after metadata (the IT records @lookup the TestType by name), and
#     its own directoryOrder (tests → test-suites → roles → entity-permissions → users) resolves
#     every @lookup ref.
#   * The gated tiers all SKIP cleanly here: Predictive Studio (PS_INTEGRATION unset),
#     Live Model (RUN_AGENT_TESTS unset), and the client suite (no live MJAPI reachable).
#
# The migrate/sync CORRECTNESS gate is a SEPARATE workflow ("Test metadata sync push"): here
# migrate + sync are the aggregator's SETUP, not its system-under-test.
#
# This host-based lane is the sole CI home for the integration tier. The earlier container-based
# lane (a reusable that provisioned via the Docker regression stack's db-setup) was removed along
# with the unused browser/Computer-Use regression wiring — this repo does not run that stack in CI.

on:
  pull_request:
    branches: [next]
    paths:
      - 'package-lock.json'
      - 'packages/**'
      - 'migrations/**'
      # PostgreSQL migrations provision the PG lane below. Without this entry the PR class most
      # likely to break that lane — a PG-migration PR — would never trigger it, leaving only the
      # post-merge push-to-next backstop to catch it.
      - 'migrations-pg/**'
      # All integration test/suite/type metadata AND the RLS fixtures now live under this one
      # optional sibling root (kept out of the default-pushed metadata/ tree — R2).
      - 'metadata-optional/**'
      - 'mj.config.cjs'
      - 'tsconfig*'
      - 'turbo.json'
      - '.github/workflows/integration.yml'
  # Full backstop: every merge into next runs the gate, so a filter-missed break (paths are a
  # heuristic; migrations + runtime @RegisterClass wiring can couple files no filter foresees)
  # can never merge silently and red the next PR (R3, mirrors test.yml).
  push:
    branches: [next]
  workflow_dispatch:

# Cancel superseded PR runs for the same ref. EXCEPTION: push (merge to next) events get a
# per-commit group and are NEVER cancelled — every merge's backstop must run to completion
# (github.ref is refs/heads/next for every merge, so a shared group would let a later merge
# kill an earlier one's backstop). Mirrors test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  integration-sqlserver:
    name: Integration (SQL Server, deterministic)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Both the committed mj.config.cjs and the aggregator's own config layer read DB creds
    # from these env vars (LoadDbConfig falls back to DB_* when mj.config has no
    # databaseSettings block — which the repo-root config does not).
    env:
      DB_HOST: localhost
      DB_DATABASE: test
      DB_USERNAME: sa
      DB_PASSWORD: VeryStr0ngP@ssw0rd
      CODEGEN_DB_USERNAME: sa
      CODEGEN_DB_PASSWORD: VeryStr0ngP@ssw0rd
      DB_TRUST_SERVER_CERTIFICATE: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Fresh SQL Server (same provisioning the migrate/sync gate uses) ─────────────────
      - name: Create docker network
        run: docker network create -d bridge local-net

      - name: Create SQL Server container
        run: docker run --rm -d --network local-net --name sql -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=VeryStr0ngP@ssw0rd" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      # Poll until SQL Server actually answers a query, rather than a blind sleep. A cold
      # container that merely started (but is still doing recovery/tempdb setup) will accept
      # a connection yet stall the first heavy transaction — which is what tripped the sync
      # push's 15s request timeout. Waiting for a real `SELECT 1` before migrate/sync ensures
      # those run against a warm server. ~60s budget (30 × 2s); fails the step if never ready.
      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network local-net mcr.microsoft.com/mssql-tools \
                 /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready (attempt $i)."
              exit 0
            fi
            echo "Waiting for SQL Server... (attempt $i/30)"
            sleep 2
          done
          echo "SQL Server did not become ready within the timeout." >&2
          exit 1

      - name: Create SQL database
        run: docker run --rm --network local-net mcr.microsoft.com/mssql-tools /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -Q "CREATE DATABASE [test];"

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Build the graph the aggregator imports: testing-integration (+ its deps, which cover
      # core/core-entities/sqlserver-dataprovider/graphql-dataprovider/predictive-studio/
      # scheduling-engine/aiengine/ai-agents/actions/record-set-processor), open-app-engine
      # (open-app-teardown-tests.ts imports it directly, and it is NOT a testing-integration
      # dep), and the mj CLI (migrate + sync push). --filter skips the Angular/Explorer half
      # of the monorepo this lane never touches. Built once; every step below reuses it.
      - name: Build integration graph + CLI
        run: npx turbo build --filter=@memberjunction/cli --filter=@memberjunction/testing-integration --filter=@memberjunction/integration-test-suite --filter=@memberjunction/open-app-engine

      # Provision the DB (aggregator SETUP): apply the committed migrations — which include the
      # committed CodeGen output and the repeatable R__RefreshMetadata that refreshes every core
      # view/proc/EntityField — then reconcile the committed metadata against that schema.
      - name: Migrate — apply committed migrations to the fresh DB
        env:
          # Headroom over mssql's 15s default for the first heavy workload on a cold server.
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
        run: node packages/MJCLI/bin/run.js migrate

      - name: Sync push — reconcile committed metadata (mj sync push --ci)
        env:
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
        run: node packages/MJCLI/bin/run.js sync push --dir=metadata --ci

      # The optional integration root holds the actual test-only records — the IT01–IT68 Tests, the
      # integration suite, AND the RLS security principals (users + scoped role + entity-permission
      # grant). (The inert "Integration Test" TestType itself lives in metadata/ and came in with the
      # main push above.) This root is deliberately kept OUT of the default-pushed metadata/ tree so
      # those synthetic accounts never reach a production DB (R2). Push it AFTER the main metadata push
      # (the IT records @lookup the TestType by name); its own directoryOrder (tests → test-suites →
      # roles → entity-permissions → users) resolves every @lookup ref in order. Without this the
      # RLS8/9/10 checks skip-as-pass, so the gate stays green either way — but pushing here keeps them exercised.
      - name: Sync push — seed the optional integration metadata + RLS fixtures
        env:
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'   # same cold-runner headroom as the main push above
        run: node packages/MJCLI/bin/run.js sync push --dir=metadata-optional/integration-test --ci

      # Assert the fixtures actually landed. `mj sync push` can, in principle, exit 0 without
      # seeding (e.g. a silent no-op); if the 3 @integration.test principals are absent, the
      # deterministic RLS8/9/10 checks skip-as-pass and the tier's strongest coverage silently
      # stops running while the gate stays green. Fail loudly here instead (R2 follow-up).
      - name: Verify RLS integration fixtures were seeded
        run: |
          COUNT=$(docker run --rm --network local-net mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S sql -U SA -P 'VeryStr0ngP@ssw0rd' -d test -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM __mj.[User] WHERE Email LIKE '%@integration.test';")
          COUNT=$(echo "$COUNT" | tr -d '[:space:]')
          echo "Seeded @integration.test fixture users: ${COUNT}/3"
          if [ "${COUNT:-0}" -lt 3 ]; then
            echo "::error::RLS integration fixtures were not seeded (found ${COUNT}/3 @integration.test users). The fixtures sync push may have exited 0 without seeding — the deterministic RLS8/9/10 checks would silently skip-as-pass. Re-run: mj sync push --dir=metadata-optional/integration-test" >&2
            exit 1
          fi

      # The deterministic tier via the single entry path: `mj test suite` loads the private
      # suite package through mj.config.cjs `testing.checkModules`, dispatches every IT
      # record in "Integration Tests — Deterministic", and exits non-zero on failures.
      # No live-model pin needed: the deterministic suite contains no live-model members
      # (they live in the separate "Integration Tests — Live Model" suite), and LLM creds
      # come from the local .env, which CI does not have. PS_INTEGRATION stays unset. No
      # MJAPI is up and no MJ_API_KEY is set, so the 19 client-transport members of the suite
      # report Skipped — an environment gap, not a product failure. They previously reported
      # Error (LoadClientConfig throws on the missing key before the MJAPI preflight is even
      # reached) and the suite exit code counted only 'Failed', so 19 of 54 tests never ran and
      # the lane still went green. That is why this lane's skip count is now 19, not 0.
      - name: Run integration tier (mj test)
        env:
          # Activates all 49 mutation-tier checks across 13 bundles (47 pre-existing + this PR's 2
          # pg-parity CRUD legs). They are self-cleaning
          # (each creates and deletes its own fixture) and the release procedure has always run
          # them locally — but until now no workflow set this, so CI was gating on a strictly
          # weaker suite than the documented release check. Set on BOTH lanes so the two stay
          # symmetric: the PostgreSQL lane needs it for pg-parity's CRUD legs, and SQL Server is
          # only a useful baseline oracle if it runs the same set.
          RUN_MUTATION_TESTS: '1'
        run: npm run test:integration 2>&1 | tee integration-sqlserver.log; exit "${PIPESTATUS[0]}"

      # The skip count is an INVARIANT, not a note. Skips are excluded from failedTests by
      # design, so a bundle that silently stops running — a RegisterBundlePlatforms used as a
      # quarantine, a dropped RUN_MUTATION_TESTS, a new client-transport member — raises this
      # number and nothing goes red. That is the same false green the branch exists to remove,
      # so the documented expectation is asserted here (mirroring the RLS fixture guard above).
      # A MISSING count fails too: silence must never read as zero.
      - name: Verify the skip count is exactly the documented expectation
        env:
          EXPECTED_SKIPS: '19'
        run: |
          LINE=$(grep -oE '\[SKIPPED\] [0-9]+ test' integration-sqlserver.log | tail -1) || true
          if [ -z "$LINE" ]; then
            if grep -q '\[SUITE_COMPLETE\]' integration-sqlserver.log; then
              ACTUAL=0
            else
              echo "::error::Could not read a skip count from the integration output — the suite did not report [SUITE_COMPLETE]. Treating as a failure rather than as zero skips." >&2
              exit 1
            fi
          else
            ACTUAL=$(echo "$LINE" | grep -oE '[0-9]+')
          fi
          if [ "$ACTUAL" != "$EXPECTED_SKIPS" ]; then
            echo "::error::SQL Server lane skipped ${ACTUAL} tests; expected exactly ${EXPECTED_SKIPS}. MORE skips mean coverage silently stopped running (a bundle quarantined via RegisterBundlePlatforms, RUN_MUTATION_TESTS dropped, or a new client-transport member). FEWER means coverage was restored — update EXPECTED_SKIPS in this workflow to lock in the gain." >&2
            exit 1
          fi
          echo "Skip count is ${ACTUAL}, matching the documented expectation."

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # PostgreSQL lane. Same suite, same check code, second backend — this is what turns "SS/PG
  # parity" from an assumption into a verified property. BLOCKING by design: a non-gating lane
  # would let PG runtime regressions merge, which is the exact situation this lane was created
  # to end (issue #3257).
  #
  # It differs from the SQL Server lane in provisioning only: a postgres:17 service container,
  # the cdp_* roles the migration GRANTs reference, and `migrations-pg/v5`. Everything from
  # `mj sync push` onward is byte-identical work against a different database.
  #
  # EXPECTED SKIPS on this lane: TWENTY-ONE.
  #   * IT24 — `metadata-consistency` declares Platforms: ['sqlserver'] because its `sys.*`
  #     catalog queries have no PostgreSQL equivalent (dialect-impossible).
  #   * IT67 — `content-vectorization` is declared ['sqlserver'] as a TEMPORARY provisioning
  #     exclusion: `MJ: Content Item Chunks` has no migrations-pg counterpart, so the entity does
  #     not exist here and the bundle has no target. Unlike IT24 this bundle IS runnable on PG and
  #     must be re-enabled the moment that migration is ported — see the note at the bottom of
  #     content-vectorization.checks.ts. This is the one declared exception to the rule below.
  #   * The 19 client-transport members of the deterministic suite (every record whose
  #     Configuration sets transport: "client"). CI runs no MJAPI and sets no MJ_API_KEY, so
  #     they cannot execute on EITHER lane; the SQL Server lane reports the same 19. Before
  #     #3257 they reported Error and the suite exit code ignored Error, so they were invisible.
  # Any OTHER skip is a real finding — the platform declaration is for dialect-impossible bundles
  # only, never a quarantine list. Error and Timeout are NOT skips; they fail the build.
  #
  # TRIAGING A FAILURE ON THIS LANE — check this order, because not every red is a parity bug:
  #   1. Is the check's OWN SQL dialect-specific? `ExtraFilter` and any `ExecuteSQL` string is raw
  #      SQL. A bare `IsActive=1` (PG: boolean = integer), `[bracket]` quoting (PG keeps brackets
  #      verbatim), or an unquoted mixed-case view (PG folds to lowercase) fails here for reasons
  #      that have nothing to do with the provider. Fix with `provider.Dialect.BooleanLiteral` /
  #      `QuoteSchema` / `QuoteIdentifier` — NOT with a platform declaration.
  #   2. Is it a provisioning failure? `PostgreSQLDataProvider.Config` returns false rather than
  #      throwing; the bootstrap now converts that into a loud error naming the database.
  #   3. Only once 1 and 2 are excluded is it a genuine SS/PG parity bug — which is what this
  #      lane exists to surface, and it belongs red until fixed.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  integration-postgresql:
    name: Integration (PostgreSQL, deterministic)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # GitHub Actions `env:` is per-job, so none of the SQL Server lane's block carries over.
    # THREE credential families are needed and they are not interchangeable:
    #   * DB_*          — read by MetadataSync's config layer (`mj sync push`) and by the
    #                     testing CLI's provider setup (`mj test`).
    #   * CODEGEN_DB_*  — the ONLY credentials MJCLI reads for `mj migrate`; its config schema
    #                     marks them required, so with DB_* alone it aborts before starting.
    #   * PG*           — libpq's own variables, for the raw `psql` role-bootstrap and
    #                     fixture-verification steps.
    # DB_PORT is explicit because the committed mj.config.cjs resolves the port itself; the
    # platform-aware default there already handles this, and setting it here is belt-and-braces.
    env:
      DB_PLATFORM: postgresql
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_DATABASE: mj_pg_ci
      DB_USERNAME: postgres
      DB_PASSWORD: testpass
      CODEGEN_DB_USERNAME: postgres
      CODEGEN_DB_PASSWORD: testpass
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: testpass
      PGDATABASE: mj_pg_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          # The service container creates the database, so this lane needs no "create database"
          # step (unlike the SQL Server lane, whose image starts with no user database).
          POSTGRES_DB: mj_pg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Same filters as the SQL Server lane PLUS the PostgreSQL provider: the testing CLI
      # dynamic-imports it (an optional dependency), so it must exist as a built artifact or
      # the provider setup fails at runtime with a module-resolution error rather than at build.
      - name: Build integration graph + CLI
        run: npx turbo build --filter=@memberjunction/cli --filter=@memberjunction/testing-integration --filter=@memberjunction/integration-test-suite --filter=@memberjunction/open-app-engine --filter=@memberjunction/postgresql-dataprovider

      # 129 files under migrations-pg/v5 carry GRANT statements against these roles. A blank
      # container has none of them, so the very first GRANT aborts the migrate with
      # `role "cdp_UI" does not exist`. Copied from pg-migrations.yml, which hit exactly this.
      - name: Bootstrap PostgreSQL roles
        run: |
          psql <<'SQL'
          DO $$ BEGIN CREATE ROLE "cdp_UI" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE "cdp_Developer" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE "cdp_Integration" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          GRANT USAGE ON SCHEMA public TO "cdp_UI", "cdp_Developer", "cdp_Integration";
          SQL

      # Invoked through the built entry point rather than `npx mj`: npx silently falls back to
      # the PUBLISHED cli if the workspace symlink is ever missing, which would run a released
      # CLI against this branch's migrations. The explicit path fails loudly instead — and it is
      # what the SQL Server lane already does.
      - name: Migrate — apply committed PG migrations to the fresh DB
        env:
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'   # cold-runner headroom, matching the other lanes
        run: node packages/MJCLI/bin/run.js migrate --dir=migrations-pg/v5 -v

      # ⚠ First time `mj sync push` runs against PostgreSQL in CI. It was fixed for PG in #3253
      # but has never been exercised by a workflow, so this is the most likely first breakage
      # point in this lane. A failure here is a sync-on-PG bug, not a test failure.
      - name: Sync push — reconcile committed metadata (mj sync push --ci)
        env:
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
        run: node packages/MJCLI/bin/run.js sync push --dir=metadata --ci

      - name: Sync push — seed the optional integration metadata + RLS fixtures
        env:
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
        run: node packages/MJCLI/bin/run.js sync push --dir=metadata-optional/integration-test --ci

      # Same fail-loud fixture assertion as the SQL Server lane: without the 3 @integration.test
      # principals the RLS8/9/10 checks skip and the tier's strongest coverage stops running
      # while the gate stays green.
      - name: Verify RLS integration fixtures were seeded
        run: |
          COUNT=$(psql -tA -c "SELECT COUNT(*) FROM __mj.\"User\" WHERE \"Email\" LIKE '%@integration.test';")
          COUNT=$(echo "$COUNT" | tr -d '[:space:]')
          echo "Seeded @integration.test fixture users: ${COUNT}/3"
          if [ "${COUNT:-0}" -lt 3 ]; then
            echo "::error::RLS integration fixtures were not seeded (found ${COUNT}/3 @integration.test users) on PostgreSQL. The fixtures sync push may have exited 0 without seeding — the deterministic RLS8/9/10 checks would silently skip. Re-run: mj sync push --dir=metadata-optional/integration-test" >&2
            exit 1
          fi

      - name: Run integration tier (mj test)
        env:
          RUN_MUTATION_TESTS: '1'   # see the SQL Server lane's note — the lanes must stay symmetric
        run: npm run test:integration 2>&1 | tee integration-postgresql.log; exit "${PIPESTATUS[0]}"

      # Same invariant as the SQL Server lane, one higher: this lane additionally skips IT24
      # (metadata-consistency, dialect-impossible). See that lane's step for why an unasserted
      # skip count is a false-green channel.
      - name: Verify the skip count is exactly the documented expectation
        env:
          EXPECTED_SKIPS: '21'
        run: |
          LINE=$(grep -oE '\[SKIPPED\] [0-9]+ test' integration-postgresql.log | tail -1) || true
          if [ -z "$LINE" ]; then
            if grep -q '\[SUITE_COMPLETE\]' integration-postgresql.log; then
              ACTUAL=0
            else
              echo "::error::Could not read a skip count from the integration output — the suite did not report [SUITE_COMPLETE]. Treating as a failure rather than as zero skips." >&2
              exit 1
            fi
          else
            ACTUAL=$(echo "$LINE" | grep -oE '[0-9]+')
          fi
          if [ "$ACTUAL" != "$EXPECTED_SKIPS" ]; then
            echo "::error::PostgreSQL lane skipped ${ACTUAL} tests; expected exactly ${EXPECTED_SKIPS} (19 client-transport + IT24 metadata-consistency + IT67 content-vectorization). MORE skips mean coverage silently stopped running — most likely a RegisterBundlePlatforms declaration used as a quarantine, which this lane explicitly forbids. FEWER means coverage was restored — update EXPECTED_SKIPS to lock in the gain." >&2
            exit 1
          fi
          echo "Skip count is ${ACTUAL}, matching the documented expectation."
