name: MJ standards

on:
  pull_request:
    branches:
      - next
    # No `paths:` filter, on purpose: a workflow skipped by a paths filter never reports its
    # checks, so making `adopted standards` a required check in next-protect would leave every
    # PR outside these paths waiting forever. The `changes` job applies the same filter; a job
    # skipped by its `if` reports as passing.

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: ci-standards-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  changes:
    name: Detect standards-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check changed paths
        id: filter
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF"
          CHANGED="$(git diff --name-only "origin/$PR_BASE_REF...HEAD")"
          # The old paths filter: packages/**/*.ts, packages/**/package.json, .mj-standards.json,
          # migrations/**/*.sql (the migration standards read migrations), packages/Standards/**,
          # and this workflow.
          if echo "$CHANGED" | grep -qE '^packages/(.*/)?[^/]*\.ts$|^packages/(.*/)?package\.json$|^\.mj-standards\.json$|^migrations/(.*/)?[^/]*\.sql$|^packages/Standards/|^\.github/workflows/ci-standards\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  standards:
    name: adopted standards
    needs: changes
    # Fail closed: a skipped required check counts as passing, so if change detection itself
    # failed, run the real check rather than skip it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Turbo remote cache — opt-in, and inert while TURBO_TOKEN is unset. Fork PRs never
      # receive it, so they degrade to a cold local cache rather than failing. Rationale and
      # setup instructions live once, on the build job in test.yml.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # @memberjunction/standards is a workspace package here, so build it before running it.
      # Consumers outside this repo just `pnpm install --frozen-lockfile` and get it from the registry.
      - name: Build the standards package
        run: npx turbo run build --filter=@memberjunction/standards

      # What runs is decided by .mj-standards.json, not by this file. packages/Angular is listed
      # under requireDeclaredIn, so a NEW Angular package that never declares mjUILayer fails here
      # — that, not the one-time cleanup, is what stops drift returning.
      #
      # `set -o pipefail` so the gate's exit code survives the pipe into tee. Without it the step
      # would report the exit code of `tee`, which is always 0, and the gate would never fail.
      - name: Check adopted standards
        run: |
          set -o pipefail
          node packages/Standards/bin/run.js check --json standards-findings.json 2>&1 | tee /tmp/mj-standards.log

      # The terminal view is capped, so put it in the Checks summary where an author reads it
      # without expanding a log. The per-package table is the part that matters: it says where to
      # start, which a total never does.
      - name: Publish result to job summary
        if: always()
        run: |
          {
            echo '## MJ standards'
            echo ''
            echo '```'
            cat /tmp/mj-standards.log 2>/dev/null || echo 'The gate produced no output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The complete finding list, which the log deliberately truncates. This is the worklist the
      # naming cleanup burns down, so it has to outlive the job.
      - name: Upload the full finding list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-findings
          path: standards-findings.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Test the standards package
        run: npx turbo run test --filter=@memberjunction/standards
