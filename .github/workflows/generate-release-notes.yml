name: Generate Release Notes

on:
  # Two paths live here. Bare dispatch / a release PR into `main` is the EDGE path,
  # unchanged: it writes tmp/release-<version>.md and rewrites the PR body.
  # A dispatch carrying `version` is the LTS LINE path, added because
  # generate-release-notes could never fire for a line release — a line release is a
  # workflow_dispatch against the line branch and never opens a PR into `main`, so
  # 5.51.2 shipped with no releases/v5.51.2.md and nobody noticed until someone looked.
  workflow_dispatch:
    inputs:
      version:
        description: 'LTS line path: the ALREADY-PUBLISHED version to write notes for (e.g. 5.51.2). Leave EMPTY for the Edge behaviour.'
        required: false
        default: ''
      line_branch:
        description: 'LTS line path: the line branch it shipped from (e.g. lts/5). Required when version is set.'
        required: false
        default: ''
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  generate-release-notes:
    # Only run for manual dispatch or genuine release PRs. Any other PR opened to main
    # would otherwise spin up the agent AND destructively overwrite the PR title/description
    # with a version number. github.head_ref is empty on workflow_dispatch, so the first
    # clause keeps manual runs working.
    #
    # `release/*` is included because a release PR does not have to come from `next`: to
    # ship a specific validated commit rather than whatever `next` holds at merge time, you
    # push that commit to a release/* branch and open the PR from there (DEPLOYMENT.md
    # Step 9). Without this clause, pinning silently costs you the generated PR body — which
    # is a strong incentive to just merge the tip and hope. `release/*` is already this
    # repo's release-branch convention (release/v5.51-prep, ...) and no ordinary PR into
    # main uses it, so the destructive-overwrite risk above is unchanged.
    # `version == ''` keeps this job off the LTS line dispatch below, which has its own
    # job. Without it a line dispatch would ALSO start this one, which calls
    # get_pull_request with no PR context and burns an agent run to fail.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version == '')
      || ((github.head_ref == 'next' || startsWith(github.head_ref, 'release/'))
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # READ-ONLY, deliberately (security audit, MJ#6240 item 7). The agent in this job has a
    # shell and reads contributor-influenced text — commit messages, the diff, .changeset/
    # bodies — so a prompt injection there must not be able to reach a write-capable token.
    # This job therefore holds no write permission, keeps no token on disk
    # (persist-credentials: false) and puts none in the agent's environment. Its only
    # product is the notes file, uploaded as an artifact; `apply-release-notes` below is the
    # deterministic job that holds `pull-requests: write` and applies it.
    permissions:
      contents: read
    outputs:
      generated: ${{ steps.stage.outputs.generated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Tags come with fetch-depth: 0. Nothing after this step talks to the remote, so
          # the token is not left in .git/config for the agent's shell to read.
          persist-credentials: false

      # Cheap pre-flight: if there is nothing to release (no pending changesets),
      # skip the paid agent step entirely instead of letting it discover that
      # after loading full context. find (not `ls | grep`) is pipefail-safe.
      - name: Check for pending changesets
        id: cs
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'readme.md' | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # The changeset gate applies only to the automated PR path. A manual
      # workflow_dispatch is an explicit human ask — honor it even at 0 pending
      # changesets (e.g. right after a release, when `changeset version` has
      # consumed the .md files). A dispatch carries no PR context: the apply job
      # looks the release PR up by head branch, and when there is none the notes
      # are left in the `release-notes` artifact.
      - name: Generate Release Notes with Gemini
        id: gemini-release-notes
        if: github.event_name == 'workflow_dispatch' || steps.cs.outputs.count != '0'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22, SHA-pinned
        env:
          # REQUIRED — without it the CLI exits 1 without running anything:
          # "Gemini CLI is not running in a trusted directory." It refuses to start
          # rather than falling back to a safer approval mode. Confirmed empirically
          # on run 31453795512, where its absence killed the sibling gemini-command
          # workflow before a single tool call. The action does not set it itself.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          # NO GITHUB_TOKEN here, on purpose — see the job's `permissions` comment. Do not
          # add one back to "fix" something: the PR is edited by `apply-release-notes`.
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          # Pinned explicitly — the CLI's default alias `auto` currently resolves to
          # the RETIRED gemini-3-pro-preview.
          #
          # 3.8-flash (released 2026-09-02) supersedes 3.6-flash here. Note the date on the
          # price: $0.75/$3.75 per 1M is INTRODUCTORY and runs to 2026-12-31, stepping to
          # $1.50/$7.50 on 2027-01-01 with context caching doubling alongside it. At a few
          # release runs a month that is noise — it is recorded so whoever reads this in
          # January knows the jump was expected and not a billing fault.
          gemini_model: gemini-3.8-flash

          # Pinned so the tool-name strings below stay true; `latest` moves.
          gemini_cli_version: '0.54.4'

          # TOOL SURFACE. Unlike gemini-command.yml this agent has a shell — it runs git
          # and npx and writes a notes file. It has NO GitHub tools and no MCP server: it
          # used to edit the PR itself through the GitHub MCP server with a write token
          # in its environment, which is what the audit flagged. The PR edit is now the
          # `apply-release-notes` job's.
          #
          # `core` is an allowlist and is used in preference to `exclude` because
          # settings tool names are never validated: a typo in `exclude` silently
          # leaves a tool enabled, a typo here silently leaves it disabled.
          settings: |
            {
              "tools": {
                "core": ["run_shell_command", "read_file", "read_many_files", "list_directory", "glob", "grep_search", "write_file"]
              }
            }

          prompt: |
            You are a technical analyst working as a release coordinator for MemberJunction. Your task is to create release notes in markdown. A later, separate CI job publishes the file you write as the PR title and description — you do not touch GitHub yourself.

            ## Format

            **Read `releases/README.md` before writing anything.** It defines the template, the
            required `## TL;DR` section and the house style, and it is the single source of that
            format. This prompt deliberately does not restate it: the format used to be written
            out in four places, and three of them had drifted to describe a shape no release had
            used since v5.51.1. Follow that file — not your memory of what a release note looks
            like, and not the opening structure of an older file in `releases/`.

            The notes you produce become the PR description, which is pasted into Teams verbatim by the build engineer,
            and most readers there stop after the TL;DR. It is the release announcement, not
            just a PR body.

            ## Process

            1. Compare next HEAD to the latest published version tag (using repo tags, `git fetch --tags && git --no-pager tag -l "v*" --sort=-version:refname | head -n1`) to get the changes in this release.
            2. Figure out the next version (whether patch or minor) using `npx changeset status --since main`
            3. Use both the diff contents and git commit messages to build up the context.
            - The .changeset/ dir also has more focused human-entered notes you can use.
            4. Write the release notes to tmp/release-<version>.md following the format in `releases/README.md`.
            - `<version>` is the bare version number with no leading `v` (e.g. tmp/release-2.73.0.md). A later CI job reads the version from this filename and sets the PR title to `v<version>`.
            - Write exactly ONE such file. The whole file becomes the PR description, replacing what is there, so it must contain the release notes and nothing else.
            - You can add/remove bullets as needed and omit sections if there are no bullets.
            - `## TL;DR` is the one section that is never omitted. A later CI step checks the
              file and fails the run if it has no TL;DR.
            5. Stop. Do not commit, push, or try to edit the pull request.

      # The hand-off. Everything the write-capable job will ever see of this job is this one
      # file. Staged out of the workspace so the upload cannot pick up anything else the
      # agent left in tmp/.
      - name: Stage the notes file for the apply job
        id: stage
        if: steps.gemini-release-notes.outcome == 'success'
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find tmp -maxdepth 1 -type f -name 'release-*.md' 2>/dev/null | sort)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::expected the agent to write exactly one tmp/release-<version>.md, found ${#FILES[@]}: ${FILES[*]:-<none>}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-notes"
          cp -- "${FILES[0]}" "$RUNNER_TEMP/release-notes/"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload the notes file
        if: steps.stage.outputs.generated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # The write half of the Edge path. Deterministic: no agent, no repo code other than
  # the shape checker, and the only thing it does with its token is set one PR's title
  # and body. It treats the artifact as UNTRUSTED input — the agent that produced it
  # read contributor-influenced text — and validates it before anything is applied.
  #
  # Nothing from the artifact is ever written into the repository, so it cannot change
  # a workflow file (or any file); the validation below is about the PR title/body.
  # ─────────────────────────────────────────────────────────────────────────────
  apply-release-notes:
    name: Apply generated notes to the release PR
    needs: generate-release-notes
    if: needs.generate-release-notes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Only the shape checker is needed, and it is read from this checkout — never
      # from the artifact.
      - name: Checkout the shape checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the notes file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Validate the notes file
        id: notes
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/release-notes"
          # Exactly one entry, a regular file, with the one name the agent was told to use.
          mapfile -t ENTRIES < <(find "$DIR" -mindepth 1 | sort)
          if [ "${#ENTRIES[@]}" -ne 1 ] || [ ! -f "${ENTRIES[0]}" ] || [ -L "${ENTRIES[0]}" ]; then
            echo "::error::the release-notes artifact must contain exactly one regular file; it contains ${#ENTRIES[@]} entr(y/ies)."
            exit 1
          fi
          F="${ENTRIES[0]}"
          NAME=$(basename -- "$F")
          # The version becomes the PR title, so it is matched in full, not searched for.
          if [[ ! "$NAME" =~ ^release-v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\.md$ ]]; then
            echo "::error::artifact file name is not release-<semver>.md — refusing to derive a PR title from it."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          # GitHub caps a PR body at 65,536 characters; stay under it in bytes. A file this
          # large is not release notes anyway.
          SIZE=$(wc -c < "$F" | tr -d ' ')
          if [ "$SIZE" -lt 1 ] || [ "$SIZE" -gt 60000 ]; then
            echo "::error::notes file is $SIZE bytes; expected 1..60000."
            exit 1
          fi
          # Text only: valid UTF-8, no NUL or other control bytes besides tab/newline/CR.
          iconv -f UTF-8 -t UTF-8 "$F" > /dev/null || { echo "::error::notes file is not valid UTF-8."; exit 1; }
          if LC_ALL=C grep -qP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' "$F"; then
            echo "::error::notes file contains control characters."
            exit 1
          fi
          # The same shape check the line job runs, so the two generators cannot drift into
          # producing differently-shaped notes. Unit tested — including the case a naive
          # "is there a TL;DR heading" grep silently passes:
          # .github/scripts/__tests__/check-release-notes-shape.test.mjs
          node .github/scripts/check-release-notes-shape.mjs "$F"
          echo "file=$F" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Which PR. On the pull_request path it is the PR that triggered the run. A bare
      # workflow_dispatch has no PR context, so it is looked up: the one open PR into `main`
      # from the dispatched branch, and only from a branch the trigger gate above would have
      # accepted. Anything else leaves the artifact as the run's output and edits nothing.
      - name: Resolve the release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR" ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD" != "next" ] && [[ "$HEAD" != release/* ]]; then
            echo "::notice::dispatched from '$HEAD', which is not a release branch — the notes are in the 'release-notes' artifact and no PR was edited."
            exit 0
          fi
          NUMS=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$HEAD" --state open --json number --jq '.[].number')
          COUNT=$(printf '%s' "$NUMS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::notice::found $COUNT open PR(s) from '$HEAD' into main — the notes are in the 'release-notes' artifact and no PR was edited."
            exit 0
          fi
          echo "number=$NUMS" >> "$GITHUB_OUTPUT"

      # Title is `v<version>` from the validated file name; body is the validated file,
      # byte for byte, so the shape check above is a check of what ships.
      - name: Set the PR title and description
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --body-file "$NOTES_FILE"

      # The agent's own report is not evidence — the sibling job below says exactly that and
      # then checks its artifact. This step does the same for the body that actually shipped,
      # NOT just the file: the body is the release announcement (the build engineer pastes it
      # into Teams verbatim), so a TL;DR that did not survive publication must fail the run.
      - name: Verify the PR body carries a TL;DR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > "$RUNNER_TEMP/pr-body.md"
          node .github/scripts/check-release-notes-shape.mjs "$RUNNER_TEMP/pr-body.md"


  # ─────────────────────────────────────────────────────────────────────────────
  # LTS LINE PATH. Dispatched by publish.yml's LTS job once the release is live.
  #
  # It differs from the Edge job above in three ways that matter:
  #   * The version is GIVEN, not derived. `npx changeset status` cannot work here —
  #     `changeset version` already consumed the .md files into the release commit.
  #   * The changesets are recovered from the RELEASING commit's PARENT, because that
  #     commit is the one that deleted them. This is prepared in shell, not left to
  #     the model: git archaeology is exactly where an agent invents things.
  #   * It writes releases/v<version>.md — the CANONICAL notes, which is a file the
  #     Edge job has never produced — and opens the PR itself, then labels it as a
  #     SEPARATE step immediately afterwards. The label matters because notes that stop
  #     at `next` publish nothing (the docs site builds the line); it is applied after
  #     rather than at creation because a label that cannot be applied must never cost
  #     us the PR. See the "Open the notes PR against next" step for the incident that
  #     settled that order.
  # ─────────────────────────────────────────────────────────────────────────────
  line-release-notes:
    name: Write canonical notes for a line release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
    runs-on: ubuntu-latest
    # READ-ONLY, for the same reason as the Edge job (security audit, MJ#6240 item 7): the
    # agent below has a shell and reads commit subjects and changeset bodies. It used to run
    # in a job holding `contents: write` with the checkout's token persisted in .git/config,
    # one `git push` away from the repository. This job now writes nothing but an artifact;
    # `line-release-notes-apply` below commits it and opens the PR.
    permissions:
      contents: read
    outputs:
      generated: ${{ steps.done.outputs.generated }}

    env:
      VERSION: ${{ github.event.inputs.version }}
      LINE: ${{ github.event.inputs.line_branch }}

    steps:
      # `next` is the base: notes land there and reach the line by backport label.
      - name: Checkout next
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: next
          fetch-depth: 0
          # The repository is public, so the fetch below needs no token — and the agent's
          # shell must not find one in .git/config.
          persist-credentials: false

      - name: Fetch tags and the line branch
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          git fetch origin "$LINE:refs/remotes/origin/$LINE" --quiet

      # Every failure below is cheaper than an agent run, so they all happen first.
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version '$VERSION' must be plain X.Y.Z — a line release is never a prerelease."; exit 1; }
          [[ "$LINE" =~ ^lts/[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::line_branch '$LINE' must look like lts/5 or lts/6.1."; exit 1; }
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || {
            echo "::error::tag v$VERSION does not exist. Write notes AFTER the release, not before."; exit 1; }

      # Idempotent: re-dispatching a release that already has notes is a no-op, not a
      # duplicate PR. Cheap enough to check before spending the agent.
      - name: Skip if the notes already exist
        id: pre
        run: |
          set -euo pipefail
          if [ -f "releases/v$VERSION.md" ]; then
            echo "::notice::releases/v$VERSION.md already exists on next — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Asked as an assignment, NOT as a pipeline in an `elif`. A failed READ is not a
          # negative answer: `gh ... --jq length | grep -qv '^0$'` puts "GitHub said zero" and
          # "GitHub could not be asked" on the same false branch — a dead or rotated PAT, a 502
          # or a secondary rate limit all emit nothing, the pipeline exits non-zero, and the
          # step writes skip=false while exiting 0, so nothing downstream learns the question
          # went unanswered. That matters far more than a wasted agent run: the push below
          # force-updates this branch, and its only safety argument is that no PR is open on it.
          OPEN_PRS=$(gh pr list --head "docs/release-notes-$VERSION" --state open --json number --jq 'length') || {
            echo "::error::could not ask GitHub whether a notes PR for $VERSION is already open. Refusing to continue, because the steps below rewrite that branch and are only safe while the answer is known to be none. Re-run once GitHub is reachable and MJ_GH_BOT_GITHUB_TOKEN is valid."
            exit 1; }
          case "$OPEN_PRS" in
            ''|*[!0-9]*)
              echo "::error::gh pr list returned '$OPEN_PRS' rather than a count, so the same question is still unanswered. Refusing to continue."
              exit 1 ;;
          esac

          if [ "$OPEN_PRS" -ne 0 ]; then
            echo "::notice::a notes PR for $VERSION is already open — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}

      # Deterministic context. The agent gets facts, not a research assignment: the
      # commit range, and the human-written changeset bodies recovered from before the
      # release commit deleted them. Those changesets are the best material in the repo
      # for notes — they are what a person wrote about their own change.
      - name: Assemble release context
        if: steps.pre.outputs.skip == 'false'
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PREV=$(git describe --tags --abbrev=0 "$TAG^")
          echo "::notice::range $PREV..$TAG on $LINE"

          {
            echo "# Release context for $VERSION (line $LINE)"
            echo
            echo "Previous release tag: $PREV"
            echo
            echo "## Commits in $PREV..$TAG (non-merge, release bookkeeping removed)"
            git log --no-merges --format='- %s' "$PREV..$TAG" \
              | grep -vE '^- (RELEASING:|chore: lockfile)' || true
            echo
            echo "## Changesets consumed by this release"
          } > /tmp/release-context.md

          # Filter in git, not in a consumer that exits early. `git log | awk '{...; exit}'`
          # closes the pipe after the first match while git is still writing the rest of the
          # range; git takes SIGPIPE and, under `pipefail`, the step fails with exit 141. The
          # race fires only when the range outruns the pipe buffer, so it passed for months
          # and then killed the 5.51.3 and 6.1.2 runs on 2026-09-16.
          REL=$(git log --format='%H' --grep='^RELEASING:' -n 1 "$PREV..$TAG")
          if [ -z "$REL" ]; then
            echo "::warning::no RELEASING commit found in $PREV..$TAG; notes will rest on commit messages alone."
            echo "_(none recovered — the release commit could not be located)_" >> /tmp/release-context.md
          else
            # head -50 bounds this against a pathological range; a real release has <20.
            git ls-tree --name-only "$REL^" .changeset/ \
              | grep -vE '(README|config)' | head -50 > /tmp/cs.txt || true
            if [ ! -s /tmp/cs.txt ]; then
              echo "_(none — the release commit's parent carried no changesets)_" >> /tmp/release-context.md
            fi
            while read -r f; do
              [ -n "$f" ] || continue
              { echo; echo "### $f"; echo '```markdown'; git show "$REL^:$f"; echo '```'; } >> /tmp/release-context.md
            done < /tmp/cs.txt
          fi
          echo "assembled $(wc -l < /tmp/release-context.md) lines of context"

      - name: Write the notes with Gemini
        if: steps.pre.outputs.skip == 'false'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22, SHA-pinned
        env:
          # See the Edge job above — the CLI refuses to start without this.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # See the Edge job above for why this model and what happens to its price in 2027.
          gemini_model: gemini-3.8-flash
          gemini_cli_version: '0.54.4'

          # Narrower than the Edge job on purpose: this agent writes ONE file. It needs
          # no GitHub MCP server, because the branch, commit, PR and label are all shell
          # below, where they are deterministic and reviewable.
          settings: |
            {
              "tools": {
                "core": ["run_shell_command", "read_file", "read_many_files", "list_directory", "glob", "grep_search", "write_file"]
              }
            }

          prompt: |
            You are a technical analyst acting as release coordinator for MemberJunction.

            Write the canonical release notes for version ${{ github.event.inputs.version }},
            a patch on the certified LTS line ${{ github.event.inputs.line_branch }}. It is
            ALREADY PUBLISHED — you are recording what shipped, not proposing it.

            ## Your material

            Read `/tmp/release-context.md` first. It contains the commit range and the
            changeset bodies recovered from before the release commit consumed them. The
            changesets are the highest-quality source: they are what the engineer wrote
            about their own change. Prefer them over commit subjects.

            Read `releases/README.md` for the house format — it is authoritative. Use
            `releases/v5.51.1.md` for the expected depth and tone of the section BULLETS
            only: it was written before `## TL;DR` was required, so its opening is not a
            model to copy.

            You may run read-only git commands for more detail (`git log`, `git show`,
            `git diff --stat`). Do not modify the repository except for the one file below.

            ## Write exactly one file: `releases/v${{ github.event.inputs.version }}.md`

            Follow the template and house style in `releases/README.md` exactly. It is the
            single definition of both, shared with the two other generators, so there is
            nothing to reconcile against your own recollection of the format.

            The two things this format most often gets wrong:
            - `## TL;DR` is required and comes FIRST: one to three sentences of PROSE, not
              bullets. Headline features first, then fixes and improvements as one short
              clause. NAME things there and let the sections explain them — "lead with the
              consequence" is a rule for section bullets, not for the TL;DR. Do not ALSO
              write an unlabelled intro paragraph above the sections; the TL;DR replaces it.
            - OMIT any section with no content. A patch release usually has only `## TL;DR`
              and `## Bug Fixes`; an `## Upgrade Notes` section belongs there only if a
              deployment could have depended on the old behaviour. Do not invent one.

            ## Rules

            - Every claim must trace to the context file or the repo. Invent nothing — if
              the material does not tell you why something changed, describe what changed
              and stop.
            - No marketing language, no "we are excited to". This is a technical record.
            - Do not mention npm dist-tags, CI, or the release process itself. Readers are
              users of the packages.
            - Write the file and stop. Do not commit, push, or open a pull request.

      # The agent's own report is not evidence. Check the artifact.
      - name: Verify the agent produced a usable file
        if: steps.pre.outputs.skip == 'false'
        run: |
          set -euo pipefail
          F="releases/v$VERSION.md"
          [ -f "$F" ] || { echo "::error::$F was not written."; exit 1; }
          # Shape is checked by the script shared with the Edge job above; see its header
          # for why "the first ## is TL;DR" is not a sufficient check on its own.
          node .github/scripts/check-release-notes-shape.mjs "$F"
          # Scope, which is this job's own concern rather than the format's: the agent was
          # told to write exactly one file.
          git diff --name-only --exit-code -- . ":(exclude)$F" || {
            echo "::error::the agent modified files other than $F (listed above)."; exit 1; }
          # The hand-off: this one file is all the write-capable job receives.
          mkdir -p "$RUNNER_TEMP/line-release-notes"
          cp -- "$F" "$RUNNER_TEMP/line-release-notes/v$VERSION.md"

      - name: Upload the notes file
        if: steps.pre.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: line-release-notes
          path: ${{ runner.temp }}/line-release-notes/
          if-no-files-found: error
          retention-days: 14

      - name: Mark the notes as generated
        id: done
        if: steps.pre.outputs.skip == 'false'
        run: echo "generated=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # The write half of the line path. Deterministic — no agent runs here. It takes
  # exactly one file from the artifact, validates it as untrusted input, places it at
  # the one path it is allowed to occupy, and opens the PR.
  # ─────────────────────────────────────────────────────────────────────────────
  line-release-notes-apply:
    name: Open the notes PR for a line release
    needs: line-release-notes
    if: needs.line-release-notes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      VERSION: ${{ github.event.inputs.version }}
      LINE: ${{ github.event.inputs.line_branch }}

    steps:
      - name: Checkout next
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: next

      - name: Download the notes file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: line-release-notes
          path: ${{ runner.temp }}/line-release-notes

      # The artifact is untrusted. Only its bytes are used, and only at a path this job
      # computes from the (already validated) VERSION input — never a path the artifact
      # names — so it cannot land on a workflow file or anywhere outside releases/.
      - name: Validate and place the notes file
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$VERSION' must be plain X.Y.Z."; exit 1; }
          [[ "$LINE" =~ ^lts/[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::line_branch '$LINE' must look like lts/5 or lts/6.1."; exit 1; }
          DIR="$RUNNER_TEMP/line-release-notes"
          SRC="$DIR/v$VERSION.md"
          mapfile -t ENTRIES < <(find "$DIR" -mindepth 1 | sort)
          if [ "${#ENTRIES[@]}" -ne 1 ] || [ "${ENTRIES[0]}" != "$SRC" ] || [ ! -f "$SRC" ] || [ -L "$SRC" ]; then
            echo "::error::the line-release-notes artifact must contain exactly one regular file, v$VERSION.md."
            exit 1
          fi
          SIZE=$(wc -c < "$SRC" | tr -d ' ')
          if [ "$SIZE" -lt 1 ] || [ "$SIZE" -gt 200000 ]; then
            echo "::error::notes file is $SIZE bytes; expected 1..200000."
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$SRC" > /dev/null || { echo "::error::notes file is not valid UTF-8."; exit 1; }
          if LC_ALL=C grep -qP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' "$SRC"; then
            echo "::error::notes file contains control characters."
            exit 1
          fi
          F="releases/v$VERSION.md"
          [ ! -e "$F" ] || { echo "::error::$F appeared on next since the notes were generated — nothing to do; re-dispatch if that is wrong."; exit 1; }
          cp -- "$SRC" "$F"
          node .github/scripts/check-release-notes-shape.mjs "$F"
          # Exactly one change in the tree, and it is the notes file.
          CHANGED=$(git status --porcelain --untracked-files=all)
          [ "$CHANGED" = "?? $F" ] || { echo "::error::expected the working tree to differ from next by $F only; got:"; echo "$CHANGED"; exit 1; }

      # The label is the entire point: the docs site builds the line branch, so notes that
      # stop at `next` are published nowhere. It used to be passed to `gh pr create`, which
      # welded the two together — and on v6.1.0 (run 34805937932) that cost us the PR. Each
      # line's `backport lts/<x>` label is created BY HAND when the line is cut, so on 6.1 it
      # did not exist yet: the agent wrote the file, the branch was committed and PUSHED, and
      # then `gh pr create --label` failed with `could not add label: 'backport lts/6.1' not
      # found` and exited 1. What survived was a dangling branch and no PR — a run that looks
      # half-successful, nine minutes of a human noticing, and the PR opened by hand. The
      # FIRST release on every new LTS line hits this, which is precisely when nobody is
      # watching for it.
      #
      # Hence the order below: create-label → create-PR → label-PR. A lost PR is worse than
      # an unlabelled one. The PR is the irreplaceable artifact — it carries the generated
      # notes and the branch they live on — while the label is one command for a human. So a
      # label failure never aborts before the PR exists, and a labelling failure after it
      # still fails the RUN, naming the exact remedy, so a green check never means "shipped"
      # when the notes would publish nowhere.
      - name: Open the notes PR against next
        env:
          GH_TOKEN: ${{ secrets.MJ_GH_BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="docs/release-notes-$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "releases/v$VERSION.md"
          git commit -m "docs(releases): add v$VERSION release notes" \
                     -m "Generated for the $LINE line release. Needs the backport label to reach the line branch."
          # --force-with-lease, deliberately. The branch is pushed BEFORE the PR exists, so a run
          # that dies in between leaves a branch with no PR — and the only way to finish that
          # release is for a human to open the PR, which makes that human its AUTHOR. GitHub
          # will not let an author approve their own PR, so the release then needs a second
          # reviewer: the exact deadlock this job exists to remove. A re-dispatch has to be able
          # to recover, and a plain push cannot — the agent is non-deterministic, so the new
          # commit differs from the abandoned one and the push is rejected as non-fast-forward.
          #
          # Safe here and nowhere else: the "Skip if the notes already exist" step in the generating job has
          # already established that NO PR is open for this branch, so anything sitting on it is
          # debris from a run that died before opening one. The lease still refuses to overwrite
          # anything that arrived after this job's checkout.
          # Asked again HERE, immediately before the destructive step, rather than inherited
          # from the skip check — the agent runs between the two, so that answer is minutes
          # old. `--force-with-lease` does not close the gap: its expected value comes from
          # this job's own checkout, so a commit pushed to the branch BEFORE the job started
          # is already inside the lease and would be overwritten with no trace. The push also
          # authenticates with the checkout's GITHUB_TOKEN while this query uses the PAT, so
          # the read can fail while the write still succeeds — which is exactly the pairing
          # that turns a wrong answer here into silent data loss.
          if ! OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length'); then
            echo "::error::could not confirm that no PR is open for $BRANCH, so the branch cannot be shown to be safe to overwrite. Refusing to force-update it: if a reviewer has pushed a correction there, forcing would destroy it silently. Re-run once GitHub is reachable."
            exit 1
          fi
          if [ "$OPEN_PRS" != "0" ]; then
            echo "::error::$BRANCH already has an open PR ($OPEN_PRS), so this job should have skipped and must not rewrite that branch. Nothing has been pushed. If the notes there are wrong, push a correction to the PR instead."
            exit 1
          fi
          # Debris from a run that died between this push and `gh pr create`: no PR is open on
          # it, so forcing is what lets a re-dispatch recover rather than die non-fast-forward.
          git push --force-with-lease -u origin "$BRANCH"

          # --body-file, not --body: a multi-line --body argument has to be indented to stay
          # inside this block scalar, and an un-indented continuation line silently ends the
          # scalar — YAML then reads the next line as a node and the workflow fails to parse.
          cat > /tmp/pr-body.md <<BODY
          Canonical release notes for \`$VERSION\` on \`$LINE\`, generated after publish and following \`releases/README.md\`.

          **Agent-written — review the content before merging.** Every claim should trace to the changesets in the release range. The workflow verifies the file's shape, not its accuracy.

          The \`backport $LINE\` label is added by the workflow immediately after this PR is opened, and is load-bearing: the docs site builds \`$LINE\`, so notes that stop at \`next\` publish nothing. Do not remove it.
          BODY

          # Idempotent by design: --force creates the label on a line that has never had one,
          # and refreshes the colour/description on a line that has. Colour and wording match
          # the hand-made `backport lts/5` / `backport lts/6.1` labels so the set stays uniform.
          # NON-FATAL on purpose — see the note above this step. If the label cannot be made,
          # the PR is still worth far more than the failure, and the labelling step below is
          # where a human gets told what to do about it.
          if ! gh label create "backport $LINE" --force \
                 --color 0e8a16 \
                 --description "Backport this merged PR to the $LINE line (opens a cherry-pick PR automatically)"; then
            # A WARNING, not an error: this branch exists in order to CONTINUE. A GitHub
            # `::error::` annotation does not itself fail a job, so when the labelling below
            # then succeeds — the label already existed and only the --force refresh failed —
            # the run ends green carrying a red annotation, and its conclusion and its
            # annotations contradict each other. On a step whose whole purpose is that a green
            # check means "shipped", that is the same noise pointed the other way. The verdict
            # is decided below; this line only reports what was tried. Same convention as
            # publish.yml's back-merge fallback.
            echo "::warning::could not create or update the 'backport $LINE' label. Continuing anyway so the PR still gets opened; if the label is genuinely missing, the labelling step below fails the run with the remedy."
          fi

          # The postcondition of this step is "a PR is open for $BRANCH" — NOT "our create call
          # returned 0". Those differ every time the branch is already pushed, which it always
          # is by now, and treating the call's success as the goal is what turns any transient
          # gh failure into a release that only a human can finish.
          PR_URL=$(gh pr create --base next --head "$BRANCH" \
            --title "docs(releases): add v$VERSION release notes" \
            --body-file /tmp/pr-body.md) || PR_URL=""

          # An empty capture means gh either failed or succeeded without saying which PR it
          # made. Either way, ask the question that actually matters. A create that raced with
          # itself, hit a 502 after the PR was already made, or refused because one exists
          # ("a pull request for branch ... already exists") all land here with a perfectly good
          # PR on the other end; adopting it is what keeps a human out of the author slot.
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty') || PR_URL=""
            [ -z "$PR_URL" ] || echo "::notice::gh pr create did not report a PR, but $PR_URL is already open for $BRANCH — adopting it."
          fi

          [ -n "$PR_URL" ] || {
            echo "::error::$BRANCH is pushed but no PR is open for it, so the notes exist only on a branch and publish nowhere. RE-RUN THIS WORKFLOW — it is idempotent: it force-updates the branch and opens the PR. Do NOT open the PR by hand unless the re-run also fails: a human author cannot approve their own PR, which is what leaves the release waiting on a second reviewer. If you must, open it and add the 'backport $LINE' label."
            exit 1; }
          echo "::notice::opened $PR_URL for v$VERSION ($LINE)"

          if ! gh pr edit "$PR_URL" --add-label "backport $LINE"; then
            echo "::error::$PR_URL is open but UNLABELLED. Without 'backport $LINE' these notes merge into next and publish nowhere, because the docs site builds $LINE. Fix by hand: gh label create \"backport $LINE\" --color 0e8a16 --description \"Backport this merged PR to the $LINE line (opens a cherry-pick PR automatically)\" && gh pr edit $PR_URL --add-label \"backport $LINE\". Failing the run so this is not read as a finished release."
            exit 1
          fi
