name: Generate Release Notes

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  generate-release-notes:
    # Only run for manual dispatch or genuine release PRs. Any other PR opened to main
    # would otherwise spin up the agent AND destructively overwrite the PR title/description
    # with a version number. github.head_ref is empty on workflow_dispatch, so the first
    # clause keeps manual runs working.
    #
    # `release/*` is included because a release PR does not have to come from `next`: to
    # ship a specific validated commit rather than whatever `next` holds at merge time, you
    # push that commit to a release/* branch and open the PR from there (DEPLOYMENT.md
    # Step 9). Without this clause, pinning silently costs you the generated PR body — which
    # is a strong incentive to just merge the tip and hope. `release/*` is already this
    # repo's release-branch convention (release/v5.51-prep, ...) and no ordinary PR into
    # main uses it, so the destructive-overwrite risk above is unchanged.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.head_ref == 'next'
      || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      # Cheap pre-flight: if there is nothing to release (no pending changesets),
      # skip the paid agent step entirely instead of letting it discover that
      # after loading full context. find (not `ls | grep`) is pipefail-safe.
      - name: Check for pending changesets
        id: cs
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'readme.md' | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # The changeset gate applies only to the automated PR path. A manual
      # workflow_dispatch is an explicit human ask — honor it even at 0 pending
      # changesets (e.g. right after a release, when `changeset version` has
      # consumed the .md files). Note the dispatch path has a pre-existing
      # caveat regardless of this gate: the prompt calls get_pull_request with
      # no PR context, so dispatch runs are only useful alongside an open PR.
      - name: Generate Release Notes with Gemini
        id: gemini-release-notes
        if: github.event_name == 'workflow_dispatch' || steps.cs.outputs.count != '0'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          # Consumed by the github MCP server declared in `settings` below, via the
          # ${GITHUB_TOKEN} expansion in its `env` block. Settings values expand $VAR
          # from the process environment — but an UNSET variable is left as the
          # literal string "${GITHUB_TOKEN}" rather than erroring, so if the MCP
          # server starts unauthenticated, suspect this line first.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          # Pinned explicitly — the CLI's default alias `auto` currently resolves to
          # the RETIRED gemini-3-pro-preview.
          gemini_model: gemini-3.6-flash

          # Pinned so the tool-name strings below stay true; `latest` moves.
          gemini_cli_version: '0.54.4'

          # TOOL SURFACE. Unlike gemini-command.yml this agent is deliberately
          # powerful — it shells out to git and npx, writes a notes file, and edits
          # the PR through MCP. That matches what the claude-code-action version was
          # granted (Bash,Read,Write,Glob,Grep + two GitHub MCP tools).
          #
          # `core` is an allowlist and is used in preference to `exclude` because
          # settings tool names are never validated: a typo in `exclude` silently
          # leaves a tool enabled, a typo here silently leaves it disabled.
          #
          # WHY `allowed` ALSO LISTS THE MCP TOOLS: setting `tools.core` at all emits
          # a blanket `{toolName: "*", decision: DENY}` policy rule at priority 4.24,
          # which outranks both MCP grant priorities (trusted 4.2 / allowed 4.1) and
          # would otherwise swallow the GitHub tools. `tools.allowed` sits at 4.3 and
          # re-permits them above that deny. `allowed` is an auto-approve list, NOT a
          # restriction — the actual narrowing is `includeTools` on the server, which
          # filters at discovery so the model never sees anything else.
          #
          # MCP tools are addressed by their fully-qualified `mcp_<server>_<tool>`
          # name in `allowed`, but by their BARE name in `includeTools` — the include
          # filter runs before the name is qualified. Both spellings below are load
          # bearing and are not interchangeable.
          settings: |
            {
              "tools": {
                "core": ["run_shell_command", "read_file", "read_many_files", "list_directory", "glob", "grep_search", "write_file"],
                "allowed": ["mcp_github_pull_request_read", "mcp_github_update_pull_request"]
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" },
                  "includeTools": ["pull_request_read", "update_pull_request"]
                }
              }
            }

          prompt: |
            You are a technical analyst working as a release coordinator for MemberJunction. Your task is to create release notes in markdown and update the PR description.

            ## Process

            1. Compare next HEAD to the latest published version tag (using repo tags, `git fetch --tags && git --no-pager tag -l "v*" --sort=-version:refname | head -n1`) to get the changes in this release.
            2. Figure out the next version (whether patch or minor) using `npx changeset status --since main`
            3. Use both the diff contents and git commit messages to build up the context.
            - The .changeset/ dir also has more focused human-entered notes you can use.
            4. Write the release notes to tmp/release-<version>.md following the template given below.
            - You can add/remove bullets as needed and omit sections if there are no bullets.
            5. Use the GitHub MCP server to update the PR description with the release notes.

            ## Steps to complete:
            1. **Get current PR details**: Use `mcp_github_pull_request_read` with method `get` to get the current PR description
            2. **Generate release notes**: Follow the process above to create release notes
            3. **Update PR title and description**: Use `mcp_github_update_pull_request` to:
               - Set the PR title to the version number (e.g., "v2.73.0")
               - Set the PR description to the generated release notes (replace entire description)

            <template>
            # <6-10 word summary of the entire release>

            ## New Features
            - <Detail>
            - <Detail>
            - <Detail>

            ## Improvements
            - <Detail>
            - <Detail>
            - <Detail>

            ## Bug Fixes
            - <Detail>
            - <Detail>
            - <Detail>
            </template>

            The generated release notes following the template above should become the entire PR description, not appended to existing content.

