name: PostgreSQL migration validation

# Validates that COMMITTED PostgreSQL migrations apply to a fresh PG database
# without errors, and that no counterpart is an empty stub.
#
# ─── THIS IS A RELEASE-TIME GATE, NOT A PER-PR GATE ────────────────────────────
# Authoring `.pg.sql` counterparts is deterministic toolchain work the BUILD
# ENGINEER performs when cutting a release (`mj migrate convert`, `/pg-migrate-v2`);
# it is explicitly NOT feature-PR work. See migrations/CLAUDE.md
# ("PostgreSQL counterparts are BUILD-ENGINEER work").
#
# So this workflow deliberately does NOT trigger on `migrations/**`. A feature PR
# that adds a T-SQL migration must not be gated on PG work nobody expected it to
# do — that only pressured engineers into converting against a moving schema.
# It triggers on `migrations-pg/**` (which is exactly what a release/build PR
# touches) and on changes to the conversion toolchain itself, plus manual
# dispatch for the build engineer.
on:
  workflow_dispatch: # Manual trigger — the build engineer's on-demand entry point
  pull_request:
    branches: [next]
    paths:
      # NOTE: 'migrations/**' is intentionally absent — see the header above.
      - 'migrations-pg/**'
      - 'packages/SQLConverter/**'
      - 'packages/CodeGenLib/src/Database/providers/postgresql/**'
      - '.github/workflows/pg-migrations.yml'
      # The content detector runs in this workflow (self-test + verify steps), so a
      # PR that changes only the detector must still exercise it here.
      - 'scripts/check-pg-migration-content.mjs'
  push:
    branches: [next]
    paths:
      - 'migrations-pg/**'
      - 'packages/SQLConverter/**'
      - 'scripts/check-pg-migration-content.mjs'
  # Nightly: beyond migration parity, run the FUNCTIONAL PG lane (metadata seed + a curated
  # server-transport subset of the deterministic integration tier against the migrated PG DB).
  # PostgreSQL previously shipped on migration-apply + object-count evidence alone — and this
  # seam has real escape history (the empty v5.45 PG metadata migration, #3471's missing
  # counterparts, asymmetric ms→s fixes across engines).
  schedule:
    - cron: '15 6 * * *'

jobs:
  pg-parity:
    name: PG migration validation (release-time)
    runs-on: ubuntu-latest

    env:
      # Turbo remote cache — opt-in, and inert while TURBO_TOKEN is unset. Fork PRs never
      # receive it, so they degrade to a cold local cache rather than failing. Rationale and
      # setup instructions live once, on the build job in test.yml.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mj_pg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ─── Step 1: Validate PG migration filenames ─────────────────────
      - name: Validate PG migration filenames
        run: |
          for d in migrations-pg/v*/; do
            ./.github/scripts/validate-migration-filenames.sh "${d%/}"
          done

      # ─── Step 2: Build MJCLI + SQLConverter ─────────────────────────
      # MJCLI (`@memberjunction/cli`) is the production migration entry point —
      # applying via `mj migrate` is what real users run, so CI runs the same
      # code path via the workspace entry point (`node packages/MJCLI/bin/run.js`).
      # NOT `npx mj`: nothing in this repo creates a workspace-root
      # node_modules/.bin/mj, so `npx` would fall through to the npm registry —
      # where `mj` is an UNRELATED package — inside a job holding DB credentials.
      # Turbo builds MJCLI's full transitive dep graph, which also covers
      # SQLConverter (so we don't need a second build step).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build MJ CLI + SQLConverter
        run: npx turbo build --filter=@memberjunction/cli --filter=@memberjunction/sql-converter

      # ─── Step 3: Verify committed PG migration files exist ──────────
      # Previously this step regenerated all V*.pg.sql from T-SQL via the
      # converter. We've moved away from regenerate-on-CI for two reasons:
      #
      #   1. Real `mj migrate` (the install path) applies the COMMITTED
      #      .pg.sql files as-is. Regenerating during CI tested something
      #      different from what users actually run.
      #   2. Some PG migrations have hand-fixes that the converter doesn't
      #      produce natively (managed-PG boolean rewrites, the
      #      vwEntityPermissions RoleName alias fix, the Scoped_EntityField_SPs
      #      hand-port). Regenerating overwrites those fixes.
      #
      # Coverage of the converter is preserved by:
      #   - packages/SQLConverter/src/__tests__/pg-migration-regression.test.ts
      #     (107 conversion tests + sequence-dedup + TODO-marker check)
      #   - The CONTENT check in Step 3b below, for the counterparts that exist.
      #
      # Counterpart EXISTENCE is deliberately NOT gated here — see Step 3b's note.
      #
      # If the migrations-pg version folders are empty (e.g. on a tooling-only PR before the
      # migrations PR has merged), this step skips the apply gracefully so the
      # workflow doesn't block.
      - name: Verify committed PG migration files
        id: verify_committed
        run: |
          PG_FILES=$(ls migrations-pg/v*/*.pg.sql migrations-pg/v*/*.pg-only.sql 2>/dev/null | wc -l)
          BASELINE=$(ls migrations-pg/v*/B*.pg.sql 2>/dev/null | head -1)
          echo "Committed PG migration files: $PG_FILES"
          echo "Baseline file: ${BASELINE:-(none)}"
          if [ "$PG_FILES" -eq 0 ]; then
            echo "::notice::No committed PG migration files — skipping apply step. Migration content lives in the companion PR."
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      # ─── Step 3b: Verify PG counterparts have CONTENT, not just existence ──
      # NOTE ON COUNTERPART EXISTENCE: there is deliberately no gate for it.
      # Authoring the `.pg.sql` counterpart is BUILD-ENGINEER work performed at
      # release time, not something a feature PR does — see migrations/CLAUDE.md
      # ("PostgreSQL counterparts are BUILD-ENGINEER work"). An unconverted
      # migration between releases is therefore the EXPECTED state, and failing
      # feature PRs for it only taught engineers to convert against a moving
      # schema. The former check-pg-migration-parity.mjs gate was removed for
      # this reason. This step still runs, because a counterpart that DOES exist
      # and is empty is a real defect at any time.
      #
      # Step 3 asserts a .pg.sql counterpart EXISTS. Nothing
      # asserted it contains anything, and that gap shipped a broken release:
      # v5.45's Metadata_Sync.pg.sql is 126 bytes against 12,041 lines of T-SQL,
      # so PG deployments migrating through v5.45 silently received none of that
      # release's metadata.
      #
      # Critically, the apply step below CANNOT catch this. An empty migration
      # applies perfectly cleanly — there is nothing in it to fail. So this must
      # be its own gate, and it must run BEFORE the apply, where the failure is
      # still attributable to conversion rather than to SQL.
      #
      # The detector self-tests first (same convention as changes.yml running
      # check-migration-id-determinism.sh --self-test), so a broken detector
      # fails loudly instead of silently passing everything.
      - name: Self-test the PG content detector
        run: node scripts/check-pg-migration-content.mjs --self-test

      - name: Verify PG migration content
        run: node scripts/check-pg-migration-content.mjs

      # ─── Step 4: Bootstrap PG roles ─────────────────────────────────
      # Skyway creates `__mj.flyway_schema_history` itself at startup, so the
      # only thing CI has to seed is the cdp_* roles that migration GRANT
      # statements reference. Skipping this would surface as
      # `role "cdp_UI" does not exist` on the first GRANT.
      - name: Bootstrap PostgreSQL roles
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: mj_pg_ci
        run: |
          psql <<'SQL'
          DO $$ BEGIN CREATE ROLE "cdp_UI" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE "cdp_Developer" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE "cdp_Integration" NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          GRANT USAGE ON SCHEMA public TO "cdp_UI", "cdp_Developer", "cdp_Integration";
          SQL

      # ─── Step 5: Apply PG migrations via mj migrate ─────────────────
      # Real production installs invoke `mj migrate` which delegates to
      # @memberjunction/skyway-postgres. CI now runs the same code path,
      # so any regression in the production migrate flow (placeholder
      # resolution, baseline auto-select, transaction semantics, schema-
      # history checksum tracking) fails CI here. This replaced an
      # earlier psql-based loop that hand-rolled Skyway's behavior and
      # drifted from production over time.
      - name: Apply PG migrations via mj migrate
        id: apply
        if: steps.verify_committed.outputs.skip_apply != 'true'
        env:
          DB_PLATFORM: postgresql
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_DATABASE: mj_pg_ci
          # MJCLI reads credentials from CODEGEN_DB_USERNAME / CODEGEN_DB_PASSWORD
          # (see packages/MJCLI/src/config.ts:27-28) — NOT the generic
          # DB_USERNAME / DB_PASSWORD other parts of the stack use. Setting only
          # DB_USERNAME / DB_PASSWORD would leave MJCLI seeing empty creds and
          # failing with "Database credentials are missing or empty" before the
          # migrate even starts.
          CODEGEN_DB_USERNAME: postgres
          CODEGEN_DB_PASSWORD: testpass
          # PG* equivalents kept so the verification + report steps below
          # can still use raw psql for read-only schema introspection.
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: mj_pg_ci
        run: |
          node packages/MJCLI/bin/run.js migrate --dir=migrations-pg -v

          # Read back the applied count from Skyway's history table for the
          # parity report. `mj migrate` exits non-zero on any failure, so by
          # the time we're here the apply has succeeded.
          PG_APPLIED=$(psql -tA -c "SELECT COUNT(*) FROM __mj.flyway_schema_history WHERE success = TRUE" 2>/dev/null || echo "0")
          echo "pg_applied=$PG_APPLIED" >> "$GITHUB_OUTPUT"
          echo "Applied $PG_APPLIED migrations via mj migrate"

      # ─── Step 5b: Idempotency check (re-apply each V-migration) ─────
      # Skyway prevents re-runs at the framework level via flyway_schema_history,
      # so this step uses raw psql to test a concern Skyway hides: a migration
      # that gets re-applied after a partial-commit failure or a backup restored
      # mid-migration. Idempotent migrations succeed; non-idempotent ones fail
      # with errors like "column already exists", "relation already exists", or
      # UNIQUE constraint violations on hardcoded INSERTs.
      #
      # Failure modes this catches that step 5 cannot:
      #   - ALTER TABLE ADD COLUMN without IF NOT EXISTS
      #   - CREATE INDEX without IF NOT EXISTS
      #   - CREATE TABLE without IF NOT EXISTS
      #   - INSERT without ON CONFLICT or IF-NOT-EXISTS guard
      #   - CREATE TRIGGER without prior DROP TRIGGER IF EXISTS
      #
      # Migrations that are intentionally non-idempotent can opt out by
      # including the marker `-- pg-test:non-idempotent <reason>` on a
      # comment line anywhere in the file. This keeps the gate honest
      # — if you opt out, the reason is right there in the file.
      #
      # Failures here are reported but do NOT fail the workflow yet
      # (continue-on-error: true) — first we need to see how dirty the
      # current PG migration set is. Once we triage existing migrations,
      # remove continue-on-error to make the gate enforced.
      - name: Verify migration idempotency (second-pass apply)
        id: idempotency
        if: steps.verify_committed.outputs.skip_apply != 'true'
        continue-on-error: true
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: mj_pg_ci
        run: |
          echo "=== Idempotency check: re-applying each V-migration ==="

          # Source-of-truth for "which migrations did Skyway actually apply" is
          # flyway_schema_history. Pre-baseline files are absent from it, so we
          # iterate just the rows Skyway recorded as success.
          mapfile -t APPLIED_VERSIONS < <(psql -tA -c "SELECT version FROM __mj.flyway_schema_history WHERE success = TRUE AND type = 'SQL' ORDER BY installed_rank")

          # The flyway_schema_history table has no `script` column for the
          # filename, so we resolve filename by matching version prefix.

          # Resolve the same Flyway placeholder Skyway resolves at apply time.
          # We use a tmp directory so we don't mutate the working tree.
          TMPDIR=$(mktemp -d)
          for f in migrations-pg/v*/V*.sql; do
            sed 's/\${flyway:defaultSchema}/__mj/g' "$f" > "$TMPDIR/$(basename "$f")"
          done

          TOTAL=0
          IDEMPOTENT=0
          NOT_IDEMPOTENT=0
          ALLOWLISTED=0
          NON_IDEMPOTENT_FILES=""

          for version in "${APPLIED_VERSIONS[@]}"; do
            f=$(ls "$TMPDIR"/V"$version"__*.sql 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            FILENAME=$(basename "$f")

            # Skip files explicitly opted out via the allowlist marker
            if grep -qE '^[[:space:]]*--[[:space:]]*pg-test:non-idempotent\b' "$f"; then
              ALLOWLISTED=$((ALLOWLISTED + 1))
              echo "::notice::$FILENAME — opted out via 'pg-test:non-idempotent' marker"
              continue
            fi

            # Skip Metadata_Sync-pattern files (sproc-call-driven, expected to
            # require CodeGen between runs)
            if grep -q 'SELECT __mj\."fn_create_\|SELECT __mj\."fn_update_\|SELECT __mj\."spCreate\|PERFORM __mj\.' "$f" 2>/dev/null; then
              ALLOWLISTED=$((ALLOWLISTED + 1))
              echo "::notice::$FILENAME — skipped (Metadata_Sync: stored-proc-call file, idempotency depends on CodeGen state)"
              continue
            fi

            TOTAL=$((TOTAL + 1))

            if psql -v ON_ERROR_STOP=1 -f "$f" > /dev/null 2>&1; then
              IDEMPOTENT=$((IDEMPOTENT + 1))
            else
              NOT_IDEMPOTENT=$((NOT_IDEMPOTENT + 1))
              NON_IDEMPOTENT_FILES="$NON_IDEMPOTENT_FILES\n  $FILENAME"
              echo "::warning::$FILENAME — NOT idempotent (failed on second apply)"
              # Surface the actual error for triage
              psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tail -3 | sed 's/^/    /'
            fi
          done

          echo ""
          echo "=== Idempotency Results ==="
          echo "  Checked:       $TOTAL"
          echo "  Idempotent:    $IDEMPOTENT"
          echo "  NOT idempotent: $NOT_IDEMPOTENT"
          echo "  Allowlisted:   $ALLOWLISTED"

          {
            echo "## PG Migration Idempotency Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Migrations checked | $TOTAL |"
            echo "| Idempotent | $IDEMPOTENT |"
            echo "| **NOT idempotent** | **$NOT_IDEMPOTENT** |"
            echo "| Allowlisted (Metadata_Sync or marker) | $ALLOWLISTED |"
            if [ "$NOT_IDEMPOTENT" -gt 0 ]; then
              echo ""
              echo "### Non-idempotent migrations"
              echo ""
              printf '%s\n' "$NON_IDEMPOTENT_FILES" | sed 's/^/- /'
              echo ""
              echo "Each file above either needs defensive guards (\`IF NOT EXISTS\`, \`ON CONFLICT\`,"
              echo "\`OR REPLACE\`, etc.) OR an opt-out marker \`-- pg-test:non-idempotent <reason>\`"
              echo "if non-idempotency is intentional."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $NOT_IDEMPOTENT -gt 0 ]; then
            printf "::warning::%d migration(s) are NOT idempotent. See step summary for details.\n" "$NOT_IDEMPOTENT"
            # Initially non-blocking via continue-on-error above. Once existing
            # migrations are triaged, remove continue-on-error to enforce.
          fi

          echo "not_idempotent=$NOT_IDEMPOTENT" >> "$GITHUB_OUTPUT"

      # ─── Step 6: Verify schema ──────────────────────────────────────
      - name: Verify PG schema
        if: steps.verify_committed.outputs.skip_apply != 'true'
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: mj_pg_ci
        run: |
          echo "=== PG Schema Verification ==="

          TABLES=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '__mj' AND table_type = 'BASE TABLE'")
          VIEWS=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = '__mj'")
          FUNCTIONS=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = '__mj' AND routine_type = 'FUNCTION'")

          echo "  Tables:    $TABLES"
          echo "  Views:     $VIEWS"
          echo "  Functions: $FUNCTIONS"

          # Minimum thresholds — if the schema has fewer objects than expected,
          # something went seriously wrong during migration
          MIN_TABLES=250
          MIN_VIEWS=200

          if [ "$TABLES" -lt "$MIN_TABLES" ]; then
            echo "::error::Expected at least $MIN_TABLES tables, got $TABLES"
            exit 1
          fi

          if [ "$VIEWS" -lt "$MIN_VIEWS" ]; then
            echo "::error::Expected at least $MIN_VIEWS views, got $VIEWS"
            exit 1
          fi

          echo "::notice::Schema verification passed: $TABLES tables, $VIEWS views, $FUNCTIONS functions"

      # ─── Step 7: Parity report ──────────────────────────────────────
      - name: Generate parity report
        if: always()
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: mj_pg_ci
        run: |
          echo "## PostgreSQL Migration Parity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

          TABLES=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '__mj' AND table_type = 'BASE TABLE'" 2>/dev/null || echo "N/A")
          VIEWS=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = '__mj'" 2>/dev/null || echo "N/A")
          FUNCTIONS=$(psql -tA -c "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = '__mj' AND routine_type = 'FUNCTION'" 2>/dev/null || echo "N/A")
          TRIGGERS=$(psql -tA -c "SELECT COUNT(DISTINCT trigger_name) FROM information_schema.triggers WHERE trigger_schema = '__mj'" 2>/dev/null || echo "N/A")

          echo "| Tables | $TABLES |" >> $GITHUB_STEP_SUMMARY
          echo "| Views | $VIEWS |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | $FUNCTIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggers | $TRIGGERS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated by \`pg-migrations.yml\` — Phase C of the PG migration architecture." >> $GITHUB_STEP_SUMMARY

      # ─── Step 8 (NIGHTLY): Functional PG lane — metadata seed + integration subset ──
      # The steps below are REPORT-FIRST (continue-on-error): the PG functional path has
      # never run in CI, so first runs surface the real seams (does `mj sync push` speak
      # PG? do the curated bundles pass?) as loud warnings + step-summary entries instead
      # of a permanently-red nightly. Flip continue-on-error to false once green — that
      # is the ratchet, and leaving it report-only forever defeats the lane's purpose.
      - name: (Nightly) Build integration graph
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx turbo build --filter=@memberjunction/testing-integration --filter=@memberjunction/integration-test-suite --filter=@memberjunction/open-app-engine --filter=@memberjunction/postgresql-dataprovider

      - name: (Nightly) Sync push metadata to PG
        id: pg_sync
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          DB_PLATFORM: postgresql
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_DATABASE: mj_pg_ci
          DB_USERNAME: postgres
          DB_PASSWORD: testpass
          CODEGEN_DB_USERNAME: postgres
          CODEGEN_DB_PASSWORD: testpass
          MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
        run: |
          node packages/MJCLI/bin/run.js sync push --dir=metadata --ci
          node packages/MJCLI/bin/run.js sync push --dir=metadata-optional/integration-test --ci

      # Curated server-transport subset. Chosen for engine-level coverage with the least
      # provider-specific SQL probing; extend the list as members prove green on PG.
      # CI-FIRST-RUN: none of these have ever executed against PostgreSQL in CI.
      - name: (Nightly) Run integration subset against PostgreSQL
        id: pg_subset
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.pg_sync.outcome == 'success'
        continue-on-error: true
        env:
          DB_PLATFORM: postgresql
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_DATABASE: mj_pg_ci
          DB_USERNAME: postgres
          DB_PASSWORD: testpass
          CODEGEN_DB_USERNAME: postgres
          CODEGEN_DB_PASSWORD: testpass
          MJ_INTEGRATION_TEST: '1'
          RUN_AGENT_TESTS: '0'
        run: |
          set -e
          for TEST in \
            "IT38 - Template Engine Rendering" \
            "IT39 - Actions Pipeline" \
            "IT48 - ClassFactory Resolution Contracts" \
            "IT20 - Lists Keyset Pagination"; do
            echo "=== $TEST (PostgreSQL) ==="
            node packages/MJCLI/bin/run.js test run --name "$TEST"
          done

      - name: (Nightly) Functional lane verdict
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## PG functional lane (report-first)"
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| metadata sync push | ${{ steps.pg_sync.outcome }} |"
            echo "| integration subset | ${{ steps.pg_subset.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pg_sync.outcome }}" != "success" ] || [ "${{ steps.pg_subset.outcome }}" != "success" ]; then
            echo "::warning::PG functional lane is NOT green — PostgreSQL still ships on migration-parity evidence alone. See the step logs; flip continue-on-error to false once the seams are fixed."
          fi
