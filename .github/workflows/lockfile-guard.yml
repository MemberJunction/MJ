# Lockfile drift guard.
#
# WHY A DEDICATED CHECK, when `pnpm install --frozen-lockfile` already runs in half a dozen jobs:
# attribution and speed, not detection. Drift surfaces today as "adopted standards failed",
# "Source guards failed", "Run unit tests failed" and three more — every one of which reads like
# the PR broke that thing, in a job that takes minutes to get there. Twice in one day a PR reached
# `next` with exactly this (#4572, #4604), and both times the several minutes and the misleading
# names were part of why.
#
# This answers one question, in seconds, under a name that says what is wrong.
#
# Intended to be a required check in next-protect, which is why there is no `paths:` filter on the
# trigger: a workflow skipped by a paths filter never reports its checks, so every PR that left
# package.json alone would wait forever. The `changes` job applies the same filter instead; a job skipped by its `if`
# reports as passing.
name: Lockfile Guard

on:
  pull_request:

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: lockfile-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect lockfile-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check changed paths
        id: filter
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF"
          CHANGED="$(git diff --name-only "origin/$PR_BASE_REF...HEAD")"
          # The old paths filter (**/package.json, pnpm-lock.yaml, this workflow), plus patches/ and
          # pnpm-workspace.yaml: editing a patchedDependencies patch without the lockfile fails
          # frozen-lockfile installs (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH).
          if echo "$CHANGED" | grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^patches/|^\.github/workflows/lockfile-guard\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lockfile-matches-manifests:
    name: Lockfile matches package.json
    needs: changes
    # Fail closed: a skipped required check counts as passing, so if change detection itself
    # failed, run the real check rather than skip it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # `--lockfile-only` resolves and compares without materialising node_modules, so this is
      # seconds rather than minutes. It is the same comparison the real install makes, which is
      # the point: no second implementation to drift from the thing it is protecting.
      - name: Resolve against the committed lockfile
        id: check
        run: |
          set -o pipefail
          if pnpm install --frozen-lockfile --lockfile-only 2>&1 | tee /tmp/pnpm.log; then
            echo "Lockfile is consistent with every package.json."
            exit 0
          fi

          echo "::error::pnpm-lock.yaml does not match the package.json files in this PR. Run 'pnpm install --lockfile-only' at the repo root and commit pnpm-lock.yaml."
          echo
          echo "─── what pnpm reported ───"
          # The 'Failure reason' block names the offending manifest and the exact specifiers, which
          # is the whole diagnosis; surfacing it here saves opening the log.
          grep -qE 'ERR_PNPM_|Failure reason' /tmp/pnpm.log && sed -n '/ERR_PNPM_/,/^$/p;/Failure reason/,/^$/p' /tmp/pnpm.log || cat /tmp/pnpm.log
          exit 1
