name: CodeGen tail drift

# Guards the invariant in issue #3737: committed generated code must match committed
# migrations. A migration that adds a core-schema table has a CodeGen "tail" — the entity
# subclass, the MJServer resolvers, the Explorer form — and shipping the migration without
# it (or with only part of it) is silent. Nothing fails to build; the runtime just falls
# back to BaseEntity, and every downstream clean-environment CodeGen run turns into a diff
# nobody can distinguish from real drift.
#
# No `pnpm install` and no database: the guard compares files the repo already ships, so
# this is a ~10-second check rather than the multi-minute migrate + CodeGen pass that would
# otherwise be the only way to catch this. The unit suite runs under the .github/scripts
# vitest config and is the reason the guard's parsing can be trusted to fail loudly if
# CodeGen's output shape ever changes.

on:
  pull_request:
    branches: [next]
    paths:
      - 'migrations/**'
      - 'packages/MJCoreEntities/src/generated/**'
      - 'packages/MJServer/src/generated/**'
      - 'packages/Angular/Explorer/core-entity-forms/src/lib/generated/**'
      - '.github/scripts/check-codegen-tail.mjs'
      - '.github/scripts/__tests__/check-codegen-tail.test.mjs'
      - '.github/workflows/ci-codegen-tail.yml'
  push:
    branches: [next]
    paths:
      - 'migrations/**'
      - 'packages/MJCoreEntities/src/generated/**'
      - 'packages/MJServer/src/generated/**'
      - 'packages/Angular/Explorer/core-entity-forms/src/lib/generated/**'
      - '.github/scripts/check-codegen-tail.mjs'
      - '.github/workflows/ci-codegen-tail.yml'
  workflow_dispatch:

concurrency:
  group: codegen-tail-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  check:
    name: Check CodeGen tail
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Full history: the guard diffs the PR's migrations against the merge base, and
      # subtracts DROP TABLEs found anywhere in history so a retired table (the legacy
      # Workflow/Report cluster) is not reported as missing a subclass.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # --all rather than the default merge-base diff: on `next` there is no PR to scope
      # to, and the whole-history sweep is what proves the invariant actually holds.
      - name: Check CodeGen tail
        run: node .github/scripts/check-codegen-tail.mjs --all
