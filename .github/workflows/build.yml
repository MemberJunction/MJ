name: Build all packages for testing

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  # Pin turbo's local cache directory so the seed restore and turbo agree on its location.
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  build-only:
    name: Build new versions of NPM packages
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
      # Turbo remote cache — push/dispatch only (this workflow never triggers on pull_request,
      # and the guard keeps credentials off PR runs defensively if one is ever added).
      TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name != 'pull_request' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true

      - uses: ./.github/actions/mj-setup

      - name: Validate package repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Restore turbo build cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-

      - name: Build packages
        run: pnpm run build

      # Open App CI builds `next` against MJ `next` (each app's .github/actions/ci-install). It
      # resolves the newest commit whose run of THIS workflow passed and downloads this artifact
      # instead of rebuilding all of MJ, so a downstream PR costs minutes, not a full MJ build.
      # Only `dist/` folders: the consumer clones the same commit for sources and package.json.
      - name: Package the build for Open App CI
        if: github.event_name == 'push' && github.ref_name == 'next'
        run: |
          find packages -name node_modules -prune -o -name dist -type d -prune -print0 \
            | tar --null -czf mj-dist.tar.gz -T -
          ls -lh mj-dist.tar.gz

      - name: Upload the build for Open App CI
        if: github.event_name == 'push' && github.ref_name == 'next'
        uses: actions/upload-artifact@v7
        with:
          name: mj-dist
          path: mj-dist.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  # Backstop alarm: this workflow's push run on `next` gates nothing, so a red one used to be
  # visible only to whoever opened the Actions tab. Red opens (or comments on) one rolling issue
  # for THIS workflow; green closes it. Logic and tests: .github/scripts/backstop-alarm.mjs.
  # Push to `next` only: line branches (lts/**) and the scheduled lanes are not what the alarm's
  # title describes. `cancelled` counts as red, as in test.yml: a push run here is never cancelled
  # by concurrency, so a cancel means a timeout or a manual stop.
  backstop-alarm:
    name: Backstop alarm
    needs: [build-only]
    if: always() && github.event_name == 'push' && github.ref_name == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Alert on backstop failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs red --workflow "Build all packages for testing"

      # A cleanup failure must never turn a green run red (that would file an alarm about the
      # alarm), so this step alone is continue-on-error; the script still logs ::error::.
      - name: Resolve backstop alarm on green
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs green --workflow "Build all packages for testing"
