name: Build all packages for testing

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  build-only:
    name: Build new versions of NPM packages
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Validate package repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

  # Backstop alarm: this workflow's push run on `next` gates nothing, so a red one used to be
  # visible only to whoever opened the Actions tab. Red opens (or comments on) one rolling issue
  # for THIS workflow; green closes it. Logic and tests: .github/scripts/backstop-alarm.mjs.
  # Push to `next` only: line branches (lts/**) and the scheduled lanes are not what the alarm's
  # title describes. `cancelled` counts as red, as in test.yml: a push run here is never cancelled
  # by concurrency, so a cancel means a timeout or a manual stop.
  backstop-alarm:
    name: Backstop alarm
    needs: [build-only]
    if: always() && github.event_name == 'push' && github.ref_name == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Alert on backstop failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs red --workflow "Build all packages for testing"

      # A cleanup failure must never turn a green run red (that would file an alarm about the
      # alarm), so this step alone is continue-on-error; the script still logs ::error::.
      - name: Resolve backstop alarm on green
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/backstop-alarm.mjs green --workflow "Build all packages for testing"
