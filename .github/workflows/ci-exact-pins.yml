name: Exact version pins for build-baked scopes

on:
  pull_request:
    branches:
      - next
    paths:
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/scripts/check-exact-pins.mjs'
      - '.github/workflows/ci-exact-pins.yml'

# Cancel superseded runs for the same ref. Without this a second push to a PR leaves the
# first run burning a runner for a commit nobody will merge; 108 such runner-minutes were
# measured across this repo in a single 23-hour window (2026-10-27).
concurrency:
  group: ci-exact-pins-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  check-exact-pins:
    name: packages/** must exact-pin @foblex/* to match pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check exact version pins
        run: node .github/scripts/check-exact-pins.mjs
