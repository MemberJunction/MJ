name: MJ workspace setup
description: >-
  pnpm + Node + a cached frozen-lockfile install + the MJExplorer environment file CI has to synthesize.
  Extracted because the Unit Tests workflow now runs these same five steps in four separate jobs
  (build, each test shard, the ESM guard, the nightly coverage lane) and they must not drift —
  a shard installing differently from the job that built its dist/ produces failures that look
  like test failures.

  NOTE: the caller must run actions/checkout BEFORE using this action. A local composite action
  cannot check out the repository it lives in.

inputs:
  node-version:
    description: Node major version to install.
    required: false
    default: '24'
  install:
    description: >-
      Run `pnpm install --frozen-lockfile`. Set to 'false' for jobs that only run plain-node
      scripts and need no dependency tree.
    required: false
    default: 'true'
  ignore-scripts:
    description: >-
      Pass `--ignore-scripts` to `pnpm install --frozen-lockfile`. Use in jobs that do not need
      postinstall hooks.
    required: false
    default: 'false'
  create-explorer-env:
    description: >-
      Synthesize the gitignored packages/MJExplorer/src/environments/environment.ts file. Set to
      'false' for jobs that do not build MJExplorer or that assert a clean git working tree.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    # The pnpm store has its own cache key, which only this action writes, and only after a
    # full install. The setup-node pnpm cache shares one key with every job in the repository,
    # so a job that does not install can save a near-empty store that all later jobs then hit.
    - name: Find the pnpm store
      if: inputs.install == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      if: inputs.install == 'true'
      id: pnpm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi

    - name: Save the pnpm store
      if: inputs.install == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

    # MJExplorer's environment.ts is gitignored (it carries per-deployment auth config), so CI
    # has to synthesize one or the Explorer packages fail to compile.
    - name: Create MJExplorer environment file
      if: inputs.create-explorer-env == 'true'
      shell: bash
      run: |
        mkdir -p packages/MJExplorer/src/environments
        cat > packages/MJExplorer/src/environments/environment.ts << 'ENVEOF'
        export const environment = {
          GRAPHQL_URI: "http://localhost:4000",
          GRAPHQL_WS_URI: "ws://localhost:4000",
          REDIRECT_URI: "http://localhost:4200",
          CLIENT_ID: "00000000-0000-0000-0000-000000000000",
          TENANT_ID: "00000000-0000-0000-0000-000000000000",
          CLIENT_AUTHORITY: "https://login.microsoftonline.com/common",
          AUTH_TYPE: "msal" as const,
          NODE_ENV: "test",
          AUTOSAVE_DEBOUNCE_MS: 1200,
          SEARCH_DEBOUNCE_MS: 800,
          MIN_SEARCH_LENGTH: 3,
          MJ_CORE_SCHEMA_NAME: "__mj",
          production: false,
          APPLICATION_NAME: "MJ Explorer CI",
          APPLICATION_INSTANCE: "CI",
          AUTH0_DOMAIN: "",
          AUTH0_CLIENTID: ""
        };
        ENVEOF
