<!-- The canonical MJ shell shape: a full-width header ABOVE the rail, then a row of rail + content.
     mj-page-layout is overflow:hidden and the body owns the scrolling, which is what keeps the
     header fixed while the page below it moves. -->
<mj-page-layout>
  <!-- The header names the CATEGORY, not the sub-page: the sub-page name is already the rail's
       active item a few inches away, so repeating it would waste the one line of orientation. -->
  <mj-page-header [Title]="CategoryTitle" [Icon]="CategoryIcon"></mj-page-header>

  <mj-page-body [Flex]="true" [Padding]="false" Direction="row">
    <mj-left-nav
        [Sections]="RailSections"
        [ActiveId]="ActivePageId"
        [MobileTitle]="CategoryTitle"
        (ItemClicked)="OnRailItemClicked($event)"></mj-left-nav>

    <mj-left-nav-content>
      <!-- `@for ... track page.id` over a ONE-ELEMENT list is not a loop -- it is a KEY. It is what
           makes Angular DESTROY and RECREATE this whole body when the rail changes, and it is
           load-bearing. Without it every 'entity' page reuses ONE <mj-entity-viewer> instance, and
           that instance carries its `_gridState.columnSettings` across the switch. Those settings
           name the PREVIOUS entity's fields, and mj-entity-data-grid drops any setting whose field
           the new entity does not have (`buildAgColumnDefsFromGridState`, `if (!field) continue`)
           with no floor when everything is dropped -- so the grid renders ZERO columns while still
           loading the rows. Measured 4 Sep 2026 on Animals -> Care Log: 21 rows in the DOM, 6
           columns built into `_columns`, `agColumnDefs.length === 0`, and the grid state still
           holding [Name, Species, IntakeDate, Status, Breed, Housing] -- Animal's columns. Breeds
           hid the bug because it shares Name + Species with Animal, so two columns survived. -->
      @for (page of ActivePageAsList; track page.id) {
        @switch (page.kind) {
          @case ('entity') {
            <mj-entity-viewer
                [EntityName]="page.entityName!"
                (CreateRecordRequested)="onCreateNewRecord(page.entityName!)"
                (RecordOpened)="onRecordOpened($any($event))"
                (OpenRelatedRecordRequested)="onOpenRelatedRecord($event)"
                (DataLoaded)="NotifyLoadComplete()"
                style="display:block; width:100%; height:100%;"></mj-entity-viewer>
          }
          @case ('query') {
            @if (QueryIds[page.queryName!]) {
              <mj-query-viewer
                  [QueryId]="QueryIds[page.queryName!]"
                  style="display:block; width:100%; height:100%;"></mj-query-viewer>
            } @else {
              <!-- Resolving, or the query is missing. Say which rather than showing a blank pane. -->
              <p class="shelter-cat__note">Loading “{{ page.queryName }}”…</p>
            }
          }
          @case ('pending') {
            <div class="shelter-cat__pending">
              <i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>
              <h2>{{ page.label }}</h2>
              <p>{{ page.pendingNote }}</p>
            </div>
          }
        }
      }
    </mj-left-nav-content>
  </mj-page-body>
</mj-page-layout>
