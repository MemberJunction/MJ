# Explorer surfaces and profile — the read-heavy paths a field user actually reaches for.
#
# These assert on data loaded from a live MJAPI, so they also serve as a smoke test that the
# provider booted, the token is valid, and entity permissions resolve.
appId: org.memberjunction.mobile
---
- launchApp:
    clearState: false
# Wait for the app to finish booting before deep-linking. A link fired at a still-starting app is
# silently dropped on Android — which is how these flows "failed" while the screens were fine.
- extendedWaitUntil:
    visible: "Ask an agent anything, or pick up where you left off."
    timeout: 30000

- openLink: "mjmobile://explorer"
- extendedWaitUntil:
    visible: "Data Explorer"
    timeout: 20000

- openLink: "mjmobile://profile"
- extendedWaitUntil:
    visible: "Profile & settings"
    timeout: 20000
# Rows in this list carry accessibilityLabels that become their accessible name and shadow the
# inner text, so assert on content that is not inside a labelled pressable.
- assertVisible: "da-robot-tester@bluecypress.io"
- assertVisible: "Sign out"
