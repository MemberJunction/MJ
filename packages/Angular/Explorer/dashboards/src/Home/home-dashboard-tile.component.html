<article class="tile" [attr.aria-labelledby]="HeadingId">
  <header class="tile-header">
    <h3 class="tile-title" [id]="HeadingId">
      <button type="button" class="tile-name" [title]="Dashboard.Name" (click)="Open.emit(Dashboard)">{{ Dashboard.Name }}</button>
    </h3>
    @if (IsContinue) {
      <span class="tile-chip"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Continue</span>
    }
    <button type="button" class="tile-star" [class.on]="IsFavorite" [attr.aria-pressed]="IsFavorite ? 'true' : 'false'"
      [attr.aria-label]="'Favorite ' + Dashboard.Name" (click)="ToggleFavorite.emit(Dashboard)">
      <i [class]="IsFavorite ? 'fa-solid fa-star' : 'fa-regular fa-star'" aria-hidden="true"></i>
    </button>
    <button type="button" class="tile-open" [attr.aria-label]="'Open ' + Dashboard.Name" (click)="Open.emit(Dashboard)">
      <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i> <span class="tile-open-label">Open</span>
    </button>
  </header>
  <!-- The live dashboard, zoomed to fill the body at TILE_CONTENT_SCALE. A new view Key creates a new viewer. -->
  <div class="tile-body" #tileBody [style.height.px]="BodyHeight">
    <div class="tile-content" [style.--tile-content-zoom]="ContentZoom">
      @for (view of Views; track view.Key) {
        <mj-dashboard-viewer [Dashboard]="view.Dashboard" [IsEditing]="false" [ShowToolbar]="false" [ShowBreadcrumb]="false"
          (NavigationRequested)="NavigationRequested.emit($event)"></mj-dashboard-viewer>
      }
    </div>
  </div>
</article>
