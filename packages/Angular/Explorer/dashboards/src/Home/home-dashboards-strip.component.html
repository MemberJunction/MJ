<mj-accordion-panel class="strip-section" [Bare]="true" [TitleIconMuted]="true" [HeadingLevel]="2"
    [Expanded]="Expanded" (ExpandedChange)="OnExpandedChange($event)">
  <ng-template mjAccordionTitle>
    <span class="strip-title"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Dashboards</span>
  </ng-template>
  <ng-template mjAccordionActions>
    <div class="strip-actions">
      <button type="button" class="strip-btn primary strip-new" (click)="NewDashboard.emit()"><i class="fa-solid fa-plus" aria-hidden="true"></i> <span class="strip-btn-label">New</span></button>
      <button type="button" class="strip-btn strip-see-all" (click)="SeeAll.emit()"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> <span class="strip-btn-label">See all</span></button>
    </div>
  </ng-template>
  <ng-template mjAccordionBody>
    <div class="strip-body">
      <!-- Zero height and as wide as the section: the strip watches its width to put the tiles in rows. -->
      <div class="strip-width-probe" #widthProbe aria-hidden="true"></div>
      @if (TileCount === 0) {
        <p class="strip-empty">Open or star a dashboard and it appears here.</p>
      } @else {
        @let layout = Layout;
        <!-- The tiles: Continue first, then the favorites, in one list keyed by dashboard ID. CSS grid puts each tile
             in its row. Each tile is followed by the gutter to the next tile in its row, or by its row's height handle.
             A separator listens only for pointerdown; its drag's moves and end are followed outside Angular. -->
        <div class="strip-grid" #tileGrid [style.--tiles-gap]="TileGap">
          @for (tile of Tiles; track tile.Dashboard.ID; let i = $index) {
            @let place = layout.Tiles[i];
            <mj-home-dashboard-tile [Dashboard]="tile.Dashboard" [IsContinue]="tile.IsContinue" [IsFavorite]="IsFavorite(tile.Dashboard)"
              [BodyHeight]="place.BodyHeight" [attr.data-row]="place.Row"
              [style.--tiles-line]="place.RowLine" [style.--tiles-row-gaps]="place.RowTileCount - 1"
              [style.--tiles-start]="place.Start" [style.--tiles-span]="place.Span" [style.--tiles-gaps-before]="place.Column"
              (Open)="Open.emit($event)" (ToggleFavorite)="ToggleFavorite.emit($event)"
              (NavigationRequested)="NavigationRequested.emit($event)"></mj-home-dashboard-tile>
            @if (place.GutterAfter; as gutter) {
              <div class="strip-gutter" role="separator" aria-orientation="vertical" tabindex="0" [class.dragging]="IsDraggingGutter(i)"
                [attr.aria-label]="GutterLabel(i)" [attr.aria-valuenow]="gutter.ValueNow" [attr.aria-valuemin]="MinTileWidth"
                [attr.aria-valuemax]="gutter.ValueMax" [attr.aria-valuetext]="gutter.ValueNow + '%'" [attr.data-row]="place.Row"
                [style.--tiles-line]="place.RowLine" [style.--tiles-row-gaps]="place.RowTileCount - 1"
                [style.--tiles-start]="gutter.Start" [style.--tiles-gaps-before]="place.Column"
                (pointerdown)="OnGutterPointerDown($event, i)" (keydown)="OnGutterKeyDown($event, i)" (dblclick)="OnGutterDoubleClick(i)">
                <span class="strip-gutter-bar"></span>
              </div>
            }
            @if (place.HandleAfter; as handle) {
              <div class="strip-row-handle" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize row height"
                [class.dragging]="IsDraggingRow(handle.Row)" [attr.aria-valuenow]="handle.Height"
                [attr.aria-valuemin]="MinRowHeight" [attr.aria-valuemax]="MaxRowHeight"
                [attr.aria-valuetext]="HandleValueText(handle.Height, layout.Rows[handle.Row])" [attr.data-row]="handle.Row"
                [style.--tiles-line]="handle.Line"
                (pointerdown)="OnHandlePointerDown($event, handle.Row)" (keydown)="OnHandleKeyDown($event, handle.Row)"
                (dblclick)="OnHandleDoubleClick(handle.Row)">
                <span class="strip-row-handle-bar"></span>
              </div>
            }
          }
        </div>
      }
      <button type="button" class="strip-browse-all" (click)="BrowseAll.emit()">
        <span class="strip-browse-icon"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></span>
        <span class="strip-browse-label">Browse all {{ TotalCount }}</span>
        <small>{{ FavoritesLabel }} · {{ SharedCount }} shared with you</small>
      </button>
    </div>
  </ng-template>
</mj-accordion-panel>
