<!-- Dashboards app: Overview -->
<mj-page-layout>
  <mj-page-header Title="Dashboards" Icon="fa-solid fa-gauge-high" Subtitle="Pick up where you left off, or start something new">
    <div actions>
      <button mjButton variant="outline" size="sm" class="ov-browse-all" (click)="BrowseAll()">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i> Browse all
      </button>
      <button mjButton variant="primary" size="sm" class="ov-new" [disabled]="IsCreating" (click)="NewDashboard()">
        <i class="fa-solid fa-plus" aria-hidden="true"></i> New dashboard
      </button>
    </div>
  </mj-page-header>

  <mj-page-body>
    @if (IsLoading) {
      <mj-loading Text="Loading dashboards..." Size="medium"></mj-loading>
    } @else {
      <section class="ov-section ov-continue">
        <h2><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Continue where you left off</h2>
        @if (ContinueList.length) {
          <div class="ov-cards">
            @for (d of ContinueList; track d.ID) {
              <mj-dashboard-card
                [Dashboard]="d"
                [IsFavorite]="IsFavorite(d)"
                [ShowCategory]="false"
                (Open)="Open($event)"
                (ToggleFavorite)="ToggleFavorite($event)">
              </mj-dashboard-card>
            }
          </div>
        } @else {
          <mj-empty-state Size="compact" Icon="fa-solid fa-clock-rotate-left" Title="Open a dashboard and it appears here" />
        }
      </section>

      <div class="ov-two">
        <section class="ov-panel ov-favorites">
          <h2><i class="fa-solid fa-star" aria-hidden="true"></i> Favorites</h2>
          @for (d of Favorites; track d.ID) {
            <div class="ov-row">
              <button type="button" class="ov-row-main" (click)="Open(d)">
                <b>{{ d.Name }}</b><small>{{ CategoryLabel(d) }} · {{ d.User }}</small>
              </button>
              <button mjButton size="sm" [ariaLabel]="'Open ' + d.Name" (click)="Open(d)">Open</button>
            </div>
          } @empty {
            <mj-empty-state Size="compact" Icon="fa-solid fa-star" Title="Star a dashboard to keep it here" />
          }
        </section>

        <section class="ov-panel ov-shared">
          <h2><i class="fa-solid fa-inbox" aria-hidden="true"></i> Shared with you</h2>
          @for (d of Shared; track d.ID) {
            <div class="ov-row">
              <button type="button" class="ov-row-main" (click)="Open(d)">
                <b>{{ d.Name }}</b><small>{{ CategoryLabel(d) }} · shared by {{ d.User }}</small>
              </button>
              <button mjButton size="sm" [ariaLabel]="'Open ' + d.Name" (click)="Open(d)">Open</button>
            </div>
          } @empty {
            <mj-empty-state Size="compact" Icon="fa-solid fa-inbox" Title="Nothing shared with you yet" />
          }
        </section>
      </div>
    }
  </mj-page-body>
</mj-page-layout>
