<!-- Library page of the Dashboards app -->
<mj-page-layout>
  <mj-page-header Title="Library" Icon="fa-solid fa-layer-group" Subtitle="Every dashboard you own or that is shared with you">
    <div meta>
      <mj-stat-badge [Count]="LibraryCounts[LibraryFilter]" [Total]="LibraryCounts.all" Label="dashboards"></mj-stat-badge>
    </div>
  </mj-page-header>

  <mj-page-body [Flex]="true" [Padding]="false" Direction="row">
    <!-- Library filters and the category tree -->
    <mj-left-nav
      MobileTitle="Dashboards"
      [Sections]="RailSections"
      [ActiveId]="RailActiveId"
      [ExpandedIds]="RailExpandedIds"
      [Collapsible]="true"
      [Collapsed]="RailCollapsed"
      (CollapsedChange)="OnRailCollapsedChange($event)"
      (ItemClicked)="OnRailItemClicked($event)"
      (ItemToggled)="OnRailItemToggled($event)">
    </mj-left-nav>

    <mj-left-nav-content>
      <!-- Generic browser: a flat list for every Library filter and Uncategorized, a folder for a category. A click opens the dashboard in the preview tab; a Shift, Ctrl or Cmd click opens it in a separate tab. -->
      <mj-dashboard-browser
        [Dashboards]="VisibleDashboards"
        [Categories]="Categories"
        [SelectedCategoryId]="IsFlatView ? null : SelectedCategoryId"
        [FlatMode]="IsFlatView"
        [ViewMode]="ViewMode"
        [IsLoading]="isLoading"
        [ShowCreateButton]="true"
        [AllowMultiSelect]="true"
        [AllowDragDrop]="true"
        [DashboardPermissions]="DashboardPermissionsMap"
        [EffectiveCategoryMap]="EffectiveCategoryMap"
        [FavoriteIds]="FavoriteIds"
        [ShowFavorites]="true"
        [OwnerLabels]="OwnerLabels"
        [FlatEmptyIcon]="EmptyState.Icon"
        [FlatEmptyTitle]="EmptyState.Title"
        [FlatEmptyMessage]="EmptyState.Message"
        [FlatEmptyWelcome]="EmptyState.Welcome"
        (DashboardOpen)="OnDashboardOpen($event)"
        (DashboardEdit)="OnDashboardEdit($event)"
        (DashboardDelete)="OnDashboardDelete($event)"
        (DashboardMove)="OnDashboardMove($event)"
        (DashboardCreate)="OnDashboardCreate($event)"
        (DashboardFavoriteToggle)="OnDashboardFavoriteToggle($event)"
        (CategoryCreate)="OnCategoryCreate($event)"
        (CategoryDelete)="OnCategoryDelete($event)"
        (CategoryChange)="OnCategoryChange($event)"
        (ViewPreferenceChange)="OnViewPreferenceChange($event)">
      </mj-dashboard-browser>
    </mj-left-nav-content>
  </mj-page-body>
</mj-page-layout>

<!-- New dashboard: asks for the name first; Cancel creates nothing -->
<mj-dashboard-name-dialog
  [Visible]="ShowNewDashboardDialog"
  [MaxLength]="NewDashboardNameMaxLength"
  [Processing]="IsCreatingDashboard"
  (Confirmed)="OnNewDashboardNamed($event)"
  (Cancelled)="OnNewDashboardCancelled()">
</mj-dashboard-name-dialog>
