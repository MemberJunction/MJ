<aside class="vs-copilot-panel" data-testid="vs-copilot-panel">
  <header class="vs-copilot-panel__header">
    <div class="vs-copilot-panel__title">
      <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
      <span>{{ HeaderTitle }}</span>
    </div>
    @if (ShowCloseButton) {
      <button
        type="button"
        class="vs-copilot-panel__close-btn"
        data-testid="vs-copilot-close-button"
        title="Close copilot"
        aria-label="Close copilot"
        (click)="OnCloseClick()"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    }
  </header>

  <div class="vs-copilot-panel__body">
    @if (IsResolvingAgent) {
      <div class="vs-copilot-panel__loading" data-testid="vs-copilot-loading">
        <mj-loading text="Connecting to Video Studio..." size="small"></mj-loading>
      </div>
    } @else if (AgentMissing || !VideoStudioAgentId) {
      <div
        class="vs-copilot-panel__missing"
        data-testid="vs-copilot-agent-missing"
        role="status"
      >
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <p class="vs-copilot-panel__missing-text">{{ MissingAgentMessage }}</p>
      </div>
    } @else if (EffectiveCurrentUser) {
      <mj-conversation-chat-area
        #chatArea
        data-testid="vs-copilot-chat-area"
        [Provider]="ProviderToUse"
        [EnvironmentId]="EnvironmentId"
        [CurrentUser]="EffectiveCurrentUser"
        [Conversation]="ActiveConversation"
        [ConversationId]="ConversationId"
        [IsNewConversation]="ChatIsNewConversation"
        [DefaultAgentId]="VideoStudioAgentId"
        [ShowAgentPicker]="false"
        [ShowAgentModePicker]="true"
        [PendingMessage]="PendingMessage"
        [PendingArtifactId]="PendingArtifactId"
        [PendingArtifactVersionNumber]="PendingArtifactVersionNumber"
        [PendingArtifactConversationId]="ConversationId"
        [AppContext]="AppContext"
        [ApplicationScope]="'Application'"
        [ApplicationId]="ApplicationId"
        [ShowArtifactIndicator]="true"
        [AllowAttachments]="true"
        (ConversationCreated)="OnChatConversationCreated($event)"
        (PendingMessageConsumed)="OnPendingMessageConsumed()"
        (PendingArtifactConsumed)="OnPendingArtifactConsumed()"
        (navigationRequest)="OnNavigationRequest($event)"
      ></mj-conversation-chat-area>
    } @else {
      <div
        class="vs-copilot-panel__missing"
        data-testid="vs-copilot-agent-missing"
        role="status"
      >
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <p class="vs-copilot-panel__missing-text">{{ MissingAgentMessage }}</p>
      </div>
    }
  </div>
</aside>
