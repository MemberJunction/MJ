<section class="rubrics-home">
    @if (Loading) {
        <mj-loading text="Loading rubrics..."></mj-loading>
    } @else {
        <h1>Rubrics</h1>
        <ul>
            @for (rubric of Rubrics; track rubric.ID) {
                <li><button type="button" (click)="Open(rubric.ID)">{{ rubric.Name }}</button></li>
            }
        </ul>
        <h2>Scales</h2>
        <ul>
            @for (scale of Scales; track scale.ID) {
                <li><button type="button" (click)="OpenScale(scale.ID)">{{ scale.Name }}</button></li>
            }
        </ul>
    }
</section>
