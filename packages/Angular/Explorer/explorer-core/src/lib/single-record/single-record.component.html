@if (DeletedRemotely) {
  <mj-alert
    class="single-record-deleted-banner"
    Variant="warning"
    Title="This record was deleted by another user"
    Message="It no longer exists. What you see here is the last copy that was loaded.">
    <button actions mjButton Variant="secondary" Size="sm" (click)="OnCloseDeletedRecord()">Close</button>
  </mj-alert>
}
<mj-entity-form-host
  [EntityName]="entityName"
  [PrimaryKey]="PrimaryKey"
  [NewRecordValues]="newRecordValues"
  [Provider]="Provider"
  (LoadComplete)="onLoadComplete()"
  (LoadError)="onLoadComplete()"
  (RecordReady)="onRecordReady($event)"
  (Saved)="onSaved($event)"
  (Navigate)="handleNavigation($event)"
  (Notification)="onNotification($event)"
  (EditModeChanged)="OnEditModeChanged($event)"
  (Dismissed)="recordDismissed.emit()"
  (FormCreated)="onFormCreated($event)">
</mj-entity-form-host>
