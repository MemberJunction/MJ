<div class="tab-container">

  <!-- Main region: nav pages (single-resource or main Golden Layout).
       Hidden (not destroyed) while the RECORDS region is showing, so nav
       content keeps its state and reappears instantly. -->
  <div class="main-region" [class.region-hidden]="ShowRecordsRegion">
    <!-- Single-Resource Mode: Direct component rendering without Golden Layout -->
    <!-- This avoids the 20px height issue when GL header is hidden -->
    @if (useSingleResourceMode) {
      <div #directContentContainer class="direct-content-container"></div>
    } @else {
      <!-- Multi-Tab Mode: Golden Layout Container -->
      <div #glContainer class="gl-container"></div>
    }
  </div>

  <!-- RECORDS region: a SEPARATE Golden Layout hosting only record tabs
       (records-style record opens). Always in the DOM once created so the
       layout survives visibility flips; shown only while the active tab is
       a record. Native GL tab bar = record tabs, drag-to-split included. -->
  @if (RecordsStyleActive) {
    <!-- Origin crumbs are PANE-LEVEL now (first element inside each record
         pane — see RecordOriginCrumbComponent); the region needs no bar. -->
    <div class="records-region" [class.region-hidden]="!ShowRecordsRegion">
      <div #recordsGlContainer class="records-gl-container"></div>
    </div>
  }

  <!-- Context Menu (only relevant in multi-tab mode). Real buttons with
       menu semantics: arrow keys rove, Escape closes with focus return to
       the invoking control (see onMenuKeydown / hideContextMenu). -->
  @if (contextMenuVisible) {
    <div
      class="context-menu"
      role="menu"
      aria-label="Tab actions"
      (keydown)="onMenuKeydown($event)"
      [style.left.px]="contextMenuX"
      [style.top.px]="contextMenuY">
      <button type="button" role="menuitem" class="context-menu-item" (click)="onContextPin()">
        <i class="fa-solid fa-thumbtack" aria-hidden="true"></i>
        <span>{{ isContextTabPinned ? 'Unpin Tab' : 'Pin Tab' }}</span>
      </button>
      <div class="context-menu-divider"></div>
      <button type="button" role="menuitem" class="context-menu-item" [class.new-item]="!isContextTabPinnedToHome" [class.disabled]="isContextTabPinnedToHome" [disabled]="isContextTabPinnedToHome" (click)="onContextPinToHome()">
        <i class="fa-solid fa-house-chimney" aria-hidden="true"></i>
        @if (isContextTabPinnedToHome) {
          <span>Pinned to Home</span>
          <span class="check"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
        } @else {
          <span>Pin to Home</span>
        }
      </button>
      @if (canContextMoveToWorkspace || canContextMoveToRecords) {
        <div class="context-menu-divider"></div>
        @if (canContextMoveToWorkspace) {
          <button type="button" role="menuitem" class="context-menu-item" (click)="onContextMoveToWorkspace()">
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
            <span>Move to Workspace</span>
          </button>
        }
        @if (canContextMoveToRecords) {
          <button type="button" role="menuitem" class="context-menu-item" (click)="onContextMoveToRecords()">
            <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
            <span>Move to Records</span>
          </button>
        }
      }
      <div class="context-menu-divider"></div>
      <button type="button" role="menuitem" class="context-menu-item" (click)="onContextClose()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        <span>Close Tab</span>
      </button>
      <button type="button" role="menuitem" class="context-menu-item" (click)="onContextCloseOthers()">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        <span>Close Others</span>
      </button>
      <button type="button" role="menuitem" class="context-menu-item" (click)="onContextCloseToRight()">
        <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
        <span>Close to Right</span>
      </button>
    </div>
  }
</div>
