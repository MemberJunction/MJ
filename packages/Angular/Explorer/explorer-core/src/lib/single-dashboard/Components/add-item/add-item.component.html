<mj-window [Visible]="true" [Width]="500" [MinHeight]="300" [MinWidth]="400" [Resizable]="true" (Close)="closeDialog()"
  Title="Add Item to Dashboard">
  <div class="resource-wrap">
    <label>Resource Type
      <br />
      <mj-dropdown [Data]="ResourceTypes" [TextField]="'DisplayName'" [ValueField]="'ID'"
        (ValueChange)="onResourceTypeChange($any($event))" [(ngModel)]="resourceType">
      </mj-dropdown>
    </label>
    <div class="user-view-wrap">
      @switch (resourceType.Entity ) {
        @case ('MJ: User Views') {
          <label>Entity
            <br />
            <mj-dropdown [Data]="Entities" [TextField]="'Name'" [ValueField]="'ID'"
              (ValueChange)="onEntityChange($any($event))" [(ngModel)]="selectedEntity">
            </mj-dropdown>
          </label>
          @if (selectedEntity && !showloader) {
            @if (Views.length) {
              <label>View
                <span class="optional-hint">(optional — leave blank for default)</span>
                <br />
                <mj-dropdown [Data]="Views" [TextField]="'Name'" [ValueField]="'ID'"
                  (ValueChange)="onViewChange($any($event))" [(ngModel)]="selectedView">
                </mj-dropdown>
              </label>
            }
            <!-- View Mode Selector -->
            <label>View Mode
              <br />
              <mj-dropdown [Data]="viewModeOptions" [TextField]="'label'" [ValueField]="'value'"
                [(ngModel)]="selectedViewMode">
              </mj-dropdown>
            </label>
          }
          @if (selectedEntity && showloader) {
            <mj-loading [showText]="false" size="medium"></mj-loading>
          }
        }
      }
    </div>
  </div>
  <div class="popup-actions customBtn">
    <button mjButton variant="primary" (click)="addItem()">
      <span class="fa-solid fa-check"></span> Add
    </button>
    <button mjButton variant="outline" (click)="closeDialog()">Cancel</button>
  </div>
</mj-window>
