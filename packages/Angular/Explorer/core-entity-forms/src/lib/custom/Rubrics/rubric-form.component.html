@if (record) {
<mj-record-form-container [Record]="record" [FormComponent]="this"
    (Navigate)="OnFormNavigate($event)"
    (DeleteRequested)="OnDeleteRequested()"
    (FavoriteToggled)="OnFavoriteToggled()"
    (HistoryRequested)="OnHistoryRequested()"
    (ListManagementRequested)="OnListManagementRequested()">
    @if (Loading) {
        <mj-loading text="Loading rubric..."></mj-loading>
    } @else {
        <section class="rubric-form">
            <h2>{{ record.Name }}</h2>
            <div class="rubric-actions">
                <span>Select version</span>
                @if (PublishedLabel) { <button type="button" (click)="Viewing = 'published'">Published {{ PublishedLabel }}</button> }
                <button type="button" (click)="Viewing = 'draft'">Draft (next {{ NextVersion }})</button>
                @if (ComputedBump) { <span>Computed {{ ComputedBump }}</span> }
            </div>
            <mj-rubric-builder [Nodes]="Viewing === 'published' ? (BaseVersion?.nodes ?? []) : Nodes" [Scales]="Scales" [Bands]="Viewing === 'published' ? (BaseVersion?.bands ?? []) : Bands" [BaseBands]="BaseVersion?.bands ?? []" [Version]="Viewing === 'published' ? BaseVersion : DraftVersion" [ReadOnly]="Viewing === 'published'" (NodesChange)="OnNodes($event)" (BandsChange)="OnBands($event)"></mj-rubric-builder>
            @if (BaseVersion && DraftVersion) {
                <mj-rubric-version-diff [Base]="BaseVersion" [Draft]="DraftVersion"></mj-rubric-version-diff>
            }
            @if (DraftVersion) {
                <mj-rubric-publish-dialog [Base]="BaseVersion" [Draft]="DraftVersion" [RequestedBump]="RequestedBump" [Summary]="Summary"
                    (RequestedBumpChange)="RequestedBump = $event" (SummaryChange)="Summary = $event" (Confirm)="OnPublish($event)">
                    <button type="button" (click)="OnCancel()">Cancel</button>
                </mj-rubric-publish-dialog>
            }
            @if (Message) {
                <p>{{ Message }}</p>
            }
        </section>
    }
</mj-record-form-container>
}
