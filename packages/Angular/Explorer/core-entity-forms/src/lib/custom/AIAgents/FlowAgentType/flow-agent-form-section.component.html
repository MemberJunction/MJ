@if (AgentID) {
    <!-- ShowSaveControls is left off: the agent form owns this record's save, and this section
         contributes the flow to it via ContributeToSave. A Save button here would be a second save
         button for the same record, with its own idea of what "saved" means. -->
    <mj-flow-agent-editor
        [AgentID]="AgentID"
        [EditMode]="EditMode"
        [FullScreen]="IsFullScreen"
        [CanvasTitle]="null"
        (FlowSaved)="OnFlowSaved()"
        (FullScreenToggled)="OnFullScreenToggled($event)">
    </mj-flow-agent-editor>
} @else {
    <mj-empty-state
        class="flow-empty-state"
        Variant="warning"
        Icon="fa-solid fa-circle-info"
        Title="Save the agent first to configure the workflow." />
}
