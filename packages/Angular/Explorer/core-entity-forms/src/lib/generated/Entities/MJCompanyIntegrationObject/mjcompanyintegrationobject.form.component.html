    <!-- ========================================
         RELATED ENTITY PANELS
         ======================================== -->

    <!-- Company Integration Object Fields (Company Integration Object ID) Section -->
    <mj-collapsible-panel
        SectionKey="mJCompanyIntegrationObjectFieldsCompanyIntegrationObjectID"
        SectionName="Company Integration Object Fields (Company Integration Object ID)"
        Icon="fa fa-table"
        Variant="related-entity"
        [Form]="this"
        [FormContext]="formContext"
        [BadgeCount]="GetSectionRowCount('mJCompanyIntegrationObjectFieldsCompanyIntegrationObjectID')"
        [DefaultExpanded]="false">
        @if (record.IsSaved) {
        <div>
            <mj-explorer-entity-data-grid
                [Params]="BuildRelationshipViewParamsByEntityName('MJ: Company Integration Object Fields','CompanyIntegrationObjectID')"
                [NewRecordValues]="NewRecordValues('MJ: Company Integration Object Fields','CompanyIntegrationObjectID')"
                [AllowLoad]="IsSectionExpanded('mJCompanyIntegrationObjectFieldsCompanyIntegrationObjectID')"
                [ShowToolbar]="true"
                (Navigate)="OnFormNavigate($event)"
                (AfterDataLoad)="SetSectionRowCount('mJCompanyIntegrationObjectFieldsCompanyIntegrationObjectID', $event.totalRowCount)"
                >
            </mj-explorer-entity-data-grid>
        </div>
        }
    </mj-collapsible-panel>
