<mj-record-form-container [Record]="record" [FormComponent]="this"
    (Navigate)="OnFormNavigate($event)"
    (DeleteRequested)="OnDeleteRequested()"
    (FavoriteToggled)="OnFavoriteToggled()"
    (HistoryRequested)="OnHistoryRequested()"
    (ListManagementRequested)="OnListManagementRequested()">

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="before-fields" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>

            [EditMode]="EditMode"
            [FormContext]="formContext"

            [Record]="record"

            Type="number"
            [EditMode]="EditMode"
            [FormContext]="formContext"

        <mj-form-field

            [FormContext]="formContext"
        ></mj-form-field>
        <mj-form-field 
            [Record]="record"

            [EditMode]="EditMode"

        <mj-form-field

        ></mj-form-field>
        <mj-form-field

            [ShowLabel]="true"

        <mj-form-field

            [ShowLabel]="true"

        ></mj-form-field>

        <mj-form-field

            [ShowLabel]="true"
            FieldName="IsResolved"
            Type="checkbox"
            [EditMode]="EditMode"
            [FormContext]="formContext"
        ></mj-form-field>
        <mj-form-field 
            [Record]="record"
            [ShowLabel]="true"
            FieldName="ResolvedByUserID"
            Type="textbox"
            [EditMode]="EditMode"
            [FormContext]="formContext"
            LinkType="Record"
        ></mj-form-field>
        <mj-form-field 
            [Record]="record"
            [ShowLabel]="true"
            FieldName="ResolvedAt"
            Type="datepicker"
            [EditMode]="EditMode"

        <mj-form-field

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="after-fields" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>

    <!-- ========================================
         RELATED ENTITY PANELS
         ======================================== -->

    <!-- Agent Channel Participants Section -->
    <mj-collapsible-panel
        SectionKey="mJAgentChannelParticipants"
        SectionName="Agent Channel Participants"
        Icon="fa fa-table"
        Variant="related-entity"
        [Form]="this"
        [FormContext]="formContext"
        [BadgeCount]="GetSectionRowCount('mJAgentChannelParticipants')"
        [DefaultExpanded]="false">
        @if (record.IsSaved) {
        <div>
            <mj-explorer-entity-data-grid
                [Params]="BuildRelationshipViewParamsByEntityName('MJ: Agent Channel Participants','AgentChannelID')"
                [NewRecordValues]="NewRecordValues('MJ: Agent Channel Participants','AgentChannelID')"
                [AllowLoad]="IsSectionExpanded('mJAgentChannelParticipants')"
                [ShowToolbar]="true"
                (Navigate)="OnFormNavigate($event)"
                (AfterDataLoad)="SetSectionRowCount('mJAgentChannelParticipants', $event.totalRowCount)"
                >
            </mj-explorer-entity-data-grid>
        </div>
        }
    </mj-collapsible-panel>

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="after-related" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>
</mj-record-form-container>
