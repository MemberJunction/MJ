<!-- Modal Backdrop -->
@if (ShowDialog) {
  <div class="modal-backdrop" (click)="Close()" role="presentation"></div>
  <div
    class="modal-dialog full-screen-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="app-config-title"
  >
    <!-- Dialog Header -->
    <div class="modal-header">
      <h2 class="modal-title" id="app-config-title">
        <i class="fa-solid fa-grip" aria-hidden="true"></i>
        Configure Apps
      </h2>
      <button
        class="modal-close"
        (click)="Close()"
        aria-label="Close dialog"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <mj-user-app-config-content
      [Provider]="Provider"
      (Saved)="OnContentSaved()"
      (Cancelled)="Close()">
    </mj-user-app-config-content>
  </div>
}
