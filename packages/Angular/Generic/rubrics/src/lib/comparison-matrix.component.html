<section class="rubric-panel" aria-label="Comparison matrix">
  <h3>Evaluator comparison</h3>
  <div class="rubric-columns">
    <div>
      <p>Criterion</p>
      @for (row of Model.rows; track row.key) {
        <p><strong>{{ row.key }}</strong></p>
      }
    </div>
    @for (column of Shown; track column.id) {
      <div class="rubric-stack">
        <p>{{ column.name }}</p>
        @for (row of Model.rows; track row.key) {
          <p>{{ ScoreText(column, row.key) }}</p>
          <p>{{ RationaleText(column, row.key) }}</p>
        }
      </div>
    }
  </div>
</section>
