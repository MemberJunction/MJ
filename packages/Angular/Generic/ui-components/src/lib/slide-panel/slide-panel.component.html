<!-- Backdrop overlay -->
<div class="sp-backdrop"
  [class.sp-open]="IsVisible"
  [class.sp-dialog-backdrop]="Mode === 'dialog'"
  (click)="OnBackdropClick()">
</div>

<!-- Panel (slide-in from right) -->
@if (Mode === 'slide') {
  <div
    class="sp-panel"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="Title ? TitleId : null"
    [attr.aria-label]="Title ? null : (AriaLabel || null)"
    [attr.inert]="IsVisible ? null : ''"
    [class.sp-open]="IsVisible"
    [style.width.px]="WidthPx"
    [style.max-width]="(MaxWidthRatio * 100) + 'vw'"
    (keydown)="OnPanelKeyDown($event)">
    <!-- Resize handle -->
    @if (Resizable) {
      <div class="sp-resize-handle" (mousedown)="OnResizeStart($event)">
        <div class="sp-resize-grip"></div>
      </div>
    }
    <!-- Header (if Title provided) -->
    @if (Title) {
      <div class="sp-header">
        <h2 class="sp-title" [attr.id]="TitleId">{{Title}}</h2>
        <button type="button" class="sp-close-btn" aria-label="Close" (click)="OnClose()">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    }
    <!-- Content projection -->
    <div class="sp-body">
      <ng-content></ng-content>
    </div>
  </div>
}

<!-- Dialog (centered modal) -->
@if (Mode === 'dialog') {
  <div
    class="sp-dialog"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="Title ? TitleId : null"
    [attr.aria-label]="Title ? null : (AriaLabel || null)"
    [attr.inert]="IsVisible ? null : ''"
    [class.sp-open]="IsVisible"
    [style.width.px]="WidthPx"
    (keydown)="OnPanelKeyDown($event)">
    <!-- Header (if Title provided) -->
    @if (Title) {
      <div class="sp-header">
        <h2 class="sp-title" [attr.id]="TitleId">{{Title}}</h2>
        <button type="button" class="sp-close-btn" aria-label="Close" (click)="OnClose()">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    }
    <!-- Content projection -->
    <div class="sp-body sp-dialog-body">
      <ng-content select="[dialog-content]"></ng-content>
    </div>
  </div>
}
