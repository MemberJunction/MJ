<div class="tgdbg">
  @if (ShowChrome) {
    <div class="tgdbg-chrome">
      <mj-task-graph-debug-toolbar
        [Paused]="Paused"
        [Busy]="Busy"
        [Settled]="IsSettled"
        [Enabled]="Enabled && !Busy"
        [ShowXRayToggle]="true"
        [XRayEnabled]="XRayEnabled"
        [ShowBlastRadiusToggle]="true"
        [BlastRadiusEnabled]="BlastRadiusEnabled"
        [BreakpointCount]="Breakpoints.length"
        [EnginePulseText]="EnginePulseText"
        (Pause)="Pause()"
        (Resume)="Resume()"
        (Step)="Step('one')"
        (StepWave)="Step('wave')"
        (Cancel)="Cancel()"
        (XRayToggled)="OnToggleXRay($event)"
        (BlastRadiusToggled)="OnToggleBlastRadius($event)">
      </mj-task-graph-debug-toolbar>
      @if (ControlError) {
        <mj-alert Variant="error" [Message]="ControlError"></mj-alert>
      }
    </div>
  }
  <div class="tgdbg-body">
    <mj-task-graph-run-view
      [Provider]="ProviderToUse"
      [ParentTaskID]="ParentTaskID"
      [WorkflowName]="WorkflowName"
      [LiveUpdates]="LiveUpdates"
      [PollIntervalSeconds]="PollIntervalSeconds"
      [Height]="'100%'"
      [Density]="Density"
      [XRayEnabled]="XRayEnabled"
      [BlastRadiusTaskIDs]="BlastRadiusTaskIDs"
      [CanStepSingle]="Paused && !IsSettled"
      [ShowReplayScrubber]="ShowReplayScrubber"
      [ShowLegend]="ShowLegend"
      [ShowToolbar]="ShowCanvasToolbar"
      [ToolbarVisibility]="ToolbarVisibility"
      [ToolbarAlign]="ToolbarAlign"
      [LiveFrame]="LatestFrame"
      [ReplayAt]="ReplayAt"
      [Breakpoints]="Breakpoints"
      [PausedAtTaskID]="PausedAtTaskID"
      [GraphPaused]="Paused"
      [EdgeOverrides]="EdgeOverrides"
      [AllowBreakpointEditing]="AllowBreakpointEditing"
      [ShowVariables]="ShowVariables"
      [Invocation]="Invocation"
      (NodeSelected)="OnRunNodeSelected($event)"
      (ConnectionSelected)="OnRunConnectionSelected($event)"
      (LegendToggled)="LegendToggled.emit($event)"
      (Settled)="OnRunSettled()"
      (BreakpointToggled)="OnRunBreakpointToggled($event)"
      [RememberedStepIDs]="RememberedStepIDs"
      [AllowRememberBreakpoints]="AllowRememberBreakpoints"
      (RememberBreakpointToggled)="RememberBreakpointToggled.emit($event)"
      (EdgeOverrideRequested)="OnRunEdgeOverride($event)"
      (RunStepRequested)="OnRunStepRequested($event)"
      (RetryStepRequested)="OnRetryStepRequested($event)"
      (BlastRadiusRequested)="OnBlastRadiusRequested($event)"
      (ExpandRequested)="ExpandRequested.emit()">
    </mj-task-graph-run-view>
  </div>
</div>
