<div class="mj-flow-palette" [class.mj-flow-palette--collapsed]="Collapsed">
  <div class="mj-flow-palette-header">
    <i class="fa-solid fa-puzzle-piece"></i>
    @if (!Collapsed) {
      <span>Steps</span>
    }
  </div>

  @if (!Collapsed) {
    <div class="mj-flow-palette-content">
      @for (category of categories; track category) {
        <div class="mj-flow-palette-category">
          <div class="mj-flow-palette-category-label">{{ category }}</div>
          @for (nodeType of GetTypesForCategory(category); track nodeType) {
            <!-- A real <button>, not a <div>: clicking a palette entry is the gesture most people
                 try first, and it used to do literally nothing. The button also brings keyboard
                 activation and a focus ring with it. fExternalItem still supplies drag-to-place. -->
            <button
              type="button"
              class="mj-flow-palette-item"
              fExternalItem
              [fData]="nodeType.Type"
              [title]="'Click to add a ' + nodeType.Label + ', or drag it onto the canvas'"
              (click)="OnNodeTypeActivated(nodeType)">
              <span class="mj-flow-palette-item-icon" [style.backgroundColor]="GetBgColor(nodeType.Color, 0.08)" [style.color]="nodeType.Color">
                <i class="fa-solid" [ngClass]="nodeType.Icon"></i>
              </span>
              <span class="mj-flow-palette-item-label">{{ nodeType.Label }}</span>
            </button>
          }
        </div>
      }
    </div>
  }
</div>
