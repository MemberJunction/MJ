<!-- The shared mj-dialog: 700px on desktop; full-screen on phones. The harness's actions live in
     the dialog footer (pinned on every screen), so the harness hides its own button row. No footer Close:
     the title bar's close is the one way out. -->
<mj-dialog [Visible]="IsOpen" [Title]="DialogTitle" [Width]="700" (Close)="OnClose()">
    @if (Action) {
        <mj-action-test-harness
            [Action]="Action"
            [ActionParams]="ActionParams"
            [ShowActionButtons]="false"
            (StateChange)="OnHarnessStateChange()"
            (ExecutionComplete)="OnExecutionComplete($event)">
        </mj-action-test-harness>
    } @else {
        <div class="loading-state">
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            Loading...
        </div>
    }

    <mj-dialog-actions>
        <button mjButton variant="primary" class="harness-run" [disabled]="!CanRun" (click)="RunAction()">
            @if (IsRunning) {
                <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Executing...
            } @else {
                <i class="fa-solid fa-play" aria-hidden="true"></i> Execute Action
            }
        </button>
        <button mjButton variant="secondary" [disabled]="!Action || IsRunning" (click)="ResetHarness()">
            <i class="fa-solid fa-undo" aria-hidden="true"></i> Reset
        </button>
        @if (HasResults) {
            <button mjButton variant="secondary" [disabled]="IsRunning" (click)="ClearHarnessResults()">
                <i class="fa-solid fa-trash" aria-hidden="true"></i> Clear Results
            </button>
        }
    </mj-dialog-actions>
</mj-dialog>
