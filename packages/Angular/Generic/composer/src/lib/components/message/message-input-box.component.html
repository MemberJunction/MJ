<div class="message-input-box-container" (click)="OnContainerClick($event)">
  <div class="input-wrapper">
    <mj-mention-editor
      #mentionEditor
      [placeholder]="Placeholder"
      [disabled]="Disabled"
      [currentUser]="CurrentUser"
      [enableMentions]="EnableMentions"
      [TriggerProviders]="TriggerProviders"
      [ExcludedTriggerKeys]="ExcludedTriggerKeys"
      [Provider]="Provider"
      [enableAttachments]="EnableAttachments"
      [maxAttachments]="MaxAttachments"
      [maxAttachmentSizeBytes]="MaxAttachmentSizeBytes"
      [acceptedFileTypes]="AcceptedFileTypes"
      [(ngModel)]="Value"
      (valueChange)="OnValueChange($event)"
      (enterPressed)="OnEnterPressed($event)"
      (mentionSelected)="OnMentionSelected($event)"
      (attachmentsChanged)="OnAttachmentsChanged($event)"
      (attachmentError)="OnAttachmentError($event)"
      (attachmentClicked)="OnAttachmentClicked($event)"
      (editorBlurred)="Blurred.emit()">
    </mj-mention-editor>

    <!-- Action row: its own strip below the editor (not floating over it), so text never runs behind a button -->
    <div class="composer-actions">
      <!-- Status line, left of the action row: what the host is waiting on ("Sage is working"). A polite
           live region; the elapsed time is a pill in an aria-hidden child so its ticking is never announced. -->
      @if (StatusText) {
        <div class="send-slot-status" [class.send-slot-status--stopping]="SendSlotMode === 'stopping'" role="status" aria-live="polite">
          <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
          <span class="send-slot-status-text">{{ StatusText }}</span>
          @if (StatusElapsed) {
            <span class="send-slot-status-elapsed" aria-hidden="true">{{ StatusElapsed }}</span>
          }
        </div>
      }

      @if (EnableAttachments || EnableRealtime || EnablePlanMode || EnableSkills) {
        <div class="attach-buttons">
          @if (EnableSkills) {
          <button
            class="attach-button-icon skills-button-icon"
            [class.skills-button-icon--active]="SkillsActive"
            [disabled]="Disabled"
            [attr.aria-expanded]="SkillsActive"
            aria-haspopup="true"
            (mousedown)="$event.preventDefault(); $event.stopPropagation()"
            (click)="OnSkillsClick($event); $event.stopPropagation()"
            title="Skills, or type / in the message box"
            aria-label="Show skills"
            >
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
          </button>
          }
          @if (EnablePlanMode) {
          <button
            class="attach-button-icon plan-mode-button-icon"
            [class.plan-mode-button-icon--active]="PlanModeActive"
            [disabled]="Disabled"
            [attr.aria-pressed]="PlanModeActive"
            (click)="PlanModeToggle.emit(); $event.stopPropagation()"
            [title]="PlanModeActive ? 'Plan Mode ON — the agent presents a plan for your approval before it acts' : 'Plan Mode: have the agent present a plan for your approval before it acts'"
            aria-label="Toggle Plan Mode"
            >
            <i class="fa-solid fa-route" aria-hidden="true"></i>
          </button>
          }
          @if (EnableAttachments) {
          <button
            class="attach-button-icon"
            [disabled]="Disabled"
            (click)="OpenFilePicker(); $event.stopPropagation()"
            title="Attach file"
            >
            <i class="fa-solid fa-paperclip"></i>
          </button>
          }
          @if (EnableRealtime) {
          <button
            class="attach-button-icon voice-button-icon"
            [class.voice-button-icon--active]="VoiceActive"
            [disabled]="!CanStartRealtime"
            (click)="OnRealtimeClick(); $event.stopPropagation()"
            [title]="VoiceActive ? 'Voice call active' : 'Start a voice call'"
            aria-label="Start a voice call"
            >
            <i class="fa-solid fa-phone" aria-hidden="true"></i>
          </button>
          <!-- Caret beside the phone: opens the agent/model picker so call OPTIONS stay one
               click away while the plain phone click keeps its instant-start behavior. -->
          <button
            class="attach-button-icon voice-options-button-icon"
            [disabled]="!CanStartRealtime"
            (click)="OnRealtimeOptionsClick(); $event.stopPropagation()"
            title="Voice call options (choose agent and voice model)"
            aria-label="Voice call options"
            >
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          }
        </div>
      }

      <!-- The send slot. ONE button in every mode (send / stop / stopping) so focus is kept across the
           change; see SendSlotMode. -->
      <button
        class="send-button-icon"
        [class.send-button-icon--stop]="SendSlotMode === 'stop'"
        [class.send-button-icon--stop-all]="IsStopAll"
        [class.send-button-icon--stopping]="SendSlotMode === 'stopping'"
        [disabled]="SendSlotDisabled"
        (click)="OnSendSlotClick()"
        [title]="SendSlotLabel"
        [attr.aria-label]="SendSlotLabel"
        [attr.aria-busy]="SendSlotMode === 'stopping' ? true : null"
        >
        @switch (SendSlotMode) {
          @case ('stop') {
            <i class="fa-solid fa-stop" aria-hidden="true"></i>
            @if (IsStopAll) {
              <span class="send-slot-label">Stop all</span>
              <span class="send-slot-count">{{ StopCount }}</span>
            }
          }
          @case ('stopping') {
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
          }
          @default {
            <i class="fa-solid fa-paper-plane"></i>
          }
        }
      </button>
    </div>
  </div>
</div>
