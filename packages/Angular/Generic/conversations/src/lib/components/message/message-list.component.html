<div class="message-list-container" #scrollContainer>
  <!-- Sticky Date Header (only show for long conversations spanning multiple days) -->
  @if (showDateNavigation && shouldShowDateFilter && messages.length > 0) {
    <div class="sticky-date-header">
      <div class="sticky-date-wrapper">
        <button class="sticky-date-button" (click)="toggleDateNav()">
          <span>{{ currentDateDisplay }}</span>
          <i class="fas fa-chevron-down"></i>
        </button>
        <div class="date-nav-dropdown" [class.show]="showDateNav">
          <div class="date-nav-option jump-to">Jump to...</div>
          <div class="date-nav-option" (click)="jumpToDate('today')">Today</div>
          <div class="date-nav-option" (click)="jumpToDate('yesterday')">Yesterday</div>
          <div class="date-nav-option" (click)="jumpToDate('last-week')">Last week</div>
          <div class="date-nav-option" (click)="jumpToDate('last-month')">Last month</div>
        </div>
      </div>
    </div>
  }

  <!-- Windowed transcript: older pages load when this scrolls into view (IntersectionObserver
       in the component, not a scroll listener). Absent entirely once the top is reached. -->
  @if (HasMoreAbove) {
    <div #olderSentinel class="transcript-older-sentinel">
      @if (IsLoadingOlder) {
        <mj-loading text="Loading earlier messages…" size="small"></mj-loading>
      } @else {
        <span class="transcript-older-label">Earlier messages</span>
      }
    </div>
  }

  <!-- Height-holding stand-in for a timeline item that has been unmounted to keep the DOM
       bounded. Declared here but rendered into #messageContainer at the item's own index,
       so scroll geometry is unchanged. -->
  <ng-template #spacerTemplate let-height="height">
    <div class="transcript-spacer" [style.height.px]="height" aria-hidden="true"></div>
  </ng-template>

  <ng-container #messageContainer></ng-container>

  @if (messages.length === 0 && showEmptyFill) {
    <mj-empty-state
      class="messages-empty-fill"
      Icon="fa-solid fa-comments"
      Title="No messages yet. Start a conversation!" />
  }
</div>
