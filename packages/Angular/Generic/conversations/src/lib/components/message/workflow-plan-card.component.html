@if (Spec) {
  <div class="mj-wpc" [class.mj-wpc--expanded]="Expanded">
    <button type="button" class="mj-wpc__header" (click)="ToggleExpanded()"
            [attr.aria-expanded]="Expanded">
      <i class="fa-solid" [class.fa-chevron-right]="!Expanded" [class.fa-chevron-down]="Expanded"></i>
      <span class="mj-wpc__title">{{ Spec.workflowName }}</span>
      <span class="mj-wpc__summary">{{ SummaryLine }}</span>
      @if (IsFinished) {
        <i class="fa-solid fa-circle-check mj-wpc__done" aria-label="Finished"></i>
      }
    </button>

    @if (Expanded) {
      <div class="mj-wpc__body">
        <!-- The SAME component the editor uses, read-only. A simpler chat-only renderer would be a
             second thing that can disagree with the canvas about what a graph means. -->
        <mj-task-graph-editor
          class="mj-wpc__canvas"
          [Spec]="Spec"
          [RuntimeStatus]="RuntimeStatus"
          [ReadOnly]="true"
          [ShowPalette]="false"
          [ShowToolbar]="false"
          [ShowMinimap]="false">
        </mj-task-graph-editor>

        @if (CanSave) {
          <!-- Name it inline, then offer the editor (ratified answer ④). No trigger is requested
               here: saving is capture, not scheduling. -->
          <div class="mj-wpc__actions">
            <input
              class="mj-wpc__name"
              type="text"
              aria-label="Workflow name"
              [ngModel]="EffectiveName"
              (ngModelChange)="OnNameChanged($event)" />
            <button mjButton variant="primary" size="sm" [disabled]="!CanCommit" (click)="RequestSave(false)">
              <i class="fa-solid fa-floppy-disk"></i> Save as Workflow
            </button>
            <button mjButton variant="secondary" size="sm" [disabled]="!CanCommit" (click)="RequestSave(true)">
              Open in editor
            </button>
          </div>
          <p class="mj-wpc__note">Saved workflows run on demand until you give them a schedule.</p>
        }
      </div>
    }
  </div>
}
