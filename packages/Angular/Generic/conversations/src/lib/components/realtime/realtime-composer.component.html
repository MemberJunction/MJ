@if (StripMode && Compact) {
  <!-- COMPACT (Calm Orb · overlay): the lean dock — a "•••" that blooms a small sheet with the secondary actions
       (Details / Type), a first-class Captions toggle (text stays ONE TAP in the overlay), the microphone (the call's
       media controls) and a red End. Circles from the design system. -->
  <div class="dock-lean" role="group" aria-label="Call controls">
    <div class="lean-more" [class.lean-more--open]="MoreOpen">
      <div class="lean-sheet" (click)="$event.stopPropagation()" role="menu" aria-label="More call controls">
        @if (ShowDetails) {
          <button type="button" class="lean-sheet__btn" [class.lean-sheet__btn--on]="DetailsOn"
                  (click)="DetailsToggled.emit(); MoreOpen = false"
                  [title]="DetailsOn ? 'Hide the session panels' : 'Peek at the session panels'"
                  [attr.aria-pressed]="DetailsOn">
            <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
            <small>Details</small>
          </button>
        }
        <button type="button" class="lean-sheet__btn"
                (click)="OpenChanged.emit(true); MoreOpen = false"
                title="Type into the live session" aria-label="Open the typed-input composer">
          <i class="fa-regular fa-keyboard" aria-hidden="true"></i>
          <small>Type</small>
        </button>
      </div>
      <button type="button" mjButton Shape="circle" [Variant]="MoreOpen ? 'primary' : 'secondary'"
              AriaLabel="More call controls" title="More controls"
              [attr.aria-expanded]="MoreOpen"
              (click)="ToggleMore($event)">
        <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Captions: first-class in the lean dock (the overlay's only text toggle now). -->
    <button type="button" mjButton Shape="circle" [Toggleable]="true" [Selected]="CaptionsOn"
            AriaLabel="Captions" [title]="CaptionsTitle"
            (click)="ToggleCaptions()">
      <i class="fa-solid fa-closed-captioning" aria-hidden="true"></i>
    </button>

    <mj-media-controls Size="lg" [MicrophoneOn]="!IsMuted" [ShowCamera]="false" [ShowShare]="false"
                       (MicrophoneToggled)="ToggleMute()"></mj-media-controls>

    <button type="button" mjButton Shape="circle" Size="lg" Variant="danger"
            AriaLabel="End call" title="End call" (click)="EndRequested.emit()">
      <i class="fa-solid fa-phone-slash" aria-hidden="true"></i>
    </button>
  </div>
} @else if (StripMode) {
  <!-- Levels 0–1: phone-call strip — big labelled circles, nothing to configure: the call's media controls (the
       microphone), Captions (level 1+, arriving WITH the text it controls), the Details peek at the surface panels, Type,
       and End call, the deliberate rightmost action. -->
  <div class="strip" role="group" aria-label="Call controls">
    <mj-media-controls class="strip__media" Size="lg" [ShowLabels]="true" [MicrophoneOn]="!IsMuted"
                       [ShowCamera]="false" [ShowShare]="false"
                       (MicrophoneToggled)="ToggleMute()"></mj-media-controls>

    <div class="ctrl-group">
      <button type="button" mjButton Shape="circle" Size="lg" [Toggleable]="true" [Selected]="CaptionsOn"
              AriaLabel="Captions" [title]="CaptionsTitle"
              (click)="ToggleCaptions()">
        <i class="fa-solid fa-closed-captioning" aria-hidden="true"></i>
      </button>
      <span class="ctrl-label" aria-hidden="true">Captions</span>
    </div>

    @if (ShowDetails) {
      <div class="ctrl-group">
        <button type="button" mjButton Shape="circle" Size="lg" [Toggleable]="true" [Selected]="DetailsOn"
                AriaLabel="Details" [title]="DetailsOn ? 'Hide the session panels' : 'Peek at the session panels'"
                (click)="DetailsToggled.emit()">
          <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
        </button>
        <span class="ctrl-label" aria-hidden="true">Details</span>
      </div>
    }

    <div class="ctrl-group">
      <button type="button" mjButton Shape="circle" Size="lg"
              AriaLabel="Open the typed-input composer" title="Type into the live session"
              (click)="OpenChanged.emit(true)">
        <i class="fa-regular fa-keyboard" aria-hidden="true"></i>
      </button>
      <span class="ctrl-label" aria-hidden="true">Type</span>
    </div>

    <div class="ctrl-group">
      <button type="button" mjButton Shape="circle" Size="lg" Variant="danger"
              AriaLabel="End call" title="End call" (click)="EndRequested.emit()">
        <i class="fa-solid fa-phone-slash" aria-hidden="true"></i>
      </button>
      <span class="ctrl-label ctrl-label--end" aria-hidden="true">End call</span>
    </div>
  </div>
} @else {
  <!-- Level 2+: the fused dock — small circles and the in-call composer in ONE bottom bar. -->
  <div class="dock">
    <div class="dock__minis">
      <mj-media-controls Size="sm" [MicrophoneOn]="!IsMuted" [ShowCamera]="false" [ShowShare]="false"
                         (MicrophoneToggled)="ToggleMute()"></mj-media-controls>
      <button type="button" mjButton Shape="circle" Size="sm" [Toggleable]="true" [Selected]="CaptionsOn"
              AriaLabel="Captions" [title]="CaptionsTitle"
              (click)="ToggleCaptions()">
        <i class="fa-solid fa-closed-captioning" aria-hidden="true"></i>
      </button>
      @if (ShowDetails) {
        <button type="button" mjButton Shape="circle" Size="sm" [Toggleable]="true" [Selected]="DetailsOn"
                AriaLabel="Details" [title]="DetailsOn ? 'Hide the session panels' : 'Show the session panels'"
                (click)="DetailsToggled.emit()">
          <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
        </button>
      }
    </div>
    <div class="dock__box">
      <textarea
        #dockInput
        class="dock__input"
        rows="1"
        placeholder="Type into the live session — joins this same voice call…"
        [(ngModel)]="Draft"
        (keydown)="OnKeydown($event)"
        (input)="AutoResize()"
        aria-label="Type a message into the live voice session"></textarea>
      <span class="dock__hint" aria-hidden="true">↵ send</span>
      <button
        class="dock__send"
        type="button"
        [disabled]="!CanSend"
        (click)="Send()"
        title="Send into live session"
        aria-label="Send">
        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
      </button>
    </div>
    <button type="button" mjButton Shape="circle" Size="sm" class="dock__hide"
            AriaLabel="Close the typed-input composer" title="Hide typing — back to the voice controls"
            (click)="OpenChanged.emit(false)">
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
    <button type="button" mjButton Shape="circle" Size="sm" Variant="danger"
            AriaLabel="End call" title="End call" (click)="EndRequested.emit()">
      <i class="fa-solid fa-phone-slash" aria-hidden="true"></i>
    </button>
  </div>
}
