<div class="avatar" [class.avatar--speaking]="OrbState === 'speaking'">
  <mj-media-tile
    class="avatar__tile"
    [Participant]="Agent"
    [ShowMeter]="false"
    [ShowConnectionQuality]="false"
    [ShowActiveSpeakerRing]="false"
    [StallAfterMs]="StallAfterMs"
    [HoldLastFrame]="HoldLastFrame"
    [Status]="StatusLabel"
    (FramesFlowingChange)="OnFramesFlowingChange($event)">
    <mj-realtime-agent-orb mjMediaTilePlaceholder class="avatar__orb" [State]="OrbState"></mj-realtime-agent-orb>
  </mj-media-tile>
</div>
