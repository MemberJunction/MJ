  /rpc/{accountId}/sendMessage:
    post:
      summary: Send message to specific contact
      description: '---'
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        description: Contact ID of recipient and message text
        required: true
      tags:
