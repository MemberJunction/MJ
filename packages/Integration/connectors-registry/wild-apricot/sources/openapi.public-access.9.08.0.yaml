  /rpc/{accountId}/CancelRenewal:
    post:
      summary: Cancels a membership renewal
      description: '---'
      parameters:
        - $ref: '#/components/parameters/accountId'
      tags:
        - Membership
      responses:
        '200':
          description: Result of membership renewal - invoice to pay if any
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
