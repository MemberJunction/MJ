        '401':
          $ref: '#/components/responses/unauthorized'
        '428':
          $ref: '#/components/responses/termsOfUseRequired'
        '429':
          $ref: '#/components/responses/tooManyRequests'
  /rpc/{accountId}/startPayment:
    post:
