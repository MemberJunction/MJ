[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR
strict = True

# scikit-learn 1.4.2 ships no type stubs or py.typed marker: exempted from import analysis.
[mypy-sklearn.*]
ignore_missing_imports = True

# statsmodels 0.15.0 ships no type stubs or py.typed marker and no stub package exists: exempted like sklearn.
[mypy-statsmodels.*]
ignore_missing_imports = True

# scipy 1.17.1 ships no py.typed marker and the venv has no scipy-stubs: exempted like sklearn and statsmodels.
[mypy-scipy.*]
ignore_missing_imports = True

# threadpoolctl 3.7.0 ships no type stubs or py.typed marker and no stub package exists: exempted like sklearn.
[mypy-threadpoolctl.*]
ignore_missing_imports = True

# joblib 1.4.2 ships no type stubs or py.typed marker and no stub package exists: exempted like sklearn.
[mypy-joblib.*]
ignore_missing_imports = True
