[pytest]
# Run from this directory so `app` (the FastAPI package) and `tests` resolve as
# top-level imports — matches the original docker/predictive-studio-sidecar layout.
testpaths = tests
# tests/gates are planted-truth gate measurements: they read the truth suite's data
# cache through `truthsuite`, which only the TruthSuite venv (with TruthSuite/python on
# PYTHONPATH) carries, so the product venv's default run leaves them out. They run by
# explicit node id through the integration suite's PsGatePytest, in the TruthSuite venv.
addopts = -q --ignore=tests/gates
# Third-party notices about the pinned libraries' own APIs, not about the sidecar: SciPy deprecates L-BFGS-B options
# scikit-learn 1.4 still passes on every logistic/GLM fit; starlette's test client imports names python-multipart and
# anyio have renamed. The MLP driver's stochastic optimizer stopping at its iteration budget (200 on the legacy /train
# path, 500 on the trainer, shorter caps in the fast reproducibility tests) is the fit the driver delivers and is scored
# as such; only that message is silenced, so a non-converging logistic, GLM or calibration fit still warns. These filters
# are the suite's one owner of warning policy: no test file adds its own.
filterwarnings =
    ignore:scipy.optimize. The `disp` and `iprint` options:DeprecationWarning
    ignore:Stochastic Optimizer:sklearn.exceptions.ConvergenceWarning
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
