<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: 'Roboto';
      src: url('assets/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 720px;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #card {
      padding: 32px 48px;
      border-radius: 16px;
      background: #1e293b;
      border: 4px solid #38bdf8;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #badge { width: 64px; height: 64px; display: block; }
    #title { font-size: 42px; font-weight: 400; }
    #noise { font-size: 28px; color: #e2e8f0; }
    #clock { font-size: 28px; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="golden-comp" data-duration="3" data-fps="30" data-width="1280" data-height="720">
    <audio id="tone" src="assets/tone.wav" data-start="0" data-duration="3"></audio>
    <div id="card" data-mj-bound>
      <img id="badge" src="assets/badge.png" alt="Badge" />
      <div id="title">Loading...</div>
      <div id="noise">0.000</div>
      <div id="clock">t=0.00s</div>
    </div>
  </div>
  <script>
    (function() {
      var titleEl = document.getElementById("title");
      var noiseEl = document.getElementById("noise");
      var clockEl = document.getElementById("clock");
      var cardEl = document.getElementById("card");
      var dataTitle = (window.MJVideo && window.MJVideo.Data && window.MJVideo.Data.Headline) || "Default";
      var noiseVal = window.MJVideo ? window.MJVideo.Noise("golden", 1) : 0;
      titleEl.textContent = String(dataTitle);
      noiseEl.textContent = noiseVal.toFixed(4);

      function updateAtTime(t) {
        var progress = Math.min(1, Math.max(0, t / 3));
        var hue = Math.round(200 + progress * 120);
        cardEl.style.background = "hsl(" + hue + ", 65%, 25%)";
        cardEl.style.transform = "scale(" + (0.9 + progress * 0.1).toFixed(3) + ")";
        clockEl.textContent = "t=" + t.toFixed(2) + "s";
      }

      if (window.MJVideo && typeof window.MJVideo.OnFrame === "function") {
        window.MJVideo.OnFrame(updateAtTime);
      }
      updateAtTime(0);
    })();
  </script>
</body>
</html>
