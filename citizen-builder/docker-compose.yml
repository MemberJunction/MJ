name: mj-citizen-builder

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-TestPassword123!}"
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -No
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql

  mj:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Required: the CLI and MemberJunction release inside the container must match the CLI
        # that scaffolded this workspace. `mj agent init` writes it to .env.
        MJ_VERSION: "${MJ_VERSION:?MJ_VERSION is not set in .env - re-run mj agent init, or set it to the MemberJunction version to install}"
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
      - "${EXPLORER_PORT:-4202}:4200"
    environment:
      DB_HOST: "sqlserver"
      DB_PORT: "1433"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD:-TestPassword123!}"
      DB_DATABASE: "${DB_DATABASE:-MemberJunction}"
      # Tells the entrypoint which MemberJunction release `mj install` must fetch
      MJ_VERSION: "${MJ_VERSION}"
      MJ_BASE_ENCRYPTION_KEY: "${MJ_BASE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}"
      # LLM Provider API Keys
      AI_VENDOR_API_KEY__OpenAILLM: "${OPENAI_API_KEY:-}"
      AI_VENDOR_API_KEY__AnthropicLLM: "${ANTHROPIC_API_KEY:-}"
      AI_VENDOR_API_KEY__GeminiLLM: "${GEMINI_API_KEY:-}"
      AI_VENDOR_API_KEY__GroqLLM: "${GROQ_API_KEY:-}"
      AI_VENDOR_API_KEY__MistralLLM: "${MISTRAL_API_KEY:-}"
      # Business Context Open App (More Cheese default or custom enterprise app)
      OPEN_APP_INSTALL_URL: "${OPEN_APP_INSTALL_URL:-https://github.com/MemberJunction/more-cheese}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    volumes:
      - mj-workspace:/workspace
      - ./metadata:/work/metadata
      - ./scripts:/work/scripts
      - ./dist:/work/dist
    entrypoint: ["/bin/bash", "/work/scripts/docker-entrypoint.sh"]

volumes:
  sqlserver-data:
  mj-workspace:
