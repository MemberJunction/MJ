map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy GraphQL API requests to mjapi (eliminates CORS + DNS issues)
    location /api/ {
        proxy_pass http://mjapi:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Public pages: /p/<slug> gets the page's build-time HTML file (its title, link preview and
    # security policy). Every other /p/ address gets the fallback file, which has the same policy.
    # Without the files, index.html answers, and Explorer's main.ts shows the page.
    # These rules come before the static asset rule, so a sub-path such as /p/docs/diagram.png
    # gets the page.
    location ~ ^/p/([a-z0-9-]+)(/|$) {
        try_files /public-pages/$1.html /public-pages/_fallback.html /index.html;
    }
    location ~ ^/p/ {
        try_files /public-pages/_fallback.html /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
